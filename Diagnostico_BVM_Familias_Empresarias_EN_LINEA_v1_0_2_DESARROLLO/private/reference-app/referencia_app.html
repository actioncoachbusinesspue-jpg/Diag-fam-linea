// Contenido reutilizable de Metodología (sin título ni contenedor).
AdminDashboard.renderMethodologyBody = function(){
  return (
    '<div class="card card--technical" style="margin-bottom:16px;">' +
      '<div class="dim-mini-label">Modelo interpretativo</div>' +
      '<p class="body-text" style="margin-top:6px;">'+INTERPRETATION_RULES.disclaimers.noValidation+'</p>' +
    '</div>' +

    // v1.6: se declaran las dos reglas que modifican la interpretación. Antes
    // operaban de forma correcta pero no estaban documentadas, de modo que un
    // consultor no podía explicar por qué el reporte decía lo que decía.
    '<div class="card card--technical" style="margin-bottom:16px;">' +
      '<div class="dim-mini-label">Mínimo para interpretar la alineación</div>' +
      '<p class="body-text" style="margin-top:6px;">La coincidencia de percepción se calcula a partir de la dispersión entre respuestas. Con menos de ' +
      SCORING_CONFIG.minParticipationsForAlignment + ' participaciones finalizadas esa dispersión no sostiene una conclusión ' +
      '(con una sola participación es cero por definición matemática, no por acuerdo), por lo que el reporte lo declara ' +
      'explícitamente en lugar de afirmar un nivel de coincidencia. En ese caso la dispersión tampoco se incorpora al cálculo ' +
      'de la matriz de riesgo y oportunidad, y los pesos restantes se reescalan.</p>' +
    '</div>' +

    '<div class="card card--technical" style="margin-bottom:16px;">' +
      '<div class="dim-mini-label">Brecha severa en una dimensión</div>' +
      '<p class="body-text" style="margin-top:6px;">El índice general es un promedio de las cuatro dimensiones, de modo que una brecha severa en una sola ' +
      'puede quedar diluida. Para evitar una lectura contradictoria, ninguna familia con una dimensión por debajo de 40 de 100 ' +
      'se clasifica como consolidada, sin importar los promedios generales: la posición se reencuadra según dónde se ubique la brecha.</p>' +
    '</div>' +

    '<div class="card" style="margin-bottom:16px;">' +
      '<h3 class="h3">Índice general de madurez</h3>' +
      '<p class="body-text" style="margin-top:10px;">Se calcula a partir de las 20 afirmaciones valuatorias (5 por dimensión: relaciones familiares, gobierno y toma de decisiones, desarrollo del patrimonio, continuidad y legado). Ya no existen señales especiales: las 20 afirmaciones participan por igual en el índice general.</p>' +
    '</div>' +

    '<div class="bvm-emphasis bvm-emphasis--left" style="margin-bottom:16px;">' +
      '<span class="eyebrow">Peso igual de las dimensiones</span>' +
      '<p style="margin-top:8px;">El índice general asigna el mismo peso (25%) a cada una de las cuatro dimensiones. Esta decisión responde al supuesto provisional de que las cuatro capacidades representan componentes estratégicos equivalentes del modelo BVM. Esta ponderación forma parte del modelo interpretativo provisional y deberá revisarse con base en la experiencia de aplicación.</p>' +
    '</div>' +

    '<div class="card card--technical" style="margin-bottom:16px;">' +
      '<h3 class="h3">Normalización a escala 0-100</h3>' +
      '<p class="body-text" style="margin-top:8px;">Cada promedio dimensional (escala 1 a 5) se convierte a un índice de 0 a 100 mediante <code style="color:var(--bvm-gold);font-weight:600;">((promedio − 1) / 4) × 100</code>. El índice general es el promedio simple de los cuatro índices dimensionales ya normalizados.</p>' +
      '<p class="body-text" style="margin-top:8px;">La matriz de riesgo y oportunidad utiliza las brechas de estos mismos índices (1 − índice/100), sin ninguna señal especial adicional.</p>' +
    '</div>' +

    '<div class="dim-mini-label" style="margin-bottom:8px;">Preguntas externas (no valuatorias)</div>' +
    '<div class="method-module-grid" style="margin-bottom:16px;">' +
      '<div class="card"><div class="dim-mini-label">Prioridad a doce meses</div><p class="body-text" style="font-size:12.5px;margin-top:6px;">Qué tan prioritario considera la familia fortalecer estas capacidades. No participa en el índice, las dimensiones, el radar, la matriz ni el nivel de madurez.</p></div>' +
      '<div class="card"><div class="dim-mini-label">Disposición a participar</div><p class="body-text" style="font-size:12.5px;margin-top:6px;">Qué tan dispuestos estarían los participantes a iniciar un proceso de acompañamiento. Tampoco modifica ninguna calificación.</p></div>' +
    '</div>' +

    '<div class="card" style="margin-bottom:16px;">' +
      '<h3 class="h3">Niveles de madurez</h3>' +
      '<div class="dim-question-chip">0 a 19 — No existe</div>' +
      '<div class="dim-question-chip">20 a 39 — Incipiente</div>' +
      '<div class="dim-question-chip">40 a 59 — Parcial</div>' +
      '<div class="dim-question-chip">60 a 79 — Estable</div>' +
      '<div class="dim-question-chip">80 a 100 — Consolidado</div>' +
      '<h3 class="h3" style="margin-top:18px;">Rangos de dispersión perceptual (alineación)</h3>' +
      '<div class="dim-question-chip">0.00 a 0.49 — Alta coincidencia</div>' +
      '<div class="dim-question-chip">0.50 a 0.89 — Coincidencia moderada</div>' +
      '<div class="dim-question-chip">0.90 o más — Diferencias relevantes de percepción</div>' +
    '</div>' +

    '<div class="card card--technical">' +
      '<h3 class="h3">Alcances y limitaciones</h3>' +
      '<p class="body-text" style="margin-top:8px;">Este instrumento no posee validación psicométrica o científica. Los resultados sugieren líneas de conversación; no constituyen un diagnóstico clínico, una predicción exacta ni una probabilidad de conflicto.</p>' +
    '</div>'
  );
};

AdminDashboard.renderDatos = function(c){
  const demoLoaded = StorageAdapter.isDemoLoaded();
  const reportDateValue = c.cfg.reportDate || new Date().toISOString().slice(0,10);
  const cc = COPY_CONFIG.admin;
  const families = StorageAdapter.listFamilies();
  const activeFam = StorageAdapter.getActiveFamily();
  const participantRows = c.participants.length ? c.participants.map(function(p){
    const st = p.status==='finalizado' ? 'done' : (p.answers && p.answers.some(function(r){return r!=null;}) ? 'progress' : 'pending');
    const stLabel = st==='done' ? 'Finalizado' : (st==='progress' ? 'En proceso' : 'Pendiente');
    const meta = [p.generation, p.participationRole, p.participationType].filter(Boolean).join(' · ');
    const completed = p.completedAt ? ' · ' + fmtDate(p.completedAt) : '';
    return '<div class="participant-status-row"><span>'+escapeHtml(p.participantName)+(meta?' · '+escapeHtml(meta):'')+escapeHtml(completed)+'</span><span class="status-tag '+st+'">'+stLabel+'</span></div>';
  }).join('') : '<div style="padding:16px;color:var(--bvm-soft-gray);font-size:13.5px;">No hay participantes registrados todavía.</div>';

  const familyOptions = families.map(function(f){
    return '<option value="'+f.familyId+'"'+(activeFam && activeFam.familyId===f.familyId?' selected':'')+'>'+escapeHtml(f.familyName)+' ('+f.finishedCount+'/'+f.participantCount+')</option>';
  }).join('');

  // v1.2: "¿Dónde estoy? ¿Qué debo hacer ahora?" — una tarjeta que responde
  // según el estado real, no un texto genérico fijo.
  function nextActionCard(){
    let title, body, actionLabel, actionAttr;
    if(!activeFam){
      title = '¿Qué sigue? Crear su primera familia';
      body = 'Todavía no hay ninguna familia registrada. Cree una para poder abrir participaciones.';
      actionLabel = 'Crear familia'; actionAttr = 'data-action="focus-new-family"';
    } else if(c.finishedParticipants.length === 0){
      title = '¿Qué sigue? Reunir participaciones';
      body = 'La familia "'+escapeHtml(activeFam.familyName)+'" está activa, pero todavía no hay ninguna participación finalizada. Comparta el acceso con los integrantes para que respondan.';
      actionLabel = 'Ver participantes'; actionAttr = 'data-action="focus-participants"';
    } else {
      title = '¿Qué sigue? Revisar la radiografía';
      body = escapeHtml(activeFam.familyName)+' ya tiene '+c.finishedParticipants.length+' participación(es) finalizada(s). Puede revisar los resultados, generar el reporte o crear un respaldo.';
      actionLabel = 'Ver radiografía'; actionAttr = 'data-action="focus-radiografia"';
    }
    return '<div class="next-action-card">' +
      '<span class="eyebrow" style="color:var(--bvm-light-gold);">Siguiente acción recomendada</span>' +
      '<h3 class="h3" style="color:#fff;margin-top:6px;">'+escapeHtml(title)+'</h3>' +
      '<p style="color:var(--bvm-blue-gray);margin-top:6px;font-size:13.5px;">'+body+'</p>' +
      '<button class="btn btn-primary btn-compact" style="margin-top:12px;" '+actionAttr+'>'+escapeHtml(actionLabel)+'</button>' +
    '</div>';
  }
  const familySelectorHtml = (
    '<div class="data-mgmt-card" style="margin-bottom:16px;">' +
      '<h4>Familias reales registradas</h4>' +
      '<p>Cada familia tiene sus propios participantes y resultados; nunca se mezclan entre sí.</p>' +
      (families.length ?
        '<label class="field-label" for="familySelect" style="margin-top:6px;display:block;">Familia activa</label>' +
        '<select id="familySelect" class="bvm-input">'+familyOptions+'</select>' +
        '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">' +
          '<button class="btn btn-secondary btn-compact" data-action="rename-family">Renombrar</button>' +
          '<button class="btn btn-secondary btn-compact" data-action="archive-family" style="color:var(--bvm-risk);border-color:var(--bvm-risk);">Archivar familia</button>' +
        '</div>'
        : '<p style="color:var(--bvm-soft-gray);font-size:12.5px;">Todavía no hay ninguna familia real creada.</p>') +
      '<div style="margin-top:14px;display:flex;gap:8px;">' +
        '<input type="text" id="newFamilyName" class="bvm-input" placeholder="Nombre de la nueva familia">' +
        '<button class="btn btn-primary btn-compact" data-action="create-family" style="flex-shrink:0;">Crear familia</button>' +
      '</div>' +
    '</div>'
  );

  function taskCard(t, actionAttr, extra, danger){
    return '<div class="data-mgmt-card">' +
      '<h4>'+escapeHtml(t.title)+'</h4>' +
      '<p><strong>Qué hace:</strong> '+escapeHtml(t.what)+'</p>' +
      (t.when ? '<p><strong>Cuándo usarlo:</strong> '+escapeHtml(t.when)+'</p>' : '') +
      (t.happens ? '<p><strong>Qué ocurrirá:</strong> '+escapeHtml(t.happens)+'</p>' : '') +
      (extra || '') +
      '<button class="btn '+(danger?'btn-secondary':'btn-primary')+' btn-block" '+(danger?'style="color:var(--bvm-risk);border-color:var(--bvm-risk);margin-top:10px;"':'style="margin-top:10px;"')+' '+actionAttr+'>'+escapeHtml(t.button)+'</button>' +
      (t.technicalNote ? '<p style="font-size:11px;color:var(--bvm-soft-gray);margin-top:8px;">'+escapeHtml(t.technicalNote)+'</p>' : '') +
    '</div>';
  }

  return (
  '<div class="admin-section">' +
    '<div class="section-head"><span class="eyebrow">Administración BVM</span><h2 class="h2">Preparar, respaldar y generar información</h2></div>' +
    '<div class="align-note">'+escapeHtml(COPY_CONFIG.privacy.admin)+'</div>' +
    '<div class="align-note" style="background:var(--bvm-blue-gray);border-left-color:var(--bvm-navy);">Este acceso no sustituye la autenticación ni las medidas de seguridad requeridas para producción.</div>' +
    nextActionCard() +
    familySelectorHtml +
    (c.hasData ? (
      '<div class="data-mgmt-card" style="margin-top:0;max-width:340px;">' +
        '<h4>Fecha de elaboración del reporte</h4>' +
        '<p>Se utiliza en el encabezado del panel y en el reporte integral.</p>' +
        '<input type="date" id="reportDateInput" class="bvm-input" value="'+escapeHtml(reportDateValue)+'">' +
      '</div>'
    ) : '') +
    '<div class="data-mgmt-grid">' +
      taskCard(Object.assign({}, cc.prepareDemo, { button: demoLoaded?'Restaurar demostración':cc.prepareDemo.button }), 'data-action="load-demo"') +
      taskCard(cc.backup, 'data-action="export-backup"') +
      taskCard(cc.restore, 'data-action="import-backup"', '<input type="file" id="importFile" accept=".json" class="sr-only">') +
      taskCard(cc.wipe, 'data-action="reset-data"', '', true) +
    '</div>' +
    '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">' +
      '<button class="btn btn-secondary btn-compact" data-action="open-presenter-guide">Guía para presentar</button>' +
      '<button class="btn btn-secondary btn-compact" data-action="jump-to-commercial">'+ICONS.refresh+' Abrir demostración ejecutiva</button>' +

    '</div>' +
    '<h3 class="h3" style="margin-top:26px;">Participantes registrados</h3>' +
    '<div class="participant-status-list">'+participantRows+'</div>' +
  '</div>'
  );
};

AdminDashboard.bind = function(astate){
  const tourState = StateManager.get().tour;

  // v1.4: navegación por teclado entre pestañas. En una sesión en vivo, avanzar
  // con las flechas evita interrumpir el discurso para buscar el mouse.
  // Nunca se activa mientras se escribe en un campo ni con un overlay abierto,
  // para no secuestrar teclas que la persona espera que hagan otra cosa.
  if(AdminDashboard._navKeyHandler){
    document.removeEventListener('keydown', AdminDashboard._navKeyHandler);
    AdminDashboard._navKeyHandler = null;
  }
  AdminDashboard._navKeyHandler = function(ev){
    if(ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
    const st = StateManager.get();
    if(st.tour.active || st.modal || st.help.open || st.onboarding.active || st.printHelp.open) return;
    const el = document.activeElement;
    if(el && (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
    const tabs = qsa('.admin-nav-btn').map(function(b){ return b.getAttribute('data-tab'); });
    const idx = tabs.indexOf(st.admin.tab);
    if(idx === -1) return;
    const nextIdx = ev.key === 'ArrowRight' ? Math.min(tabs.length-1, idx+1) : Math.max(0, idx-1);
    if(nextIdx !== idx){ ev.preventDefault(); StateManager.setAdmin({ tab: tabs[nextIdx] }); }
  };
  document.addEventListener('keydown', AdminDashboard._navKeyHandler);

  if(tourState.active){
    GuidedTourManager.bind(tourState);
  }

  const exitBtn = qs('[data-action="exit-admin"]');
  if(exitBtn) exitBtn.addEventListener('click', function(){ AppModeManager.exitToSelector(); });

  const restartTourBtn = qs('[data-action="restart-tour"]');
  if(restartTourBtn) restartTourBtn.addEventListener('click', function(){
    GuidedTourManager.restart(astate.commercial ? 'commercial' : 'admin', null);
  });
  const explainTabBtn = qs('[data-action="explain-tab"]');
  if(explainTabBtn) explainTabBtn.addEventListener('click', function(){
    GuidedTourManager.restart('admin', astate.tab);
  });

  // v1.5 (sección 3.6): el entrenamiento práctico opera SIEMPRE sobre el espacio
  // de demostración. Se cambia de espacio antes de iniciar, de modo que ninguna
  // acción del entrenamiento pueda alcanzar información de familias reales.
  const trainingBtn = qs('[data-action="start-training"]');
  if(trainingBtn) trainingBtn.addEventListener('click', function(){
    StateManager.openModal({
      title:'Entrenamiento práctico',
      body:'Recorrido operativo sobre la Familia Horizonte, un caso ficticio. Se trabajará en el espacio de demostración: la información de familias reales no se modifica en ningún momento. Podrá volver a Administración BVM al terminar.',
      confirmLabel:'Comenzar entrenamiento', cancelLabel:'Cancelar',
      onConfirm: function(){
        StorageNamespaceManager.setNamespace('demo');
        StorageAdapter.ensureDemoDataset();
        StateManager.setAdmin({ tab:'datos', commercial:false });
        GuidedTourManager.restart('training', null);
      }
    });
  });

  const focusParticipantsTabBtn = qs('[data-action="focus-participants-tab"]');
  if(focusParticipantsTabBtn) focusParticipantsTabBtn.addEventListener('click', function(){
    StateManager.setAdmin({ tab:'datos' });
  });

  const focusNewFamilyBtn = qs('[data-action="focus-new-family"]');
  if(focusNewFamilyBtn) focusNewFamilyBtn.addEventListener('click', function(){
    const input = qs('#newFamilyName'); if(input) input.focus();
  });
  const focusParticipantsBtn = qs('[data-action="focus-participants"]');
  if(focusParticipantsBtn) focusParticipantsBtn.addEventListener('click', function(){
    const list = qs('.participant-status-list'); if(list) list.scrollIntoView({ behavior:'smooth', block:'center' });
  });
  const focusRadiografiaBtn = qs('[data-action="focus-radiografia"]');
  if(focusRadiografiaBtn) focusRadiografiaBtn.addEventListener('click', function(){
    StateManager.setAdmin({ tab:'sintesis' });
  });

  const familySelect = qs('#familySelect');
  if(familySelect) familySelect.addEventListener('change', function(){
    StorageAdapter.setActiveFamily(familySelect.value);
    StateManager.render();
    showToast('Familia activa cambiada.');
  });
  const createFamilyBtn = qs('[data-action="create-family"]');
  if(createFamilyBtn) createFamilyBtn.addEventListener('click', function(){
    const input = qs('#newFamilyName');
    const name = input ? input.value.trim() : '';
    if(!name){ showToastGlobal('Escriba un nombre para la nueva familia.'); return; }
    StorageAdapter.createFamily(name);
    StateManager.render();
    showToast('Familia "'+name+'" creada y activada.');
  });
  const renameFamilyBtn = qs('[data-action="rename-family"]');
  if(renameFamilyBtn) renameFamilyBtn.addEventListener('click', function(){
    const fam = StorageAdapter.getActiveFamily();
    if(!fam) return;
    StateManager.openModal({
      title:'Renombrar familia',
      body:'<label class="field-label" for="renameFamilyInput" style="display:block;margin-bottom:6px;">Nuevo nombre</label>' +
           '<input type="text" id="renameFamilyInput" class="bvm-input" value="'+escapeHtml(fam.familyName)+'">',
      confirmLabel:'Guardar', cancelLabel:'Cancelar',
      onConfirm: function(){
        const val = (qs('#renameFamilyInput')||{}).value || '';
        if(!val.trim()) return false;
        StorageAdapter.renameFamily(fam.familyId, val.trim());
        StateManager.render();
        showToast('Familia renombrada.');
      }
    });
  });
  const archiveFamilyBtn = qs('[data-action="archive-family"]');
  if(archiveFamilyBtn) archiveFamilyBtn.addEventListener('click', function(){
    const fam = StorageAdapter.getActiveFamily();
    if(!fam) return;
    StateManager.openModal({
      title:'¿Archivar esta familia?',
      body:'"'+escapeHtml(fam.familyName)+'" dejará de aparecer en la lista activa. Su información no se borra; puede recuperarla creando un respaldo antes de archivar.',
      confirmLabel:'Sí, archivar', cancelLabel:'Cancelar', danger:true,
      onConfirm: function(){
        StorageAdapter.archiveFamily(fam.familyId);
        StateManager.render();
        showToast('Familia archivada.');
      }
    });
  });

  const nextStepBtn = qs('[data-action="next-step-modal"]');
  if(nextStepBtn) nextStepBtn.addEventListener('click', function(){
    // v1.5 (sección 4): texto exacto especificado. No se inventan correo,
    // teléfono, agenda, precio, duración ni entregables.
    StateManager.openModal({
      title:'Solicitar devolución ejecutiva',
      body:'La devolución ejecutiva permite revisar los hallazgos, contrastar percepciones y acordar cuál es la conversación que debe ocurrir primero. El alcance, duración, entregables e inversión de cualquier acompañamiento posterior se acuerdan por separado.',
      confirmLabel:'Entendido', cancelLabel:'Cerrar', onConfirm:function(){}
    });
  });
  const backToDemoBtn = qs('[data-action="back-to-demo"]');
  if(backToDemoBtn) backToDemoBtn.addEventListener('click', function(){ StateManager.setAdmin({ tab:'sintesis' }); });
  const backToDataBtn = qs('[data-action="back-to-data"]');
  if(backToDataBtn) backToDataBtn.addEventListener('click', function(){ StateManager.setAdmin({ tab:'datos' }); });

  const openReportBtn = qs('[data-action="open-report"]');
  if(openReportBtn) openReportBtn.addEventListener('click', function(){
    // v1.4: abrir el reporte cierra cualquier recorrido activo — el overlay
    // quedaba encima del documento y sus pasos apuntan al panel, no al reporte.
    if(StateManager.get().tour.active) GuidedTourManager.exit(false);
    // Recuerda desde dónde se abrió para poder regresar exactamente ahí.
    AdminDashboard._reportOrigin = StateManager.get().admin.tab;
    StateManager.setAdmin({ tab:'reporte-integral' });
  });
  const closeReportBtn = qs('[data-action="close-report"]');
  if(closeReportBtn) closeReportBtn.addEventListener('click', function(){
    // v1.4: vuelve a la pestaña desde la que se abrió el reporte. Antes
    // siempre regresaba a "Síntesis", obligando a renavegar en plena sesión.
    const back = AdminDashboard._reportOrigin || 'sintesis';
    AdminDashboard._reportOrigin = null;
    StateManager.setAdmin({ tab: back });
  });
  const printReportBtn = qs('[data-action="print-report"]');
  if(printReportBtn) printReportBtn.addEventListener('click', function(){
    if(PrintHelpManager.isDismissed()) PrintManager.printDashboard();
    else StateManager.openPrintHelp();
  });

  const mobileNav = qs('#adminMobileNav');
  if(mobileNav) mobileNav.addEventListener('change', function(){ StateManager.setAdmin({ tab: mobileNav.value }); });

  // "En una mirada" (v0.3): contraído por defecto en móvil, abierto en escritorio.
  const toggleNarrativeBtn = qs('#toggleFullNarrative');
  const fullNarrativeBlock = qs('#fullNarrativeBlock');
  if(toggleNarrativeBtn && fullNarrativeBlock){
    const startsCollapsed = window.innerWidth <= 760;
    if(startsCollapsed){
      fullNarrativeBlock.classList.add('narrative-collapsed');
      toggleNarrativeBtn.setAttribute('aria-expanded','false');
      toggleNarrativeBtn.textContent = 'Leer interpretación completa';
    } else {
      toggleNarrativeBtn.setAttribute('aria-expanded','true');
      toggleNarrativeBtn.textContent = 'Ocultar interpretación completa';
    }
    toggleNarrativeBtn.addEventListener('click', function(){
      const collapsed = fullNarrativeBlock.classList.toggle('narrative-collapsed');
      toggleNarrativeBtn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
      toggleNarrativeBtn.textContent = collapsed ? 'Leer interpretación completa' : 'Ocultar interpretación completa';
    });
  }

  const reportDateInput = qs('#reportDateInput');
  if(reportDateInput) reportDateInput.addEventListener('change', function(){
    const cfg = StorageAdapter.loadFamilyConfiguration() || {};
    cfg.reportDate = reportDateInput.value;
    StorageAdapter.saveFamilyConfiguration(cfg);
    StateManager.render();
    showToast(COPY_CONFIG.feedback.dateUpdated);
  });

  qsa('.admin-nav-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      // v1.4: si hay un recorrido activo y la persona navega por su cuenta,
      // el recorrido se cierra y le cede el control. Antes el recorrido
      // revertía el clic en silencio y la pestaña parecía no responder.
      if(StateManager.get().tour.active) GuidedTourManager.exit(false);
      StateManager.setAdmin({ tab: btn.getAttribute('data-tab') });
    });
  });

  const c = AdminDashboard._computed;
  qsa('[data-action="view-dim-detail"]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const dimId = btn.getAttribute('data-dim');
      const dim = QUESTIONNAIRE.dimensions.filter(function(d){ return d.id===dimId; })[0];
      StateManager.openModal({
        title: 'Detalle de afirmaciones — ' + dim.name,
        body: AdminDashboard.renderDimensionDetailModalBody(c, dimId),
        confirmLabel:'Cerrar', cancelLabel:'', onConfirm:function(){}
      });
    });
  });
  const methodNoteBtn = qs('[data-action="view-methodology-note"]');
  if(methodNoteBtn) methodNoteBtn.addEventListener('click', function(){
    const a = c.alignment;
    const rows = a.questionDispersion.map(function(sd, idx){
      return '<div class="dim-detail-row"><div class="dim-detail-text">Afirmación '+(idx+1)+'</div><div class="dim-detail-score">DE '+sd.toFixed(2)+'</div></div>';
    }).join('');
    StateManager.openModal({
      title:'Nota técnica — dispersión por afirmación',
      body:'<div class="dim-detail-list"><p class="body-text" style="margin-bottom:10px;">Desviación estándar (DE) de las respuestas por afirmación, entre 0 (coincidencia total) y valores mayores conforme aumenta la diferencia de percepción.</p>'+rows+'</div>',
      confirmLabel:'Cerrar', cancelLabel:'', onConfirm:function(){}
    });
  });

  const guideBtn = qs('[data-action="open-presenter-guide"]');
  if(guideBtn) guideBtn.addEventListener('click', function(){ StateManager.setAdmin({ tab:'guia-presentador' }); });

  const jumpToCommercialBtn = qs('[data-action="jump-to-commercial"]');
  if(jumpToCommercialBtn) jumpToCommercialBtn.addEventListener('click', function(){ AppModeManager.enterCommercial(); });

  const loadDemoInline = qs('[data-action="load-demo-inline"]');
  if(loadDemoInline) loadDemoInline.addEventListener('click', function(){
    StorageAdapter.loadDemoData(); StateManager.render(); showToast(COPY_CONFIG.feedback.demoReady);
  });

  const loadDemo = qs('[data-action="load-demo"]');
  if(loadDemo) loadDemo.addEventListener('click', function(){
    const doLoad = function(){ StorageAdapter.resetDemo(); StateManager.render(); showToast('La Familia Horizonte fue restaurada. No se modificó información de familias reales.'); };
    if(StorageAdapter.isDemoLoaded()){
      const t = COPY_CONFIG.safeActions.reloadDemo;
      StateManager.openModal({ title:t.title, body:t.body, confirmLabel:t.confirm, cancelLabel:t.cancel, onConfirm: doLoad });
    } else { doLoad(); }
  });

  const exportBtn = qs('[data-action="export-backup"]');
  if(exportBtn) exportBtn.addEventListener('click', function(){ BackupManager.exportToFile(); showToast(COPY_CONFIG.feedback.backupCreated); });

  const importBtn = qs('[data-action="import-backup"]');
  const importInput = qs('#importFile');
  if(importBtn && importInput){
    importBtn.addEventListener('click', function(){ importInput.click(); });
    importInput.addEventListener('change', function(){
      const file = importInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(e){
        let json;
        try{ json = JSON.parse(e.target.result); }
        catch(err){ StateManager.openModal({ title:'No fue posible recuperar este respaldo', body: COPY_CONFIG.feedback.fileError, confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){} }); return; }
        const val = ValidationEngine.validateBackup(json);
        if(!val.ok){
          const isVersion = /versión/i.test(val.error);
          StateManager.openModal({ title: isVersion?'No es posible recuperar este respaldo':'No fue posible recuperar este respaldo',
            body: isVersion ? COPY_CONFIG.feedback.versionError : COPY_CONFIG.feedback.fileError,
            confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){} });
          return;
        }
        // v1.6.11 (corrección de respaldo): la vista previa leía
        // json.configuration.familyName y json.participants, campos que NO
        // existen en la estructura actual (el nombre y los participantes viven
        // en json.family), por lo que un respaldo recién creado por la propia
        // aplicación mostraba "Familia —". Se reutiliza la MISMA resolución
        // que el nombre de archivo (resolveBackupFamilyName) y se conservan
        // los alcances anteriores como respaldo de compatibilidad.
        const pCount = (json.family && Array.isArray(json.family.participants))
          ? json.family.participants.length
          : Object.keys(json.participants||{}).length;
        const backupVersion = json.appVersion ? ('v'+json.appVersion) : (json.schemaVersion != null ? ('estructura '+json.schemaVersion) : '—');
        const backupType = json.backupType === 'real-family-data' ? 'Datos de familia real' : (json.backupType || '—');
        const summary =
          '<div class="dim-grid-2">' +
            '<div><div class="dim-mini-label">Archivo</div><div class="dim-mini-text">'+escapeHtml(file.name)+'</div></div>' +
            '<div><div class="dim-mini-label">Familia</div><div class="dim-mini-text">'+escapeHtml((function(){ const rn = resolveBackupFamilyName(json); return rn === 'sin_nombre' ? '—' : rn; })())+'</div></div>' +
            '<div><div class="dim-mini-label">Participaciones</div><div class="dim-mini-text">'+pCount+'</div></div>' +
            '<div><div class="dim-mini-label">Fecha del respaldo</div><div class="dim-mini-text">'+fmtDate(json.exportDate)+'</div></div>' +
            '<div><div class="dim-mini-label">Versión de la aplicación</div><div class="dim-mini-text">'+escapeHtml(backupVersion)+'</div></div>' +
            '<div><div class="dim-mini-label">Tipo de respaldo</div><div class="dim-mini-text">'+escapeHtml(backupType)+'</div></div>' +
          '</div>' +
          '<p class="body-text" style="margin-top:12px;font-size:13px;"><strong>Destino:</strong> espacio de trabajo real de BVM.</p>' +
          '<p class="body-text" style="margin-top:6px;font-size:13px;">La información real actual guardada en este equipo será sustituida por el contenido de este respaldo. La demostración Familia Horizonte no se modifica.</p>';
        StateManager.openModal({
          title:'¿Recuperar esta información?', body: summary,
          confirmLabel:'Sí, recuperar esta información', cancelLabel:'Cancelar',
          onConfirm: function(){
            BackupManager.importFromFile(file, function(result){
              if(result.ok && result.legacy){
                StateManager.render();
                StateManager.openModal({
                  title:'Este respaldo es de una versión anterior del cuestionario',
                  body:'Las afirmaciones A9 y A18 cambiaron de significado en esta versión (BVM-FE-1.1). Esta información se guardó por separado, como información histórica, y no se mezcló con ninguna familia real ni participa en ningún cálculo actual.',
                  confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){}
                });
              }
              else if(result.ok){ StateManager.render(); showToast(COPY_CONFIG.feedback.backupRestored); }
              else { StateManager.openModal({ title:'No fue posible recuperar este respaldo', body: COPY_CONFIG.feedback.fileError, confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){} }); }
            });
          }
        });
      };
      reader.readAsText(file);
      importInput.value = '';
    });
  }

  const resetBtn = qs('[data-action="reset-data"]');
  if(resetBtn) resetBtn.addEventListener('click', function(){
    const t = COPY_CONFIG.safeActions.wipe;
    StateManager.openModal({
      title:t.title, danger:true, body:t.body, confirmLabel:t.confirm, cancelLabel:t.cancel,
      onConfirm: function(){ StorageAdapter.clearPrototypeData(); StateManager.render(); showToast(COPY_CONFIG.feedback.dataWiped); }
    });
  });
};


// ============================================================
// ReportBuilder — ensambla el reporte integral como una pieza editorial:
// páginas explícitas (.report-page), cada una con su propio encabezado,
// contenido y pie con numeración. Reutiliza el contenido de AdminDashboard
// a través de sus funciones *Body (sin título, sin contenedor de pantalla)
// para que exista una única fuente de contenido pero dos presentaciones
// distintas (pantalla vs. impresión), tal como pide la v0.4.
// ============================================================
const ReportBuilder = (function(){

  // Construye el pie de página. La portada no lleva este pie (lleva su propia
  // nota de confidencialidad integrada), como permite la especificación.
  function footer(c, pageNumber, totalPages){
    const tag = c.commercial ? 'CASO FICTICIO — DEMOSTRACIÓN BVM' : 'Documento confidencial';
    return (
      '<footer class="report-page__footer">' +
        '<span>'+escapeHtml(c.cfg.familyName||'')+' · '+tag+' · '+APP_CONFIG.modelVersion+'</span>' +
        '<span>Página '+pageNumber+' de '+totalPages+'</span>' +
      '</footer>'
    );
  }

  // Encabezado estándar de página de contenido: eyebrow, H1, regla dorada.
  function header(eyebrow, title){
    return (
      '<div class="report-page__header">' +
        '<span class="eyebrow">'+escapeHtml(eyebrow)+'</span>' +
        '<h1>'+escapeHtml(title)+'</h1>' +
        '<hr class="gold-rule">' +
      '</div>'
    );
  }

  function page(id, eyebrow, title, bodyHtml, c, pageNumber, totalPages, extraClass){
    const demoBanner = c.commercial ?
      '<div class="report-demo-banner">CASO FICTICIO — DEMOSTRACIÓN BVM</div>' : '';
    return (
      '<section class="report-page'+(extraClass?' '+extraClass:'')+'" id="report-page-'+id+'">' +
        demoBanner +
        header(eyebrow, title) +
        '<div class="report-page__content">' + bodyHtml + '</div>' +
        footer(c, pageNumber, totalPages) +
      '</section>'
    );
  }

  function buildCoverPage(c, totalPages){
    const reportDate = c.cfg.reportDate ? fmtDate(c.cfg.reportDate) : fmtDate(new Date().toISOString());
    const finished = c.finishedParticipants.length;
    const expected = c.cfg.expectedParticipants || c.participants.length || finished;
    const pct = expected>0 ? Math.round((finished/expected)*100) : 0;
    return (
      '<section class="report-page report-page--cover" id="report-page-cover">' +
        '<div class="report-cover-inner">' +
          '<div class="logo-navy-wrap"><img src="'+BRAND_CONFIG.logoNavyUri+'" alt="Business Value Mentor"></div>' +
          '<span class="eyebrow">Informe privado</span>' +
          '<h1>Radiografía de la Familia Empresaria</h1>' +
          // v1.4: el nombre de la familia y la fecha son los protagonistas de la
          // portada; el detalle operativo (versión del modelo, conteo de
          // participaciones) baja a letra fina o se muestra dentro del reporte.
          '<div class="report-cover-family">'+escapeHtml(c.cfg.familyName || 'Familia sin nombre')+'</div>' +
          '<hr class="gold-rule">' +
          '<div class="report-cover-meta">' + reportDate + '</div>' +
          (c.commercial ?
            '<span class="confidential-tag confidential-tag--demo">CASO FICTICIO — DEMOSTRACIÓN BVM</span>' +
            '<div class="confidentiality-note">Datos completamente ficticios (Familia Horizonte), únicamente con fines de demostración. No corresponde a ninguna familia real.</div>'
            :
            '<span class="confidential-tag">Documento confidencial</span>' +
            '<div class="confidentiality-note">Preparado para la familia y su consejo. Presenta resultados agregados: no muestra respuestas individuales ni permite atribuir percepciones a un integrante específico.</div>'
          ) +
          // v1.6: misma corrección que en el encabezado del panel — "5 de 2
          // participaciones" se lee como un error de la herramienta.
          '<div class="report-cover-fineprint">'+
            ((expected > 0 && finished <= expected)
              ? (finished+' de '+expected+' participaciones finalizadas')
              : (finished+(finished===1?' participación finalizada':' participaciones finalizadas')))+
            ' · '+APP_CONFIG.modelVersion+'</div>' +
        '</div>' +
      '</section>'
    );
  }

  function buildSintesisPage(c, n, total){
    const glance = c.narrative.atAGlance;
    const glanceHtml = (
      '<div class="at-a-glance card report-page-inner-break" style="margin-bottom:18px;">' +
        '<span class="eyebrow">En una mirada</span>' +
        '<div class="glance-grid">' +
          '<div><div class="dim-mini-label">Fortaleza principal</div><div class="dim-mini-text">'+escapeHtml(glance.strength)+'</div></div>' +
          '<div><div class="dim-mini-label">Capacidad por desarrollar</div><div class="dim-mini-text">'+escapeHtml(glance.development)+'</div></div>' +
          '<div><div class="dim-mini-label">Oportunidad principal</div><div class="dim-mini-text">'+glance.opportunity+'</div></div>' +
          '<div><div class="dim-mini-label">Conversación prioritaria</div><div class="dim-mini-text">'+escapeHtml(glance.conversation)+'</div></div>' +
        '</div>' +
      '</div>'
    );
    const body = glanceHtml + '<div class="card narrative-block">' + c.narrative.paragraphs.map(function(p){ return '<p>'+p+'</p>'; }).join('') + '</div>';
    const dimLabelsForHeadline = {}; QUESTIONNAIRE.dimensions.forEach(function(d){ dimLabelsForHeadline[d.id]=d.name; });
    const strongForHeadline = Object.keys(c.scoring.normalizedDimensionScores).reduce(function(b,d){ return c.scoring.normalizedDimensionScores[d]>c.scoring.normalizedDimensionScores[b]?d:b; });
    const weakForHeadline = Object.keys(c.scoring.normalizedDimensionScores).reduce(function(w,d){ return c.scoring.normalizedDimensionScores[d]<c.scoring.normalizedDimensionScores[w]?d:w; });
    const sintesisHeadline = NarrativeEngine.overallHeadline(
      c.scoring.generalIndex, c.alignment.generalDispersion,
      dimLabelsForHeadline[strongForHeadline], dimLabelsForHeadline[weakForHeadline]
    );
    return page('sintesis', 'Síntesis ejecutiva', sintesisHeadline, body, c, n, total);
  }

  function buildIndicadoresPage(c, n, total){
    const s = c.scoring, a = c.alignment;
    const generalLevel = getMaturityLevel(s.generalIndex);
    const strongDim = Object.keys(s.normalizedDimensionScores).reduce(function(best,d){ return s.normalizedDimensionScores[d] > s.normalizedDimensionScores[best] ? d : best; });
    const weakDim = Object.keys(s.normalizedDimensionScores).reduce(function(worst,d){ return s.normalizedDimensionScores[d] < s.normalizedDimensionScores[worst] ? d : worst; });
    const dimLabel = {}; QUESTIONNAIRE.dimensions.forEach(function(d){ dimLabel[d.id]=d.name; });
    const indicators = [
      { label:'Índice general de madurez', value:s.generalIndex.toFixed(0)+' / 100', sub:generalLevel.label },
      { label:'Dimensión más consolidada', value:dimLabel[strongDim], sub:s.normalizedDimensionScores[strongDim].toFixed(0)+'/100' },
      { label:'Principal dimensión por desarrollar', value:dimLabel[weakDim], sub:s.normalizedDimensionScores[weakDim].toFixed(0)+'/100' },
      { label:'Nivel general de alineación', value:getDispersionLevel(a.generalDispersion).label, sub:'' }
    ];
    const body = (
      '<div class="indicator-grid report-page-inner-break">' +
        indicators.map(function(i, idx){ return '<div class="indicator-card'+(idx===0?' indicator-card--primary':'')+'"><div class="ind-label">'+escapeHtml(i.label)+'</div><div class="ind-value">'+escapeHtml(String(i.value))+'</div><div class="ind-sub">'+escapeHtml(String(i.sub))+'</div></div>'; }).join('') +
      '</div>' +
      '<div class="charts-stack report-page-inner-break" style="margin-top:20px;">' +
        '<div class="radar-wrap">' + ChartRenderer.renderRadar(s.normalizedDimensionScores, dimLabel) + '</div>' +
        '<div class="bars-wrap"><span class="bars-wrap-title">Comparación exacta por dimensión</span>' + ChartRenderer.renderHorizontalBars(s.normalizedDimensionScores, dimLabel) + '</div>' +
      '</div>' +
      '<p class="chart-note">El radar muestra el equilibrio entre dimensiones; no representa por sí solo el nivel de alineación entre integrantes. Las barras permiten comparar el resultado exacto de cada dimensión.</p>' +
      // v1.4 (sección 8, página 3): takeaway ejecutivo de una o dos líneas que
      // destaca la mayor fortaleza y la mayor brecha, con la distancia entre ambas.
      '<div class="exec-takeaway report-page-inner-break">' +
        '<span class="exec-takeaway-label">Lectura ejecutiva</span>' +
        '<p>Los resultados sitúan la mayor capacidad instalada en <strong>'+escapeHtml(dimLabel[strongDim])+'</strong> ('+s.normalizedDimensionScores[strongDim].toFixed(0)+'/100) y la mayor exposición en <strong>'+escapeHtml(dimLabel[weakDim])+'</strong> ('+s.normalizedDimensionScores[weakDim].toFixed(0)+'/100), una diferencia de '+Math.round(s.normalizedDimensionScores[strongDim]-s.normalizedDimensionScores[weakDim])+' puntos que orienta dónde conviene concentrar la conversación.</p>' +
      '</div>'
    );
    // v1.4: titular dinámico basado en la distancia entre mayor fortaleza y mayor brecha.
    const spread = s.normalizedDimensionScores[strongDim] - s.normalizedDimensionScores[weakDim];
    const indicadoresHeadline = spread >= 25
      ? 'Perfil desigual: la distancia entre capacidades marca la prioridad'
      : (s.generalIndex >= 60 ? 'Perfil equilibrado sobre una base consolidada'
                              : 'Perfil equilibrado, con margen de desarrollo en las cuatro dimensiones');
    return page('indicadores', 'Indicadores principales', indicadoresHeadline, body, c, n, total);
  }

  function buildDimensionPage(c, dimId, label, n, total){
    const body = AdminDashboard.renderDimensionCardContent(c, dimId, { showDetailButton:false, plain:true });
    // v1.4: el titular es una conclusión ejecutiva derivada de score + dispersión;
    // el nombre de la dimensión pasa al eyebrow.
    const headline = NarrativeEngine.executiveHeadline({
      score: c.scoring.normalizedDimensionScores[dimId],
      dispersion: c.alignment.dimensionDispersion[dimId],
      label: label,
      dimId: dimId
    });
    return page('dim-'+dimId, label, headline, body, c, n, total);
  }

  function buildAlineacionPage(c, n, total){
    const body = AdminDashboard.renderAlineacionBody(c, { showTechButton:false });
    // v1.4: titular dinámico según el nivel real de coincidencia.
    // v1.6: con menos de tres participaciones el titular no afirma un nivel de
    // coincidencia — declara que todavía no es interpretable.
    const dispLevel = getDispersionLevel(c.alignment.generalDispersion);
    const alineacionHeadline = !c.alignment.alignmentInterpretable
      ? 'Se requieren más participaciones para interpretar la coincidencia'
      : (dispLevel.id === 'diferencias_relevantes'
          ? 'Los integrantes no comparten la misma lectura de la situación'
          : (dispLevel.id === 'coincidencia_moderada'
              ? 'Existe una base compartida, con matices que conviene conversar'
              : 'Los integrantes coinciden de forma consistente en su lectura'));
    return page('alineacion', 'Alineación familiar', alineacionHeadline, body, c, n, total);
  }

  function buildRiesgoPage(c, n, total){
    const body = AdminDashboard.renderRiesgoBody(c);
    // v1.4: el titular usa el cuadrante obtenido, no un nombre genérico.
    const riesgoHeadline = {
      actuar: 'Coinciden una oportunidad relevante y una exposición que conviene atender',
      proteger: 'Conviene ordenar y proteger antes de impulsar crecimiento',
      desarrollar: 'Base suficiente para desarrollar capacidades de forma ordenada',
      consolidar: 'Capacidades relativamente consolidadas: la prioridad es preservarlas'
    }[c.matrix.quadrant.id] || 'Riesgo estructural y potencial de oportunidad';
    return page('riesgo', 'Riesgo y oportunidad', riesgoHeadline, body, c, n, total);
  }

  function buildConversacionesPage(c, n, total){
    const body = AdminDashboard.renderConversacionesBody(c);
    // v1.4: el titular nombra la conversación de mayor prioridad.
    const topConv = c.conversations.main[0];
    const conversacionesHeadline = topConv
      ? 'La conversación con mayor prioridad: ' + topConv.title.toLowerCase()
      : 'Temas que conviene abrir como familia';
    return page('conversaciones', 'Conversaciones prioritarias', conversacionesHeadline, body, c, n, total);
  }

  function buildEvolucionPage(c, n, total){
    const body = AdminDashboard.renderEvolutionBody(c) + '<div style="margin-top:20px;">' + AdminDashboard.renderDispositionModule(c) + '</div>';
    // v1.4: el titular nombra la fase sugerida para iniciar.
    const startPhase = c.route.phases.filter(function(p){ return p.id === c.route.suggestedStart; })[0];
    const evolucionHeadline = startPhase
      ? 'El punto de partida sugerido es ' + startPhase.title.toLowerCase()
      : 'Ruta de acompañamiento sugerida';
    return page('evolucion', 'Ruta de acompañamiento', evolucionHeadline, body, c, n, total);
  }

  function capitalizeFirstReport(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildCierrePage(c, n, total){
    const glance = c.narrative.atAGlance;
    // v1.5 (sección 6): la columna central muestra una CONSECUENCIA concreta y
    // la tercera una CAPACIDAD (antes mostraba una pregunta, rompiendo el
    // patrón justo en el punto de mayor atención). La pregunta prioritaria se
    // conserva más abajo, en su propio bloque.
    const weakDim = Object.keys(c.scoring.normalizedDimensionScores).reduce(function(w,d){ return c.scoring.normalizedDimensionScores[d]<c.scoring.normalizedDimensionScores[w]?d:w; });
    const weakBottomInterp = ITEM_INTERPRETATIONS[c.itemStats[weakDim].bottomItem.id];
    const consequence = NarrativeEngine.consequenceFor(weakDim, c.scoring.normalizedDimensionScores[weakDim]);
    const synthesis = (
      '<div class="closing-synthesis report-page-inner-break">' +
        '<div class="closing-synthesis-item"><span class="closing-synthesis-label">Lo que ya existe</span><p>'+escapeHtml(glance.strength)+'</p></div>' +
        '<div class="closing-synthesis-item"><span class="closing-synthesis-label">Lo que puede volverse insuficiente</span><p>'+escapeHtml(capitalizeFirstReport(consequence))+'</p></div>' +
        '<div class="closing-synthesis-item"><span class="closing-synthesis-label">Capacidad que conviene construir</span><p>'+escapeHtml(weakBottomInterp.developmentTitle)+'</p></div>' +
      '</div>'
    );
    const body = (
      synthesis +
      '<div class="bvm-emphasis bvm-emphasis--framed report-page-inner-break" style="text-align:center;padding:28px 30px;margin-top:18px;">' +
        '<span class="eyebrow">Pregunta final</span>' +
        '<h3 class="h2" style="margin-top:10px;">Una pregunta para conversar como familia</h3>' +
        '<p style="margin-top:12px;font-size:13.5px;">Si dentro de diez años el patrimonio familiar fuera el doble del actual y participaran nuevos integrantes en las decisiones, ¿la forma en que hoy se organizan seguiría siendo suficiente para protegerlo, aprovechar nuevas oportunidades y preservar la armonía familiar?</p>' +
      '</div>' +
      // v1.5 (sección 6): la última impresión del reporte es decisión y
      // siguiente paso — no una limitación metodológica.
      '<div class="report-next-step report-page-inner-break" data-tour-target="report-next-step">' +
        '<span class="eyebrow">Siguiente paso recomendado</span>' +
        '<h3 class="report-next-step-title" data-tour-target="commercial-next-step-title">Devolución ejecutiva BVM</h3>' +
        // v1.6.1 (sección 6): se sustituye el texto abstracto "definir si existe
        // materia para una ruta de trabajo" por acciones concretas.
        '<p class="report-next-step-body">Validar los hallazgos con las personas que la familia defina, contrastar las diferencias de percepción y acordar qué conversación merece atención primero.</p>' +
        '<p class="report-next-step-steps">Alinear la lectura · Priorizar un frente · Definir el siguiente paso</p>' +
        '<p class="report-next-step-body">A partir de esa conversación, la familia podrá decidir si conviene construir una ruta de trabajo y con qué alcance.</p>' +
        '<p class="report-next-step-kicker">BVM puede facilitar esta devolución en un espacio confidencial y estructurado. El alcance, duración, entregables e inversión de cualquier acompañamiento posterior se definen por separado.</p>' +
      '</div>' +
      '<p class="method-footnote">Modelo interpretativo BVM: el índice asigna el mismo peso a las cuatro dimensiones. Es provisional y orientado a abrir conversaciones; no constituye validación psicométrica ni predicción.</p>'
    );
    return page('cierre', 'Cierre', 'De los hallazgos a la siguiente conversación', body, c, n, total);
  }

  function buildFullReport(c){
    const dimPages = [
      { id:'relaciones', label:'Relaciones familiares' },
      { id:'gobierno', label:'Gobierno y toma de decisiones' },
      { id:'desarrollo', label:'Desarrollo del patrimonio' },
      { id:'continuidad', label:'Continuidad y legado' }
    ];
    // Total de páginas fijo por construcción (v0.4): portada, síntesis, indicadores,
    // 4 dimensiones, alineación, riesgo, conversaciones, evolución, cierre = 12.
    const total = 12;
    let n = 1;
    let html = buildCoverPage(c, total); n++;
    html += buildSintesisPage(c, n, total); n++;
    html += buildIndicadoresPage(c, n, total); n++;
    dimPages.forEach(function(d){ html += buildDimensionPage(c, d.id, d.label, n, total); n++; });
    html += buildAlineacionPage(c, n, total); n++;
    html += buildRiesgoPage(c, n, total); n++;
    html += buildConversacionesPage(c, n, total); n++;
    html += buildEvolucionPage(c, n, total); n++;
    html += buildCierrePage(c, n, total); n++;
    return html;
  }

  return { buildFullReport: buildFullReport };
})();


// ============================================================
// BackupManager — exportación e importación de respaldo JSON
// ============================================================
// v1.5 (sección 12): resolución única del nombre de familia para el respaldo.
// El código anterior leía backup.familyName, que NO existe en la estructura
// actual (el nombre vive en backup.family.familyName), así que todo archivo
// terminaba llamándose "sin_nombre". Se resuelve en el orden especificado y se
// reutiliza la MISMA función en nombre de archivo, vista previa y mensajes.
function resolveBackupFamilyName(backup){
  if(!backup) return 'sin_nombre';
  return (backup.family && backup.family.familyName)
      || (backup.configuration && backup.configuration.familyName)
      || backup.familyName
      || 'sin_nombre';
}

const BackupManager = {
  exportToFile: function(){
    const backup = StorageAdapter.exportBackup();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    const resolved = resolveBackupFamilyName(backup);
    const safeName = resolved.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'');
    a.href = url;
    a.download = 'Respaldo_BVM_' + (safeName || 'sin_nombre') + '_' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 500);
  },
  importFromFile: function(file, callback){
    const reader = new FileReader();
    reader.onload = function(e){
      let json;
      try{ json = JSON.parse(e.target.result); }
      catch(err){ callback({ ok:false, error:'El archivo seleccionado no es un JSON válido.' }); return; }
      const result = StorageAdapter.importBackup(json);
      callback(result);
    };
    reader.onerror = function(){ callback({ ok:false, error:'No fue posible leer el archivo seleccionado.' }); };
    reader.readAsText(file);
  }
};

  // Antes de imprimir: aplica una clase print-mode, espera a que las fuentes

  // temporizador arbitrario como única garantía. Al terminar (o cancelar),
  // retira la clase; no cambia de pestaña ni duplica el reporte en el DOM.
  printDashboard: function(){
    // v1.6.5 (sección 14): no se llama a window.print() hasta que las fuentes
    // estén cargadas, el layout estable y cada página medida. Imprimir antes
    // producía medidas de un layout a medio formar.
    document.body.classList.add('print-mode');
    const afterPrint = function(){ document.body.classList.remove('print-mode'); };
    window.addEventListener('afterprint', afterPrint, { once:true });
    if(typeof prepareBvmPrint === 'function'){
      prepareBvmPrint().then(function(){ window.print(); }).catch(function(){ window.print(); });
    } else {

    }
  }
};

// ============================================================
// v1.6.5 (secciones 6, 14 y 15) — MEDICIÓN Y PREPARACIÓN DE IMPRESIÓN.
// El objetivo no es que el PDF tenga 12 hojas, sino que CADA página quepa
// realmente en su caja física. Se mide, se aplica densidad según el exceso
// medido, y se vuelve a medir. El registro queda en consola para auditoría;
// nunca se muestra al usuario ni se imprime.
// ============================================================
// v1.6.11 — AUDITORÍA GEOMÉTRICA. scrollHeight no detecta elementos
// posicionados, colisiones con el pie ni desbordes horizontales. Esta
// versión mide cada página con getBoundingClientRect, recorre los
// descendientes visibles y localiza el elemento responsable de cada exceso.
// Exclusiones: script/style, elementos display:none y elementos sin
// dimensiones. No se excluye ningún elemento con contenido informativo.
function auditPrintPages(){
  const MM_TO_PX = 96 / 25.4;
  const FOOTER_GAP_PX = 2 * MM_TO_PX; // --print-footer-gap
  function cssPath(el){
    if(!el || el.nodeType !== 1) return '';
    let p = el.tagName.toLowerCase();
    if(el.id) return p + '#' + el.id;
    if(el.classList && el.classList.length) p += '.' + Array.prototype.slice.call(el.classList).slice(0,2).join('.');
    return p;
  }
  const pages = Array.prototype.slice.call(document.querySelectorAll('.report-page'));
  return pages.map(function(page, i){
    const rect = page.getBoundingClientRect();
    const isCover = page.classList.contains('report-page--cover');
    const footer = page.querySelector('.report-page__footer');
    const footerRect = footer ? footer.getBoundingClientRect() : null;
    // Límite vertical del contenido: inicio de la zona reservada del pie
    // (pie anclado − separación); en la portada, el borde de la hoja.
    const contentLimit = footerRect ? (footerRect.top - FOOTER_GAP_PX) : rect.bottom;
    let contentBottom = -Infinity, maxRight = -Infinity;
    const offendingSelectors = [];
    const walker = document.createTreeWalker(page, NodeFilter.SHOW_ELEMENT);
    let node;
    while((node = walker.nextNode())){
      if(node.tagName === 'SCRIPT' || node.tagName === 'STYLE') continue;
      if(footer && footer.contains(node)) continue; // el pie se evalúa aparte
      const cs = getComputedStyle(node);
      if(cs.display === 'none' || cs.visibility === 'hidden') continue;
      const r = node.getBoundingClientRect();
      if(r.width === 0 && r.height === 0) continue;
      if(r.bottom > contentBottom) contentBottom = r.bottom;
      if(r.right > maxRight) maxRight = r.right;
      if((r.bottom > contentLimit + 1 || r.right > rect.right + 1) && offendingSelectors.length < 10){
        const sel = cssPath(node);
        if(offendingSelectors.indexOf(sel) === -1) offendingSelectors.push(sel);
      }
    }
    if(!isFinite(contentBottom)) contentBottom = rect.top;
    if(!isFinite(maxRight)) maxRight = rect.left;
    const overflowVertical = Math.max(0, Math.round(contentBottom - rect.bottom));
    const overflowHorizontal = Math.max(0, Math.round(maxRight - rect.right));
    const footerCollision = footerRect ? (contentBottom > contentLimit + 1) : false;
    const footerOffPage = footerRect ? (footerRect.bottom > rect.bottom + 1) : false;
    const footerMissing = !footer && !isCover;
    // overflowPx conserva el nombre que usa applyPrintDensityClasses: el
    // exceso efectivo a resolver (sobre la hoja o sobre la zona del pie).
    const overflowPx = Math.max(
      overflowVertical,
      footerRect ? Math.max(0, Math.round(contentBottom - contentLimit)) : 0
    );
    return {
      page: i + 1,
      id: page.id || '',
      pageTop: Math.round(rect.top),
      pageBottom: Math.round(rect.bottom),
      contentBottom: Math.round(contentBottom),
      footerTop: footerRect ? Math.round(footerRect.top) : null,
      overflowVertical: overflowVertical,
      footerCollision: footerCollision || footerOffPage || footerMissing,
      overflowHorizontal: overflowHorizontal,
      overflowPx: overflowPx,
      offendingSelectors: offendingSelectors,
      fits: overflowVertical <= 1 && overflowHorizontal <= 1 &&
            !footerCollision && !footerOffPage && !footerMissing
    };
  });
}

// §8: la densidad depende del exceso medido, no de una suposición.
function applyPrintDensityClasses(){
  const pages = Array.prototype.slice.call(document.querySelectorAll('.report-page'));
  pages.forEach(function(page){
    page.classList.remove('print-density-compact','print-density-tight');
  });
  // v1.6.6: dos pasadas. Si tras aplicar 'compact' la página sigue
  // excediendo, se sube a 'tight'. Así la densidad responde al exceso REAL
  // medido después del ajuste, no al exceso inicial.
  auditPrintPages().forEach(function(row){
    const page = pages[row.page - 1];
    if(!page) return;
    if(row.overflowPx > 60) page.classList.add('print-density-tight');
    else if(row.overflowPx > 1) page.classList.add('print-density-compact');
  });
  auditPrintPages().forEach(function(row){
    const page = pages[row.page - 1];
    if(!page) return;
    if(row.overflowPx > 1 && page.classList.contains('print-density-compact')){
      page.classList.remove('print-density-compact');
      page.classList.add('print-density-tight');
    }
  });
}

function bvmRafTwice(){
  return new Promise(function(resolve){
    const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
    raf(function(){ raf(resolve); });
  });
}

async function prepareBvmPrint(){
  document.body.classList.add('print-preparing');
  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}
  await bvmRafTwice();
  applyPrintDensityClasses();
  await bvmRafTwice();
  const audit = auditPrintPages();
  window.__BVM_PRINT_QA__ = audit;
  // v1.6.11 (bloqueo de aprobaciones falsas): la bandera de QA solo es PASS
  // cuando TODAS las páginas obtienen fits:true en la auditoría geométrica.
  // La validación automatizada (qa/) termina con código de error si es false;
  // el botón de impresión del usuario final no se bloquea.
  window.__BVM_PRINT_QA_PASS__ = audit.every(function(r){ return r.fits; });
  try{
    const failing = audit.filter(function(r){ return !r.fits; });
    if(failing.length){
      console.warn('BVM PRINT QA — FAIL: ' + failing.length + ' página(s) no caben en su caja física.');
      failing.forEach(function(r){
        console.warn('  Página ' + r.page + ' (' + r.id + '): exceso ' + r.overflowPx + ' px' +
          (r.footerCollision ? ', colisión con la zona del pie' : '') +
          (r.overflowHorizontal > 1 ? (', desborde horizontal ' + r.overflowHorizontal + ' px') : '') +
          (r.offendingSelectors.length ? (' — responsables: ' + r.offendingSelectors.slice(0,4).join(', ')) : ''));
      });
    } else {
      console.info('BVM PRINT QA — OK: las 12 páginas caben en su caja física con la zona del pie libre.');
    }
    if(console.table) console.table(audit);
  }catch(e){}
  return audit;
}

function cleanupBvmPrint(){
  document.body.classList.remove('print-preparing');
  Array.prototype.slice.call(document.querySelectorAll('.report-page')).forEach(function(p){
    p.classList.remove('print-density-compact','print-density-tight');
  });
}

if(typeof window !== 'undefined'){
  window.addEventListener('beforeprint', function(){ prepareBvmPrint(); });
  window.addEventListener('afterprint', cleanupBvmPrint);
  window.auditPrintPages = auditPrintPages;
  window.prepareBvmPrint = prepareBvmPrint;
}
