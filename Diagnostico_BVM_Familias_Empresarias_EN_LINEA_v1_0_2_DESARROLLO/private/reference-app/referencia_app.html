  --bvm-positive:#2E933C; --bvm-warning:#E8A93B; --bvm-risk:#B4483C;
  /* ===== v1.4: paleta ejecutiva (colores con significado analítico) ===== */
  --bvm-slate:#5C6773;            /* texto secundario y notas */
  --bvm-editorial-bg:#F4F5F6;     /* zonas de apoyo, no relleno indiscriminado */
  --bvm-exec-red:#C7473C;         /* urgencia inmediata / exposición real */
  --bvm-exec-orange:#D87524;      /* prioridad alta / brecha relevante */
  --bvm-exec-mustard:#C6A128;     /* atención / madurez intermedia */
  --bvm-exec-olive:#7D9A55;       /* capacidad estable */
  --bvm-exec-green:#3F7F5A;       /* capacidad consolidada / disposición favorable */
  --radius-s:4px; --radius-m:6px; --radius-l:8px;
  --shadow-soft:0 1px 3px rgba(23,37,65,.06), 0 1px 2px rgba(23,37,65,.05);
  --shadow-card:0 2px 10px rgba(23,37,65,.07);
  --maxw:920px;
  /* ===== Tipografía (v0.5) =====
     Yaro Black / Yaro Cut Bold / Yaro ST son la tipografía display institucional,
     pero sus archivos oficiales no están disponibles en este entorno: no se
     descargan de internet ni se imitan. Poppins queda como fallback funcional
     en las tres variables; en cuanto se reciban los archivos .woff2 oficiales,
     basta añadir su @font-face y estas variables aplicarán Yaro automáticamente. */
  --font-display:"Yaro Black","Yaro Cut Bold","Poppins",sans-serif;
  --font-subhead:"Yaro ST","Poppins",sans-serif;
  --font-body:"Poppins",sans-serif;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ max-width:100%; overflow-x:hidden; height:100%; }
body{
  margin:0; background:var(--bvm-warm-white); color:var(--bvm-body);
  font-family:var(--font-body), -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,p,ul,ol{ margin:0; }
h1,h2,h3,h4{ font-family:var(--font-display); }
button{ font-family:inherit; }
img{ max-width:100%; display:block; }
.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0,0,0,0); white-space:nowrap; border:0;
}
:focus-visible{ outline:3px solid var(--bvm-gold); outline-offset:2px; border-radius:4px; }
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
.eyebrow{
  font-family:var(--font-subhead); font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
  color:var(--bvm-gold);
}
.h1{ font-family:var(--font-display); font-size:26px; font-weight:600; color:var(--bvm-navy); line-height:1.3; }
.h2{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--bvm-navy); line-height:1.35; }
.h3{ font-family:var(--font-display); font-size:15.5px; font-weight:600; color:var(--bvm-navy); }
.lede{ font-size:15.5px; color:var(--bvm-soft-gray); font-style:italic; }
.body-text{ font-size:15.5px; color:var(--bvm-body); }
.gold-rule{ width:56px; height:3px; background:var(--bvm-gold); border:0; border-radius:2px; margin:14px 0; }
.logo-chip{
  display:inline-flex; align-items:center; background:var(--bvm-warm-white);

  border-radius:var(--radius-s); padding:10px 16px;
}
.logo-chip img{ height:34px; width:auto; object-fit:contain; }
.logo-navy-wrap{ display:inline-flex; align-items:center; }
.logo-navy-wrap img{ height:48px; width:auto; object-fit:contain; }
@media (max-width:640px){
  .logo-navy-wrap img{ height:38px; }
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-s); border:1.5px solid transparent; cursor:pointer;
  font-weight:600; font-size:15px; padding:13px 26px; min-height:48px; transition:background .15s, border-color .15s, color .15s;
}
.btn-primary{ background:var(--bvm-navy); color:var(--bvm-warm-white); border-bottom:2px solid transparent; }
.btn-primary:hover{ background:var(--bvm-navy2); border-bottom-color:var(--bvm-gold); }
.btn-secondary{ background:var(--bvm-white); color:var(--bvm-navy); border-color:var(--bvm-navy); }
.btn-secondary:hover{ background:var(--bvm-blue-gray); }
.btn-gold{ background:var(--bvm-gold); color:var(--bvm-warm-white); }
.btn-gold:hover{ background:#96691d; }
.btn-text{ background:none; color:var(--bvm-soft-gray); text-decoration:underline; padding:8px 4px; min-height:auto; font-weight:500; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-block{ width:100%; }
.card{
  background:#fff; border:1px solid var(--bvm-border); border-radius:var(--radius-l);
  padding:28px; box-shadow:var(--shadow-card);
}

/* ===== v0.5: sistema de tarjetas centralizado ===== */
.card--technical{
  background:var(--bvm-technical-bg); border:1px solid rgba(23,37,65,.14); box-shadow:none;
}
.card--technical .h3, .card--technical .dim-mini-label{ color:var(--bvm-navy); }
.card--question{
  background:var(--bvm-question-bg); border:0; border-left:4px solid var(--bvm-gold); box-shadow:none;
}
.card--question .dim-mini-text, .card--question p{ color:var(--bvm-navy); }

/* ===== v0.5: recuadros navy con línea dorada — recurso de énfasis BVM =====
   Uso selectivo: 1-2 por página, reservado para el hallazgo o dato realmente importante. */
.bvm-emphasis{
  background:var(--bvm-navy); color:#fff; border-radius:var(--radius-m);
  padding:22px 26px; position:relative;
}
.bvm-emphasis .eyebrow{ color:var(--bvm-light-gold); }
.bvm-emphasis h3, .bvm-emphasis h4{ color:#fff; }
.bvm-emphasis .dim-mini-label{ color:var(--bvm-light-gold); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.bvm-emphasis .dim-mini-text, .bvm-emphasis p{ color:#fff; }
.bvm-emphasis strong{ color:var(--bvm-light-gold); }
.bvm-emphasis--left{ border-left:5px solid var(--bvm-gold); }
.bvm-emphasis--top{ border-top:4px solid var(--bvm-gold); }
.bvm-emphasis--framed{ background:var(--bvm-navy); border:1.5px solid var(--bvm-gold); padding:24px 28px; }

.storage-fallback-banner{
  background:var(--bvm-toast); color:var(--bvm-body); font-size:12.5px; text-align:center;
  padding:10px 16px; border-bottom:1px solid var(--bvm-divider);
}
.storage-fallback-compact{
  display:flex; align-items:center; justify-content:center; gap:8px; text-align:left; position:relative; padding:8px 40px 8px 16px;
}
.storage-fallback-compact svg{ flex-shrink:0; opacity:.75; }
.storage-fallback-dismiss{
  position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:0; font-size:18px;
  line-height:1; color:var(--bvm-soft-gray); cursor:pointer; padding:4px 8px;
}
.stack{ display:flex; flex-direction:column; gap:18px; }
.center-col{ max-width:var(--maxw); margin:0 auto; padding:0 20px; }

/* ===== v0.6: botón de ayuda flotante ===== */
.help-fab{
  position:fixed; right:20px; bottom:20px; z-index:150;
  display:flex; align-items:center; gap:7px; background:var(--bvm-navy); color:#fff;
  border:0; border-radius:24px; padding:12px 18px; font-size:13.5px; font-weight:600;
  box-shadow:0 4px 14px rgba(23,37,65,.28); cursor:pointer; min-height:44px;
}
.help-fab:hover{ background:var(--bvm-navy2); }
.help-fab svg{ flex-shrink:0; }
@media (max-width:640px){
  .help-fab span{ display:none; }
  .help-fab{ padding:12px; border-radius:50%; }
}

/* ===== v0.6: centro de ayuda ===== */
.help-overlay{ align-items:stretch; justify-content:flex-end; padding:0; background:rgba(23,37,65,.45); }
.help-panel{
  background:#fff; width:100%; max-width:640px; height:100%; overflow-y:auto;
  box-shadow:-8px 0 30px rgba(23,37,65,.2); display:flex; flex-direction:column;
}
.help-panel-head{
  display:flex; align-items:center; justify-content:space-between; padding:20px 24px;
  border-bottom:1px solid var(--bvm-divider); flex-shrink:0;
}
.help-close{ background:none; border:0; font-size:26px; line-height:1; color:var(--bvm-soft-gray); cursor:pointer; padding:6px 10px; }
.help-panel-body{ display:flex; flex:1; min-height:0; flex-wrap:wrap; }
.help-nav{ width:220px; flex-shrink:0; border-right:1px solid var(--bvm-divider); padding:14px 0; overflow-y:auto; }
.help-nav-item{
  display:block; width:100%; text-align:left; background:none; border:0; padding:11px 22px;
  font-size:13.5px; color:var(--bvm-body); cursor:pointer; border-left:3px solid transparent;
}
.help-nav-item:hover{ background:var(--bvm-cream); }
.help-nav-item.active{ border-left-color:var(--bvm-gold); color:var(--bvm-navy); font-weight:600; background:var(--bvm-cream); }
.help-content{ flex:1; min-width:280px; padding:24px 28px; overflow-y:auto; }
.help-content-body p{ margin-bottom:10px; }
.help-content-body ul, .help-content-body ol{ padding-left:20px; margin-bottom:10px; }
.help-content-body li{ margin-bottom:4px; font-size:13.5px; }
@media (max-width:760px){
  .help-panel{ max-width:100%; }
  .help-panel-body{ flex-direction:column; }
  .help-nav{ width:100%; border-right:0; border-bottom:1px solid var(--bvm-divider); display:flex; overflow-x:auto; padding:8px; }
  .help-nav-item{ flex-shrink:0; border-left:0; border-bottom:3px solid transparent; white-space:nowrap; }
  .help-nav-item.active{ border-left:0; border-bottom-color:var(--bvm-gold); }
}

/* ===== v0.6: onboarding ===== */
.onboarding-box{ max-width:440px; }
.onboarding-bullets{ margin-top:14px; padding-left:20px; }
.onboarding-bullets li{ font-size:13.5px; color:var(--bvm-body); margin-bottom:8px; }
.ob-dots{ display:flex; gap:6px; justify-content:center; margin-top:18px; }
.ob-dot{ width:7px; height:7px; border-radius:50%; background:var(--bvm-divider); }
.ob-dot.active{ background:var(--bvm-gold); }

/* ===== v0.6: recorrido guiado comercial ===== */
.tour-banner{
  position:sticky; top:0; z-index:60; background:var(--bvm-navy); border-bottom:3px solid var(--bvm-gold);
}
.tour-banner-inner{
  max-width:var(--maxw); margin:0 auto; padding:14px 20px; display:flex; justify-content:space-between;
  align-items:center; gap:16px; flex-wrap:wrap;
}
.tour-banner-actions{ display:flex; gap:8px; flex-wrap:wrap; flex-shrink:0; }

/* ===== v0.6: estados visuales consistentes (sin depender solo del color) ===== */
.status-pill{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 12px; border-radius:14px; }
.status-pill svg{ flex-shrink:0; }
.status-pill--saving{ background:var(--bvm-blue-gray); color:var(--bvm-navy); }
.status-pill--saved{ background:#E4F3E7; color:var(--bvm-positive); }
.status-pill--error{ background:#FBE7E4; color:var(--bvm-risk); }

/* ===== v1.2: sistema unificado de recorridos guiados ===== */
/* v1.6 — CORRECCIÓN DE CONTEXTO DE APILAMIENTO.
   Antes .tour-overlay era position:fixed con z-index:400, lo que creaba su
   propio contexto: la tarjeta, aun con z-index 410, quedaba confinada dentro
   de ese 400 y el elemento resaltado (402, que vive fuera del overlay) se
   dibujaba encima. Ahora el contenedor NO crea contexto y el velo y la
   tarjeta se apilan directamente en la raíz:
   velo 400 · resaltado 402 · tarjeta 420. */
/* ============================================================
   v1.6.1 — GUÍA. Tarjeta en el rango pedido (340-380px, 13-14px de
   texto, 16-18px de título), controles simplificados y una sola capa
   de ayuda activa. El contenedor no crea contexto de apilamiento:
   velo 400 · resaltado 401 (sin capturar clics) · tarjeta 420.
   ============================================================ */
.tour-overlay{ /* contenedor sin posición ni z-index */ }
.tour-scrim{ position:fixed; inset:0; z-index:400; background:rgba(23,37,65,.32); }
.tour-card{
  position:fixed; z-index:420; background:#fff; border-radius:10px;
  box-shadow:0 10px 34px rgba(23,37,65,.22);
  display:flex; flex-direction:column;
  width:min(360px, calc(100vw - 32px));
  left:16px; bottom:16px; top:auto;
  overflow:hidden;
}
.tour-card-head{ padding:14px 18px 0; flex-shrink:0; }
.tour-head-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.tour-step-count{ font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-slate); }
.tour-skip{
  background:none; border:0; padding:2px 0; cursor:pointer;
  font-size:11.5px; font-weight:600; color:var(--bvm-slate); font-family:inherit;
}
.tour-skip:hover{ color:var(--bvm-navy); text-decoration:underline; }
.tour-progress-track{ background:var(--bvm-divider); border-radius:2px; height:3px; overflow:hidden; margin-top:9px; }
.tour-progress-fill{ background:var(--bvm-gold); height:100%; transition:width .25s ease; }
.tour-title{ font-size:16.5px; font-weight:700; color:var(--bvm-navy); margin-top:11px; line-height:1.28; font-family:var(--font-display); }
.tour-card-body{ padding:8px 18px 12px; overflow-y:auto; overscroll-behavior:contain; min-height:0; }
.tour-body-text{ font-size:13.5px; color:var(--bvm-body); line-height:1.55; margin:0; }
.tour-card-foot{
  display:flex; align-items:center; gap:7px; flex-wrap:nowrap;
  padding:11px 18px 13px; flex-shrink:0;
  border-top:1px solid var(--bvm-divider); background:#FCFCFD;
}
.btn-tour--nav{ flex:1 1 0; min-width:0; padding:8px 6px; font-size:12px; min-height:33px; border-radius:5px; white-space:nowrap; }
.tour-icon-btn{
  flex:0 0 auto; background:none; border:0; cursor:pointer; font-family:inherit;
  font-size:11.5px; color:var(--bvm-slate); padding:6px 4px; white-space:nowrap;
}
.tour-icon-btn:hover{ color:var(--bvm-navy); }
.tour-more{ position:relative; flex:0 0 auto; }
.tour-more-btn{ font-size:16px; line-height:1; padding:4px 6px; }
.tour-more-menu{
  position:absolute; right:0; bottom:calc(100% + 6px); z-index:1;
  background:#fff; border:1px solid var(--bvm-border); border-radius:6px;
  box-shadow:0 6px 20px rgba(23,37,65,.16); min-width:172px; padding:4px 0;
}
.tour-more-item{
  display:block; width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:8px 14px; font-size:12px; color:var(--bvm-ink); font-family:inherit;
}
.tour-more-item:hover{ background:var(--bvm-editorial-bg); }
/* §3.6: una sola ayuda activa a la vez */
body.tour-active .help-fab,
body.tour-active [data-action="open-help"],
body.tour-active [data-action="reopen-participant-guide"],
body.tour-active .secondary-help-trigger,
body.tour-active .participant-scale-help{ display:none !important; }
@media (max-width:640px){
  .tour-card{ width:auto; left:12px; right:12px; }
  .btn-tour--nav{ font-size:11.5px; }
}
.tour-spotlight{
  position:relative; z-index:401; pointer-events:none; outline:3px solid var(--bvm-gold); outline-offset:4px;
  border-radius:var(--radius-m);
  box-shadow:0 0 0 9px rgba(176,128,38,.16), 0 0 0 1px rgba(176,128,38,.5);
}
@media (prefers-reduced-motion: reduce){
  .tour-spotlight{ transition:none; }
}
@media (max-width:640px){
  /* v1.6: el ancho y la posición los define .tour-card y placeCard(); aquí no se sobrescriben. */
  /* (sin overrides adicionales) */
}

/* ===== v1.4: barra de tiempo del paso, estado y sugerencia del recorrido ===== */
.tour-step-progress-track{ background:#E3E7EC; border-radius:2px; height:2px; overflow:hidden; margin-top:4px; }
.tour-step-progress-fill{ background:var(--bvm-navy); height:100%; transition:width .1s linear; }
.tour-meta-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; gap:6px; }
.tour-play-state{ font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--bvm-gold); }
.tour-hint{ font-size:11.5px; color:var(--bvm-soft-gray); margin-top:10px; font-style:italic; }
@media (prefers-reduced-motion: reduce){
  .tour-step-progress-fill{ transition:none; }
}

/* ===== v1.4: geometría ejecutiva — menos redondez, sombras discretas ===== */
.tour-card{ border-radius:8px; box-shadow:0 6px 24px rgba(23,37,65,.22); }
.onboarding-dontshow{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--bvm-soft-gray); margin-top:16px; }
.help-guide-actions{ margin-top:26px; padding-top:18px; border-top:1px solid var(--bvm-divider); display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.help-guide-label{ width:100%; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-slate); margin-bottom:2px; }

/* ===== SELECTOR / PANTALLA INTERNA ===== */
.selector-screen{ min-height:100vh; background:var(--bvm-navy); display:flex; flex-direction:column; }
.selector-header{ padding:36px 24px 8px; text-align:center; }
.selector-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:28px; }
.prototype-flag{
  display:inline-block; margin:18px auto 0; font-size:11.5px; font-weight:600; letter-spacing:.08em;
  color:var(--bvm-navy); background:var(--bvm-light-gold); padding:7px 14px; border-radius:4px;
}
.selector-title{ color:var(--bvm-warm-white); font-size:24px; font-weight:600; margin-top:22px; }
.selector-sub{ color:#C9D1E0; font-size:14.5px; max-width:520px; text-align:center; margin-top:8px; }
.selector-options{ display:grid; grid-template-columns:1fr; gap:16px; width:100%; max-width:480px; }
.selector-option{
  background:var(--bvm-warm-white); border:1px solid var(--bvm-divider); border-radius:var(--radius-m);
  padding:18px 20px; text-align:left; cursor:pointer; display:flex; align-items:center; gap:14px;
}
.selector-option:hover{ border-color:var(--bvm-gold); box-shadow:var(--shadow-soft); }
.selector-option .num{
  width:30px; height:30px; border-radius:50%; background:var(--bvm-navy); color:#fff; font-weight:600;
  display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;
}
.selector-option .txt strong{ display:block; color:var(--bvm-navy); font-size:15px; font-weight:600; }
.selector-option .txt span{ display:block; color:var(--bvm-soft-gray); font-size:13px; margin-top:2px; }
.selector-option--main{ flex-direction:column; align-items:stretch; padding:22px 24px; position:relative; border-left:4px solid var(--bvm-navy); }
.selector-option--main .txt{ display:block; }
.opt-tag{
  display:inline-block; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  color:var(--bvm-gold); background:none; padding:0; border-radius:0; margin-bottom:8px;
}
.selector-option--main strong{ display:block; color:var(--bvm-navy); font-size:18px; font-weight:700; }
.opt-desc{ display:block; color:var(--bvm-soft-gray); font-size:13.5px; margin-top:8px; line-height:1.5; }
.opt-action{ display:inline-block; margin-top:14px; color:var(--bvm-navy); font-weight:700; font-size:13.5px; }
.selector-option--recommended{ border-left-color:var(--bvm-gold); box-shadow:0 4px 18px rgba(176,128,38,.18); }
.recommended-badge{
  position:absolute; top:-11px; right:20px; background:var(--bvm-gold); color:#fff; font-size:10.5px; font-weight:700;
  padding:5px 12px; border-radius:4px; letter-spacing:.02em;
}
.selector-footer{ text-align:center; padding:24px; }
.admin-access-link{
  background:none; border:0; color:#8B93A8; font-size:12.5px; cursor:pointer; padding:10px; min-height:44px;
  text-decoration:underline; text-underline-offset:3px;
}
.admin-access-link:hover{ color:#C9D1E0; }

/* ===== PARTICIPANTE ===== */
.participant-shell{ min-height:100vh; background:var(--bvm-warm-white); display:flex; flex-direction:column; }
.participant-topbar{
  padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--bvm-divider);
}
.participant-progress-wrap{ padding:0 20px; }
.progress-track{ height:6px; background:var(--bvm-blue-gray); border-radius:2px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--bvm-gold); border-radius:2px; transition:width .25s ease; }
.progress-label{ font-size:12.5px; color:var(--bvm-soft-gray); margin-top:8px; }
.participant-main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:36px 20px 120px; }
.participant-panel{ width:100%; max-width:640px; }

.cover-illustration{
  width:100%; height:120px; border-radius:var(--radius-l); background:linear-gradient(135deg,var(--bvm-navy),#233457);
  display:flex; align-items:center; justify-content:center; margin-bottom:26px;
}
.duration-badges{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.duration-badge{
  background:var(--bvm-cream); border:1px solid var(--bvm-divider); border-radius:4px;
  padding:8px 14px; font-size:12.5px; color:var(--bvm-body); display:flex; align-items:center; gap:6px;
}
.confidential-note{
  background:var(--bvm-cream); border-left:3px solid var(--bvm-gold); border-radius:var(--radius-s);
  padding:14px 16px; font-size:13.5px; color:var(--bvm-body); margin-top:16px;
}

.field-group{ margin-bottom:20px; }
.field-label{ font-size:13.5px; font-weight:600; color:var(--bvm-navy); margin-bottom:8px; display:block; }
.field-hint{ font-size:12.5px; color:var(--bvm-soft-gray); margin-top:6px; }
input[type=text].bvm-input, select.bvm-input{
  width:100%; border:1.5px solid var(--bvm-divider); border-radius:var(--radius-s); padding:13px 14px;
  font-size:16px; font-family:inherit; background:#fff; color:var(--bvm-body);
}
select.bvm-input{ appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2371757C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>"); background-repeat:no-repeat; background-position:right 14px center; background-size:16px; padding-right:38px; }
input[type=text].bvm-input:focus, select.bvm-input:focus{ border-color:var(--bvm-gold); }
.radio-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
.radio-card{
  border:1.5px solid var(--bvm-divider); border-radius:var(--radius-m); padding:13px 16px;
  display:flex; align-items:center; gap:12px; cursor:pointer; background:#fff;
}
.radio-card input{ width:18px; height:18px; accent-color:var(--bvm-navy); flex-shrink:0; }
.radio-card.selected{ border-color:var(--bvm-gold); background:var(--bvm-toast); }
.radio-card span{ font-size:14.5px; color:var(--bvm-body); }

.dim-badge{
  display:inline-flex; align-items:center; gap:6px; background:var(--bvm-blue-gray); color:var(--bvm-navy);
  font-size:12px; font-weight:600; padding:6px 12px; border-radius:20px; letter-spacing:.02em;
}
.q-counter{ font-size:12.5px; color:var(--bvm-soft-gray); margin-top:10px; }
.q-statement{ font-size:19px; font-weight:500; color:var(--bvm-navy); line-height:1.45; margin:18px 0 24px; }

.scale-list{ display:flex; flex-direction:column; gap:10px; }
.scale-option{
  border:1.5px solid var(--bvm-divider); border-radius:var(--radius-m); padding:14px 18px;
  display:flex; align-items:center; gap:16px; cursor:pointer; background:#fff; transition:border-color .12s, background .12s;
  min-height:44px;
}
.scale-option:hover{ border-color:var(--bvm-gold); background:#FEFCF7; }
.scale-option.selected{ border-color:var(--bvm-navy); border-left:4px solid var(--bvm-gold); background:#FBFCFD; }
.scale-option .scale-num{
  /* v1.6.1 (sección 11): número en dorado BVM con borde dorado suave en estado
     normal. No se usa un color por nivel: la escala no es un semáforo. */
  width:32px; height:32px; border-radius:50%; border:1.5px solid rgba(176,128,38,.42); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px;
  color:var(--bvm-gold); background:#fff;
}
.scale-option:hover .scale-num{ border-color:var(--bvm-gold); }
.scale-option.selected .scale-num{ background:var(--bvm-navy); border-color:var(--bvm-navy); color:#fff; }
.scale-option .scale-txt{ font-size:14.5px; color:var(--bvm-body); flex:1; }
.scale-option .scale-check{ color:var(--bvm-gold); font-weight:700; font-size:16px; opacity:0; }
.scale-option.selected .scale-check{ opacity:1; }

/* v1.6.3 (sección 7.2): en 375px la fila de navegación desbordaba ~12px.
   Los botones ahora son flexibles con min-width:0, que es lo que impide que
   un botón se niegue a encogerse por debajo de su contenido. */
.nav-row{ display:flex; justify-content:space-between; align-items:center; margin-top:30px; gap:10px; width:100%; max-width:100%; }
.nav-row .btn{ min-width:0; max-width:100%; flex:0 1 auto; }
@media (max-width:390px){
  .nav-row{ gap:8px; }
  .nav-row .btn{ flex:1 1 0; padding-left:10px; padding-right:10px; font-size:13px; }
  .save-indicator{ display:none; }
}
@media (max-width:360px){
  .nav-row{ flex-wrap:wrap; }
  .nav-row .btn{ flex:1 1 100%; }
}
.save-indicator{ font-size:12px; color:var(--bvm-positive); opacity:0; transition:opacity .3s; display:flex; align-items:center; gap:5px; }
.save-indicator.show{ opacity:1; }
.save-indicator.save-indicator--error{ color:var(--bvm-risk); font-weight:600; max-width:280px; }

.summary-dim-row{
  display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--bvm-divider);
}
.summary-dim-row:last-child{ border-bottom:none; }
.summary-dim-name{ font-size:14.5px; font-weight:600; color:var(--bvm-navy); }
.summary-dim-count{ font-size:13px; color:var(--bvm-soft-gray); }
.summary-check{ color:var(--bvm-positive); font-weight:700; }

.final-screen{ text-align:center; padding:40px 0; }
.final-icon{
  width:64px; height:64px; border-radius:50%; background:var(--bvm-cream); margin:0 auto 22px;
  display:flex; align-items:center; justify-content:center;
}

.modal-overlay{
  position:fixed; inset:0; background:rgba(23,37,65,.55); display:flex; align-items:center; justify-content:center;
  padding:20px; z-index:200;
}
.modal-box{
  background:#fff; border-radius:var(--radius-l); padding:28px; max-width:440px; width:100%;
  box-shadow:0 12px 40px rgba(23,37,65,.25);
}
.modal-actions{ display:flex; gap:12px; margin-top:22px; }
.modal-actions .btn{ flex:1; }

.toast-fixed{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bvm-navy); color:#fff;
  padding:12px 22px; border-radius:24px; font-size:13.5px; box-shadow:0 6px 20px rgba(23,37,65,.3);
  opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:300; display:flex; align-items:center; gap:8px;
}
.toast-fixed.show{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:640px){
  .h1{ font-size:22px; }
  .q-statement{ font-size:17px; }
  .participant-main{ padding:24px 16px 110px; }
  .card{ padding:20px; }
}

/* ===== v0.8: expansor "¿No recibió un código?" ===== */
.code-help-expander{ margin-top:8px; font-size:12.5px; }
.code-help-expander summary{ color:var(--bvm-navy); font-weight:600; cursor:pointer; padding:4px 0; }
.code-help-expander p{ color:var(--bvm-soft-gray); margin-top:6px; font-size:12.5px; }

/* v1.6.3 (sección 6.1): espacio reservado bajo el contenido mientras la guía
   está activa en móvil, para que el panel inferior no cubra la escala ni el
   botón Continuar. La altura la mide el JavaScript sobre el panel real. */
/* v1.6.4 (sección 5.7): el espacio se aplica al elemento que realmente
   controla el scroll. Aplicarlo solo a un contenedor no desplazable no
   generaba margen efectivo y el panel seguía tapando el contenido. */
body.tour-active{ padding-bottom: var(--tour-bottom-space, 0px); }
body.tour-active .participant-shell,
body.tour-active .center-col{ padding-bottom: var(--tour-bottom-space, 0px); }


/* v1.6.3 (sección 8.2): foco visible y diferenciado del hover. No se usa
   outline:none sin sustituto, y no depende únicamente del color. */
.scale-option:focus-visible{
  outline:3px solid var(--bvm-light-gold);
  outline-offset:3px;
  box-shadow:0 0 0 2px var(--bvm-navy);
}
.scale-option:focus{ outline-color:var(--bvm-light-gold); }

/* ===== ADMIN DASHBOARD ===== */
.admin-shell{ min-height:100vh; background:var(--bvm-cream); }
.admin-topbar{
  background:var(--bvm-navy); color:#fff; padding:20px 0;
}
.admin-topbar-inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.admin-topbar-meta{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.meta-chip{ background:rgba(255,255,255,.1); color:#EAEDF3; font-size:11.5px; padding:5px 12px; border-radius:14px; }
.meta-chip.gold{ background:var(--bvm-light-gold); color:var(--bvm-navy); font-weight:600; }

.admin-nav{
  background:#fff; border-bottom:1px solid var(--bvm-divider); position:sticky; top:0; z-index:50;
  overflow-x:auto;
}
.admin-nav-inner{ display:flex; gap:4px; padding:0 20px; }
.admin-nav-btn{
  background:none; border:0; border-bottom:3px solid transparent; padding:14px 14px; font-size:13.5px;
  font-weight:500; color:var(--bvm-soft-gray); cursor:pointer; white-space:nowrap;
}
.admin-nav-btn.active{ color:var(--bvm-navy); border-bottom-color:var(--bvm-gold); font-weight:600; }

.admin-section{ padding:36px 0; }
.section-head{ margin-bottom:22px; }
.section-head .eyebrow{ display:block; margin-bottom:6px; }

/* v1.4: tres columnas explícitas. Antes usaba auto-fit, que generaba cuatro
   columnas para solo tres tarjetas secundarias y dejaba un hueco a la derecha
   (las tarjetas se veían recargadas a la izquierda). La tarjeta principal
   sigue ocupando el ancho completo con grid-column:1/-1. */
.indicator-grid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:20px; }
@media (max-width:760px){ .indicator-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:480px){ .indicator-grid{ grid-template-columns:1fr; } }
/* v1.4: dos columnas — este contenedor siempre lleva exactamente dos tarjetas
   (las dos preguntas externas). Con tres columnas quedaba una vacía. */
.method-module-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
@media (max-width:760px){ .method-module-grid{ grid-template-columns:1fr; } }
.indicator-card{
  background:#fff; border:1px solid var(--bvm-divider); border-left:3px solid var(--bvm-gold);
  border-radius:var(--radius-m); padding:16px 18px 14px;
  display:flex; flex-direction:column; justify-content:space-between; min-height:128px;
  box-shadow:0 1px 4px rgba(23,37,65,.05);
}
.indicator-card .ind-label{ font-size:11.5px; color:var(--bvm-navy); font-weight:700; text-transform:uppercase; letter-spacing:.05em; line-height:1.3; }
.indicator-card .ind-value{ font-size:22px; font-weight:700; color:var(--bvm-gold); margin-top:8px; line-height:1.2; }
.indicator-card .ind-sub{ font-size:12px; color:var(--bvm-soft-gray); font-weight:600; margin-top:8px; padding-top:8px; border-top:1px solid var(--bvm-divider); }
.indicator-card--primary{
  background:var(--bvm-navy); border:0; border-top:4px solid var(--bvm-gold); grid-column:1 / -1;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:22px 24px;
}
.indicator-card--primary .ind-label{ color:var(--bvm-light-gold); }
.indicator-card--primary .ind-sub{ border-top:0; padding-top:0; margin-top:0; }
.indicator-card--primary .ind-value{ color:#fff; font-size:34px; }
.indicator-card--primary .ind-sub{ color:var(--bvm-light-gold); font-size:13px; }

.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:24px; }
.narrative-block p{ margin-bottom:13px; font-size:14.5px; color:var(--bvm-body); }
.narrative-block p:last-child{ margin-bottom:0; }

.dim-card{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-l); padding:22px; margin-bottom:14px; }

/* ===== v1.0: tres capas explícitas por dimensión ===== */
.dim-layer{ margin-top:18px; }
.dim-layer-eyebrow{
  display:block; font-size:10.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
  color:var(--bvm-gold); border-top:1px solid var(--bvm-divider); padding-top:14px;
}
.dim-layer--lectura{ }
.dim-layer--evidencia{
  background:var(--bvm-cream); border-radius:var(--radius-m); padding:14px 16px 4px; margin-top:20px;
}
.dim-layer-eyebrow--muted{ color:var(--bvm-soft-gray); border-top:0; padding-top:0; }
.dim-mini-label--muted{ color:var(--bvm-soft-gray); font-weight:500; font-size:10.5px; }
/* La evidencia pesa menos visualmente que la lectura: texto más pequeño, sin tarjetas con sombra. */
.dim-layer--evidencia .dim-question-chip{ font-size:12px; background:#fff; box-shadow:none; }
.dim-card--plain{ border:none; padding:0; box-shadow:none; }
.dim-card-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.dim-number{ font-family:var(--font-display); font-size:34px; font-weight:700; color:var(--bvm-gold); line-height:1; margin-right:4px; }
.dim-score-pill{
  background:var(--bvm-navy); color:#fff; border-radius:20px; padding:6px 14px; font-size:13px; font-weight:600;
  display:flex; align-items:center; gap:8px; flex-shrink:0;
}
.dim-level-tag{ display:inline-block; font-size:11px; color:#fff; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-top:5px; padding:4px 10px; border-radius:4px; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
.dim-grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px; }
.dim-grid-2 > .card{ padding:16px 18px; margin:0; }
.card--white-accent{ border-left:3px solid var(--bvm-gold) !important; }
.dim-question-text{ font-size:14.5px; font-weight:500; }
.dim-mini-label{ font-size:11.5px; font-weight:600; color:var(--bvm-soft-gray); text-transform:uppercase; letter-spacing:.03em; margin-bottom:4px; }
.dim-mini-text{ font-size:13.5px; color:var(--bvm-body); }
.dim-question-chip{
  font-size:12.5px; color:var(--bvm-body); background:var(--bvm-cream); border-radius:var(--radius-s);
  padding:9px 12px; margin-top:8px;
}

.align-summary{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.align-note{
  background:var(--bvm-cream); border-left:3px solid var(--bvm-gold); border-radius:var(--radius-s);
  padding:14px 16px; font-size:13.5px; margin:16px 0;
}
.q-list-card{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-m); padding:16px; }
.q-list-item{ display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--bvm-divider); font-size:13.5px; }
.q-list-item:last-child{ border-bottom:none; }
.q-list-item .qtag{ color:var(--bvm-soft-gray); flex-shrink:0; }

.matrix-wrap{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-l); padding:22px; margin-top:18px; }
.matrix-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:2px; background:var(--bvm-divider); border-radius:var(--radius-s); overflow:hidden; margin-top:14px; }
.matrix-cell{ background:#fff; padding:14px 10px; text-align:center; font-size:12px; min-height:70px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.matrix-cell.active{ background:var(--bvm-navy); color:#fff; font-weight:600; }
.matrix-axis-label{ font-size:11.5px; color:var(--bvm-soft-gray); text-align:center; margin-top:6px; }

.conv-card{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-l); padding:20px; margin-bottom:14px; }
.conv-card .conv-num{ color:var(--bvm-gold); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
.conv-card h4{ color:var(--bvm-navy); font-size:15.5px; font-weight:600; margin:2px 0 0; }
.conv-card--v2{ border-top:3px solid var(--bvm-gold); }
.conv-card-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:6px; }
.conv-number{ font-family:var(--font-display); font-size:32px; font-weight:700; color:var(--bvm-gold); line-height:1; flex-shrink:0; }
.conv-question-strip{
  background:var(--bvm-navy); border-left:4px solid var(--bvm-gold); border-radius:var(--radius-s);
  padding:12px 16px; margin-top:10px;
}
.conv-question-strip .conv-field-label{ color:var(--bvm-light-gold); }
.conv-question-text{ color:#fff; font-size:14px; font-weight:500; margin-top:3px; }
.conv-field{ margin-top:8px; }
.conv-field-label{ font-size:11px; font-weight:600; color:var(--bvm-soft-gray); text-transform:uppercase; letter-spacing:.03em; }
.conv-field-text{ font-size:13.5px; color:var(--bvm-body); margin-top:2px; }

.route-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; margin-top:28px; position:relative; }
.route-grid::before{
  content:''; position:absolute; top:15px; left:calc(100%/6); right:calc(100%/6); height:2px;
  background:var(--bvm-gold);
}
.route-card{ background:#fff; border:0; border-radius:0; padding:0 16px; position:relative; }
.route-card::before{
  content:''; position:absolute; top:0; left:50%; transform:translate(-50%,-50%); width:16px; height:16px;
  border-radius:50%; background:var(--bvm-navy); border:3px solid var(--bvm-gold); z-index:1;
}
.route-card{ padding-top:26px; text-align:center; }
.route-card .route-tag{ font-size:11px; font-weight:700; color:var(--bvm-gold); letter-spacing:.06em; text-transform:uppercase; }
.route-card p{ font-size:13.5px; margin-top:10px; color:var(--bvm-body); text-align:left; }
.route-priority{ margin-top:26px; }

.closing-block{ background:var(--bvm-navy); color:#fff; border-radius:var(--radius-l); padding:34px 30px; text-align:center; margin-top:10px; }
.closing-block .h2{ color:#fff; }
.closing-block p{ color:#D6DCE7; margin-top:12px; font-size:14.5px; max-width:640px; margin-left:auto; margin-right:auto; }

.method-note{ background:var(--bvm-toast); border-radius:var(--radius-m); padding:18px 20px; font-size:13.5px; color:var(--bvm-body); margin-top:16px; }

/* v1.4: rejilla 2×2 explícita para las cuatro tarjetas de tareas. Con auto-fit
   se generaban tres columnas y la cuarta tarjeta quedaba huérfana en una
   segunda fila, con dos huecos vacíos a su derecha. */
.data-mgmt-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:18px; }
@media (max-width:620px){ .data-mgmt-grid{ grid-template-columns:1fr; } }
.data-mgmt-card{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-m); padding:18px; }
.data-mgmt-card h4{ font-size:14px; color:var(--bvm-navy); font-weight:600; margin-bottom:8px; }
.data-mgmt-card p{ font-size:12.5px; color:var(--bvm-soft-gray); margin-bottom:12px; }
.participant-status-list{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-m); overflow:hidden; margin-top:16px; }
.participant-status-row{ display:flex; justify-content:space-between; align-items:center; padding:13px 18px; border-bottom:1px solid var(--bvm-divider); font-size:13.5px; }
.participant-status-row:last-child{ border-bottom:none; }
.status-tag{ font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:14px; }
.status-tag.done{ background:#E4F3E7; color:var(--bvm-positive); }
.status-tag.progress{ background:#FCEFD6; color:#946617; }
.status-tag.pending{ background:var(--bvm-blue-gray); color:var(--bvm-soft-gray); }

.radar-wrap{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-l); padding:20px; display:flex; justify-content:center; }
.radar-wrap svg{ width:100%; max-width:560px; }
@media (max-width:520px){
  .radar-wrap{ overflow-x:auto; }
  .radar-wrap svg{ min-width:420px; width:420px; }
}

/* ===== v0.3: participación agregada (privacidad) ===== */
.participation-summary{ display:flex; flex-wrap:wrap; gap:16px; }
.participation-stat{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-m); padding:16px 22px; flex:1; min-width:150px; text-align:center; }
.participation-stat .ind-value{ color:var(--bvm-navy); font-weight:600; }
.participation-stat .ind-label{ font-size:11.5px; color:var(--bvm-soft-gray); margin-top:4px; }

/* ===== v0.3: "en una mirada" (síntesis móvil) ===== */
.at-a-glance{
  background:var(--bvm-navy); border:0; border-top:4px solid var(--bvm-gold);
  border-radius:var(--radius-l); padding:26px 28px; box-shadow:var(--shadow-card);
}
.at-a-glance .eyebrow{ color:var(--bvm-light-gold); }
.glance-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:0; margin:16px 0 6px; }
.glance-grid > div{ padding:14px 20px; border-left:1px solid rgba(255,255,255,.14); }
.glance-grid > div:nth-child(odd){ border-left:0; }
.glance-grid .dim-mini-label{ color:var(--bvm-light-gold); }
.glance-grid .dim-mini-text{ font-weight:500; color:#fff; }
@media (max-width:640px){
  .glance-grid > div{ border-left:0 !important; border-top:1px solid rgba(255,255,255,.14); padding:14px 4px; }
  .glance-grid > div:first-child{ border-top:0; }
}
#fullNarrativeBlock.narrative-collapsed{ display:none; }

/* ===== v0.2: jerarquía de encabezado simplificada ===== */
.logo-navy-wrap-lg img{ height:56px; }
.prototype-tag{
  display:inline-block; margin-top:14px; font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
  color:#C9D1E0; background:rgba(255,255,255,.08); padding:4px 10px; border-radius:12px;
}
.mode-indicator{
  display:inline-flex; align-items:center; gap:6px; margin-top:14px; font-size:11px; font-weight:600; letter-spacing:.04em;
  padding:5px 12px; border-radius:12px;
}
.mode-indicator svg{ width:13px; height:13px; flex-shrink:0; }
.mode-indicator--demo{ color:var(--bvm-navy); background:var(--bvm-light-gold); }
.mode-indicator--real{ color:#fff; background:rgba(255,255,255,.14); }
.admin-title-sub{ font-weight:400; color:#C9D1E0; font-size:.72em; }
.admin-topbar-meta-line{ color:#C9D1E0; font-size:12.5px; margin-top:8px; }
.btn-compact{ padding:9px 16px; min-height:38px; font-size:13.5px; }
.btn-on-navy{ background:transparent; color:#fff; border-color:rgba(255,255,255,.5); }

/* ===== v0.7: resaltado del recorrido guiado ===== */
.guided-highlight{
  outline:3px solid var(--bvm-gold); outline-offset:3px; border-radius:var(--radius-m);
  box-shadow:0 4px 16px rgba(176,128,38,.18);
  transition:outline-color .2s ease;
}
@media (prefers-reduced-motion: reduce){
  .guided-highlight{ transition:none; }
}
.btn-on-navy:hover{ background:rgba(255,255,255,.1); }

/* ===== v0.2: navegación móvil ===== */
.desktop-only{ display:flex; }
.mobile-only{ display:none; }
.admin-mobile-nav-wrap{ padding:10px 20px; }
.admin-mobile-nav{ max-width:100%; }
@media (max-width:760px){
  .desktop-only{ display:none; }
  .mobile-only{ display:block; }
}

/* ===== v0.2: chips de dimensión y detalle de afirmaciones ===== */
.dim-question-chip.dim-chip-good{ border-left:3px solid var(--bvm-positive); }
.dim-question-chip.dim-chip-watch{ border-left:3px solid var(--bvm-gold); }
.dim-detail-list{ display:flex; flex-direction:column; gap:2px; }
.dim-detail-row{ display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--bvm-divider); font-size:13px; }
.dim-detail-row:last-child{ border-bottom:none; }
.dim-detail-text{ color:var(--bvm-body); flex:1; }
.dim-detail-score{ color:var(--bvm-navy); font-weight:600; flex-shrink:0; }

/* ===== v0.2: matriz riesgo-oportunidad de cuatro cuadrantes ===== */
.quadrant-wrap{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-l); padding:20px; margin-top:18px; }
.quadrant-svg-holder{ display:flex; justify-content:center; }
.quadrant-svg-holder svg{ width:100%; max-width:540px; }
@media (max-width:520px){
  .quadrant-svg-holder{ overflow-x:auto; justify-content:flex-start; }
  .quadrant-svg-holder svg{ min-width:460px; width:460px; }
}
.quadrant-legend{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:18px; }
.quadrant-legend-item{ display:flex; align-items:flex-start; gap:10px; font-size:12.5px; padding:10px; border-radius:var(--radius-s); background:var(--bvm-cream); }
.quadrant-legend-item.active{ background:var(--bvm-toast); border:1px solid var(--bvm-light-gold); }
.quadrant-dot{ width:10px; height:10px; border-radius:50%; margin-top:3px; flex-shrink:0; background:var(--bvm-navy); }
.quadrant-legend-item strong{ display:block; color:var(--bvm-navy); font-size:13px; }

/* ===== v0.4: reporte integral — páginas editoriales explícitas ===== */
.report-shell{ max-width:none; margin:0 auto; padding:0; background:#DCE1E8; }
.report-toolbar{ display:flex; justify-content:space-between; gap:12px; padding:18px 20px; flex-wrap:wrap; max-width:900px; margin:0 auto; }
.report-help{ background:var(--bvm-cream); border-radius:var(--radius-s); padding:12px 16px; font-size:12.5px; color:var(--bvm-body); margin:0 20px 20px; max-width:860px; margin-left:auto; margin-right:auto; }
.report-help-os{ display:block; margin-top:4px; color:var(--bvm-soft-gray); }

.report-pages{ display:flex; flex-direction:column; align-items:center; gap:22px; padding:0 0 40px; }

/* Cada .report-page representa una unidad editorial planificada: una hoja Carta completa. */
.report-page{
  width:8.5in; min-height:11in; max-width:100%; box-sizing:border-box;
  background:var(--bvm-warm-white); box-shadow:0 2px 14px rgba(23,37,65,.12);
  display:flex; flex-direction:column;
  padding:0.6in 0.72in 0.5in;
}
.report-page--cover{ background:var(--bvm-navy); color:#fff; padding:0; justify-content:center; align-items:center; text-align:center; }
.report-page__header{ margin-bottom:16pt; flex-shrink:0; }
.report-page__header .eyebrow{ display:block; font-size:8.2pt; }
.report-page__header h1{ font-size:19pt; color:var(--bvm-navy); font-weight:600; margin-top:4pt; line-height:1.3; }
.report-page__header .gold-rule{ margin:10pt 0 0; }
.report-page__content{ flex:1 1 auto; font-size:10.5pt; }
.report-page__content h2{ font-size:13pt; }
.report-page__footer{
  flex-shrink:0; display:flex; justify-content:space-between; align-items:center;
  border-top:1px solid var(--bvm-divider); padding-top:8pt; margin-top:18pt;
  font-size:8pt; color:var(--bvm-soft-gray);
}

/* Portada: bloque centrado propio, sin la jerarquía eyebrow/h1/regla del resto de páginas. */
.report-cover-inner{ max-width:5.6in; padding:0 0.5in; }
.report-cover-inner .logo-navy-wrap{ justify-content:center; margin-bottom:30pt; }
.report-cover-inner .eyebrow{ color:var(--bvm-light-gold); letter-spacing:.16em; font-size:9pt; }
.report-cover-inner h1{ color:#fff; font-size:23pt; margin-top:10pt; line-height:1.35; }
.report-cover-inner .report-cover-sub{ color:#D6DCE7; font-size:11pt; margin-top:14pt; font-style:italic; line-height:1.5; }
.report-cover-inner .gold-rule{ margin:22pt auto; }
.report-cover-inner .report-cover-meta{ color:#C9D1E0; font-size:10pt; margin-top:6pt; line-height:1.9; }
.report-cover-inner .confidential-tag{ display:inline-block; margin-top:20pt; font-size:8.5pt; letter-spacing:.12em; text-transform:uppercase; color:var(--bvm-navy); background:var(--bvm-light-gold); padding:6pt 16pt; border-radius:14px; }
.report-cover-inner .confidential-tag--demo{ background:var(--bvm-gold); color:#fff; }
.report-demo-banner{
  background:var(--bvm-gold); color:#fff; font-size:8.5pt; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  text-align:center; padding:5pt 10pt; margin:-0.6in -0.72in 14pt; flex-shrink:0;
}
.report-cover-inner .confidentiality-note{ color:#B9C2D4; font-size:8.5pt; margin-top:26pt; line-height:1.6; border-top:1px solid rgba(255,255,255,.18); padding-top:14pt; }

.report-page-inner-break{ break-inside:avoid; page-break-inside:avoid; }

@media (max-width:860px){
  .quadrant-legend{ grid-template-columns:1fr; }
}

@media (max-width:860px){
  .two-col, .dim-grid-2, .route-grid, .glance-grid{ grid-template-columns:1fr; }
  .matrix-grid{ grid-template-columns:repeat(2,1fr); }
  .participation-summary{ flex-direction:column; }
}

/* ===== v1.1: panorama general — radar + barras lado a lado ===== */
.charts-stack{ display:flex; flex-direction:column; gap:22px; margin-top:16px; }
.charts-stack .radar-wrap{ display:flex; justify-content:center; }
.charts-stack .bars-wrap{ background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-l); padding:20px 22px; }
.charts-stack .bars-wrap svg{ width:100%; }
@media (max-width:480px){
  .charts-stack .bars-wrap{ overflow-x:auto; }
  .charts-stack .bars-wrap svg{ min-width:460px; width:460px; }
}
.bars-wrap-title{ font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-gold); display:block; margin-bottom:12px; }
.chart-note{ font-size:12px; color:var(--bvm-soft-gray); margin-top:12px; font-style:italic; }

/* ===== v1.1: escalera de madurez reutilizable ===== */
.maturity-scale-wrap{ margin:14px 0; }
.maturity-scale-caption{ display:flex; gap:14px; align-items:baseline; margin-top:4px; flex-wrap:wrap; }
.maturity-scale-score{ font-size:16px; font-weight:700; color:var(--bvm-navy); }
.maturity-scale-avg{ font-size:12px; color:var(--bvm-soft-gray); }
.maturity-scale-level{ font-size:12px; font-weight:700; color:var(--bvm-gold); text-transform:uppercase; letter-spacing:.03em; }

/* ===== v1.1: ruta Alinear / Acordar / Institucionalizar ===== */
.route-diagram{ display:flex; align-items:stretch; gap:0; margin-top:18px; }
.route-connector{ display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--bvm-gold); font-weight:700; padding:0 6px; flex-shrink:0; }
.route-phase{
  flex:1; background:#fff; border:1px solid var(--bvm-divider); border-radius:var(--radius-m);
  padding:18px 16px; position:relative;
}
.route-phase--suggested{ border:2px solid var(--bvm-gold); box-shadow:0 4px 14px rgba(176,128,38,.15); }
.route-phase-badge{
  display:block; font-size:9.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
  color:#fff; background:var(--bvm-gold); padding:3px 8px; border-radius:8px; margin-bottom:8px; text-align:center;
}
.route-phase-num{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--bvm-gold); }
.route-phase-title{ color:var(--bvm-navy); font-size:15px; font-weight:700; margin-top:2px; }
.route-phase-objective{ font-size:12.5px; color:var(--bvm-body); margin-top:8px; }
.route-phase-detail{ font-size:11.5px; color:var(--bvm-soft-gray); margin-top:8px; line-height:1.5; }
.route-phase-detail strong{ color:var(--bvm-navy); }
@media (max-width:760px){
  .route-diagram{ flex-direction:column; }
  .route-connector{ transform:rotate(90deg); padding:6px 0; }
}

/* ===== v1.1: módulo Disposición para avanzar ===== */
.disposition-module{ background:var(--bvm-cream); border-radius:var(--radius-l); padding:20px 22px; }
.ext-module{ background:#fff; border-radius:var(--radius-l); padding:20px 22px; border:1px solid var(--bvm-border); }
.ext-module-grid{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:24px; align-items:start; }
.ext-module-left{ min-width:0; }
.ext-module-right{ min-width:0; border-left:1px solid var(--bvm-border); padding-left:22px; }
.ext-module-title{ font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-slate); }
.ext-module-value{ font-size:38px; font-weight:800; color:var(--bvm-navy); font-family:var(--font-display); line-height:1; margin-top:6px; }
.ext-module-value-of5{ font-size:15px; font-weight:600; color:var(--bvm-slate); }
.ext-module-qual{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:5px 10px; border-radius:4px; margin-top:10px; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
.ext-module-reading{ margin-top:16px; padding-top:14px; border-top:1px solid var(--bvm-border); }
.ext-module-reading-label{ display:block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-slate); margin-bottom:5px; }
.ext-module-reading p{ font-size:13px; color:var(--bvm-ink); line-height:1.55; margin:0; }
@media (max-width:700px){
  .ext-module-grid{ grid-template-columns:1fr; gap:18px; }
  .ext-module-right{ border-left:0; border-top:1px solid var(--bvm-border); padding-left:0; padding-top:16px; }
}

/* ===== v1.1: cadena hallazgo → implicación → riesgo → foco ===== */
.findings-chain{ margin-top:18px; max-width:640px; }
.findings-step{ background:#F2F5F8; border-left:3px solid var(--bvm-navy); border-radius:var(--radius-s); padding:14px 18px; }
.findings-step-label{ display:block; font-size:11px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-gold); margin-bottom:4px; }
.findings-step p{ font-size:13.5px; color:var(--bvm-body); margin:0; }
.findings-arrow{ text-align:center; color:var(--bvm-gold); font-size:16px; font-weight:700; padding:2px 0; }

/* ===== v1.1: ranking de prioridad de conversaciones ===== */
.priority-ranking{ background:var(--bvm-cream); border-radius:var(--radius-l); padding:18px 20px; margin-bottom:18px; }
.priority-rank-row{ display:flex; align-items:center; gap:12px; padding:8px 0; }
.priority-rank-num{ font-family:var(--font-display); font-size:16px; font-weight:700; color:var(--bvm-navy); width:24px; flex-shrink:0; }
.priority-rank-body{ flex:1; min-width:0; }
.priority-rank-title{ font-size:12.5px; font-weight:600; color:var(--bvm-navy); margin-bottom:4px; }
.priority-rank-dim{ font-weight:400; color:var(--bvm-soft-gray); }
.priority-rank-track{ background:#EDEFF2; border-radius:2px; height:12px; overflow:hidden; }
.priority-rank-fill{ background:var(--bvm-gold); height:100%; border-radius:2px; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
.priority-rank-qual{ font-size:10px; font-weight:800; text-transform:uppercase; flex-shrink:0; padding:5px 12px; border-radius:12px; text-align:center; print-color-adjust:exact; -webkit-print-color-adjust:exact; }

/* ===== v1.1: flujo de 3 pasos dentro de cada tarjeta de conversación ===== */
.conv-flow{ display:flex; align-items:stretch; gap:6px; margin-top:12px; }
.conv-flow-step{ flex:1; background:#F7F8FA; border-radius:var(--radius-s); padding:8px 10px; }
.conv-flow-label{ display:block; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--bvm-gold); margin-bottom:3px; }
.conv-flow-step p{ font-size:11.5px; color:var(--bvm-body); margin:0; }
.conv-flow-arrow{ display:flex; align-items:center; color:var(--bvm-gold); font-weight:700; font-size:13px; }
@media (max-width:600px){ .conv-flow{ flex-direction:column; } .conv-flow-arrow{ transform:rotate(90deg); justify-content:center; padding:2px 0; } }

/* ===== v1.1: síntesis visual de cierre (3 mensajes) ===== */
.closing-synthesis{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.closing-synthesis-item{ background:#F2F5F8; border-radius:var(--radius-m); padding:14px 16px; }
.closing-synthesis-label{ display:block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--bvm-gold); margin-bottom:6px; }
.closing-synthesis-item p{ font-size:12px; color:var(--bvm-navy); font-weight:600; margin:0; }
@media (max-width:700px){ .closing-synthesis{ grid-template-columns:1fr; } }

/* ===== v1.2: tarjeta "siguiente acción recomendada" ===== */
.next-action-card{
  background:var(--bvm-navy); border-radius:var(--radius-l); padding:20px 22px; margin:14px 0;
  border-left:4px solid var(--bvm-gold);
}

/* ===== v1.4: distribución de respuestas — barras sobrias, poco redondeadas ===== */
.ext-dist-caption{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--bvm-slate); margin-bottom:12px; }
.ext-dist{ display:flex; gap:8px; align-items:flex-end; justify-content:space-between; }
.ext-dist-col{ display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; min-width:0; }
.ext-dist-bar-track{ display:flex; align-items:flex-end; height:104px; width:100%; justify-content:center; }
.ext-dist-bar{ width:100%; max-width:38px; border-radius:2px; min-height:6px; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
.ext-dist-n{ font-weight:800; color:var(--bvm-navy); font-size:13px; font-family:var(--font-display); }
.ext-dist-value-label{ font-weight:600; color:var(--bvm-slate); font-size:11px; }

/* ===== v1.4: takeaway ejecutivo (composición editorial, no otra tarjeta) ===== */
.exec-takeaway{ margin-top:20px; padding:16px 0 0; border-top:2px solid var(--bvm-navy); }
.exec-takeaway-label{ display:block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--bvm-slate); margin-bottom:6px; }
.exec-takeaway p{ font-size:14px; color:var(--bvm-ink); line-height:1.6; margin:0; }
.exec-takeaway strong{ color:var(--bvm-navy); font-weight:700; }

/* ===== v1.4: portada más sobria y nota metodológica condensada ===== */
.report-cover-family{
  font-family:var(--font-display); font-size:26pt; font-weight:700; color:#fff;
  margin-top:22pt; letter-spacing:-0.01em;
}
.report-cover-fineprint{
  margin-top:26pt; font-size:8pt; color:rgba(255,255,255,.55); letter-spacing:.02em;
}
.method-note{ margin-top:24px; padding-top:16px; border-top:1px solid var(--bvm-border); }
.method-note-label{ display:block; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--bvm-slate); margin-bottom:7px; }
.method-note p{ font-size:11.5pt; color:var(--bvm-slate); line-height:1.6; margin:0; }

/* ===== v1.5 (sección 4): pantalla de cierre comercial ===== */
.closing-stage{ max-width:720px; margin:0 auto; padding:8px 0 40px; }
.closing-stage-title{
  font-family:var(--font-display); font-size:32px; font-weight:700; color:var(--bvm-navy);
  line-height:1.2; margin-top:10px; letter-spacing:-0.01em;
}
.closing-stage-lede{ font-size:15.5px; color:var(--bvm-ink); line-height:1.65; margin-top:16px; max-width:640px; }
.closing-outcomes{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0; margin-top:32px; border-top:2px solid var(--bvm-navy); }
.closing-outcome{ padding:18px 20px 4px 0; }
.closing-outcome + .closing-outcome{ padding-left:22px; border-left:1px solid var(--bvm-border); }
.closing-outcome-label{ display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--bvm-gold); margin-bottom:7px; }
.closing-outcome p{ font-size:13.5px; color:var(--bvm-ink); line-height:1.55; margin:0; }
.closing-actions{ margin-top:36px; display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
.evolution-closing-cta{ margin-top:26px; padding-top:22px; border-top:2px solid var(--bvm-navy); }
@media (max-width:700px){
  .closing-outcomes{ grid-template-columns:1fr; }
  .closing-outcome + .closing-outcome{ padding-left:0; border-left:0; border-top:1px solid var(--bvm-border); padding-top:16px; }
  .closing-stage-title{ font-size:25px; }
}

/* ===== v1.5 (sección 6): cierre del reporte con siguiente paso ===== */
.report-next-step{ margin-top:22px; padding:20px 0 0; border-top:2px solid var(--bvm-navy); }
.report-next-step-title{ font-family:var(--font-display); font-size:19pt; font-weight:700; color:var(--bvm-navy); margin-top:6px; }
.report-next-step-body{ font-size:12pt; color:var(--bvm-ink); line-height:1.6; margin-top:8px; max-width:560px; }
.report-next-step-kicker{ font-size:11pt; color:var(--bvm-gold); font-weight:700; margin-top:10px; }
.method-footnote{ margin-top:22px; padding-top:10px; border-top:1px solid var(--bvm-border); font-size:8.5pt; color:var(--bvm-slate); line-height:1.5; }
.dist-microlegend{ font-size:10.5px; color:var(--bvm-slate); line-height:1.5; margin-top:16px; padding-top:12px; border-top:1px solid var(--bvm-border); }
.matrix-question{ font-size:13.5px; font-weight:700; color:var(--bvm-navy); margin-top:6px; font-style:italic; }

/* ===== v1.5 (sección 10, página 11): jerarquía de las tres fases ===== */
.route-phase--past{ border-color:var(--bvm-border); opacity:.72; }
.route-phase--past .route-phase-num{ color:var(--bvm-navy); opacity:.55; }
.route-phase--past .route-phase-title{ color:var(--bvm-navy); opacity:.7; }
.route-phase--current{ border:2px solid var(--bvm-gold); box-shadow:0 2px 12px rgba(176,128,38,.14); }
.route-phase--current .route-phase-num{ color:var(--bvm-gold); }
.route-phase--future{ border-color:var(--bvm-border); background:#FAFBFC; }
.route-phase--future .route-phase-num,
.route-phase--future .route-phase-title{ color:var(--bvm-slate); }
.route-phase--future .route-phase-objective,
.route-phase--future .route-phase-detail{ color:var(--bvm-slate); }

/* ============================================================
   v1.5 (sección 7) — EDICIÓN TOP 5 PREMIUM
   Reduce la apariencia de tablero: menos cajas compitiendo entre sí,
   sombras casi imperceptibles y más aire alrededor del mensaje
   principal. La jerarquía la da la tipografía y el espacio, no el
   número de recuadros.
   ============================================================ */
.card{ box-shadow:none; border:1px solid var(--bvm-border); }
.indicator-card{ box-shadow:none; }
.dim-card{ box-shadow:none; }
.radar-wrap, .quadrant-wrap, .charts-stack .bars-wrap{ box-shadow:none; }
.ext-module{ box-shadow:none; }
.conv-card{ box-shadow:none; }

/* Más aire alrededor del mensaje principal de cada sección. */
.admin-section{ padding-top:34px; }
.section-head{ margin-bottom:20px; }
.section-head .h2{ margin-top:4px; }

/* La síntesis ejecutiva respira: es el bloque que más se lee. */
.narrative-block p{ font-size:14.5px; line-height:1.72; margin-bottom:14px; }
.narrative-block p:last-child{ margin-bottom:0; }

/* Sin cápsulas ni redondez excesiva en ningún elemento informativo. */
.dim-level-tag, .ext-module-qual, .priority-rank-qual, .confidential-tag{ border-radius:4px; }
.progress-track, .progress-fill, .priority-rank-track, .priority-rank-fill,
.tour-progress-track, .tour-progress-fill{ border-radius:2px; }

/* ===== v1.5 (sección 10, página 10): jerarquía de conversaciones ===== */
.conv-card--primary{ border-left:3px solid var(--bvm-gold); padding-left:20px; }
.conv-card--compact{ border-left:1px solid var(--bvm-border); padding-left:20px; margin-top:16px; }
.conv-card-head--compact{ margin-bottom:8px; }
.conv-number--compact{ font-size:15px; color:var(--bvm-slate); }
.conv-card--compact h4{ font-size:14.5px; }
.conv-compact-finding{ font-size:12.5px; color:var(--bvm-ink); line-height:1.55; margin:0 0 6px; }
.conv-compact-risk{ font-size:12.5px; color:var(--bvm-slate); line-height:1.55; margin:0 0 10px; }
.conv-compact-risk strong{ color:var(--bvm-navy); }
.conv-question-strip--compact{ padding:8px 12px; }
.conv-question-strip--compact .conv-question-text{ font-size:12.5px; }

/* ===== v1.5 (sección 10, página 3): radar dominante, barras como precisión =====
   Antes ambos visuales tenían el mismo peso y mostraban los mismos cuatro
   números, lo que producía redundancia. Ahora el radar es el visual principal
   (equilibrio del perfil) y las barras quedan como referencia de precisión,
   más discretas y con menos presencia de caja. */
.charts-stack .radar-wrap{ border:0; background:transparent; padding:0; }
.charts-stack .radar-wrap svg{ max-width:620px; }
.charts-stack .bars-wrap{
  background:transparent; border:0; border-top:1px solid var(--bvm-border);
  border-radius:0; padding:18px 0 0; margin-top:4px;
}
.charts-stack .bars-wrap svg{ max-width:560px; margin:0 auto; }
.bars-wrap-title{ color:var(--bvm-slate); font-weight:700; }

/* ===== v1.5 (sección 10, páginas 4-7): composición editorial sin cajas ===== */
.dim-reading{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:26px; margin-top:14px; }
.dim-reading-col{ padding-left:14px; border-left:2px solid var(--bvm-border); }
.dim-reading-col--develop{ border-left-color:var(--bvm-gold); }
.dim-reading-label{ display:block; font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--bvm-navy); margin-bottom:6px; }
.dim-reading-col p{ font-size:13px; color:var(--bvm-ink); line-height:1.6; margin:0; }
.dim-perception{ font-size:12.5px; color:var(--bvm-slate); line-height:1.6; margin:18px 0 0; }
.dim-perception-label{ font-weight:700; color:var(--bvm-navy); }
.dim-question-block{ margin-top:18px; padding-top:14px; border-top:1px solid var(--bvm-border); }
.dim-question-label{ display:block; font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-gold); margin-bottom:5px; }
.dim-question-block p{ font-size:14px; color:var(--bvm-navy); font-weight:600; line-height:1.55; margin:0; }
@media (max-width:640px){ .dim-reading{ grid-template-columns:1fr; gap:18px; } }
.route-phase-outcome-brief{ font-size:11.5px; color:var(--bvm-slate); line-height:1.5; margin-top:8px; font-style:italic; }
.align-warning{ background:#FBF3E2; border-left:3px solid var(--bvm-exec-mustard); padding:14px 16px; font-size:13px; color:var(--bvm-ink); line-height:1.6; margin-bottom:18px; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
.align-warning strong{ color:var(--bvm-navy); }

/* ===== v1.6.1 (§7.2): dos niveles de lectura en la matriz de riesgo ===== */
.matrix-readings{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0; }
.matrix-reading{ padding:2px 16px 2px 0; }
.matrix-reading--applied{ padding-left:18px; border-left:2px solid var(--bvm-gold); }
.matrix-reading-label{ display:block; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--bvm-slate); margin-bottom:4px; }
.matrix-reading-value{ font-family:var(--font-display); font-size:17px; font-weight:700; color:var(--bvm-navy); }
.matrix-reading--applied .matrix-reading-value{ color:var(--bvm-gold); }
.matrix-reframe-note{ font-size:12.5px; color:var(--bvm-ink); line-height:1.55; margin-top:12px; }
.matrix-scope-note{ font-size:11px; color:var(--bvm-slate); line-height:1.5; margin-top:6px; font-style:italic; }
@media (max-width:640px){ .matrix-readings{ grid-template-columns:1fr; gap:12px; } .matrix-reading--applied{ padding-left:0; border-left:0; border-top:2px solid var(--bvm-gold); padding-top:10px; } }
.report-next-step-steps{ font-size:11pt; font-weight:700; color:var(--bvm-gold); letter-spacing:.02em; margin-top:10px; }

@media print{
  /* v1.6.4 (sección 3.4): se elimina size:letter. Forzaba Carta incluso al
     pedir A4 desde el diálogo de impresión. Ahora el usuario elige el tamaño
     y el diseño se adapta con medidas relativas. */
  @page{ margin:0; }
  /* ============================================================
     v1.6.5 CAPA 1 — LIBERAR EL FLUJO DEL DOCUMENTO.
     Causa raíz de la página única: html y body tenían height:100% y
     .admin-shell min-height:100vh. Esos contenedores encerraban las 12
     páginas dentro de una sola altura de viewport, así que Chrome no
     tenía flujo vertical donde paginar. Al liberarlos, el documento
     fluye y los saltos de página funcionan.
     ============================================================ */
  html, body, #appRoot, #modalRoot, .admin-shell, .report-shell, .report-pages{
    display:block !important;
    width:auto !important; max-width:none !important;
    height:auto !important; min-height:0 !important; max-height:none !important;
    overflow:visible !important; overflow-x:visible !important; overflow-y:visible !important;
    position:static !important; transform:none !important;
    margin:0 !important; padding:0 !important;
    contain:none !important; isolation:auto !important; filter:none !important;
  }
  html, body{ background:#fff; font-size:10.5pt; }

  /* §4.2: nada interactivo debe ocupar espacio residual en la hoja. */
  .no-print, .admin-nav, .admin-topbar, .selector-screen, .participant-topbar,
  .report-toolbar, .report-help, .tour-overlay, .tour-card, .tour-scrim,
  .modal-overlay, .help-panel, .toast-fixed, .help-fab, .storage-fallback-banner,
  #tourOverlayRoot, #printHelpRoot{
    display:none !important;
  }
  .no-print, .admin-nav, .admin-topbar .btn, .selector-screen, .participant-topbar .btn,
  .toast-fixed, .modal-overlay, .data-mgmt-grid, .admin-topbar .icon-btn, .report-toolbar, .report-help,
  .storage-fallback-banner{ display:none !important; }
  .admin-shell{ background:#fff; }

  /* El reporte integral abre siempre todos los contenidos: no depende de acordeones de pantalla. */
  #fullNarrativeBlock.narrative-collapsed{ display:block !important; }

  .report-shell{ background:#fff; }
  /* (la regla completa de .report-pages está más abajo, con !important) */

  /* Cada .report-page ES una hoja Carta. Termina siempre en salto de página,
     salvo la última (para no generar una hoja en blanco final). */
  /* v1.6.3 (sección 3.3) — CORRECCIÓN DEL BLOQUEADOR DE IMPRESIÓN.
     Antes: height:11in fijo (incompatible con A4, que mide 11.69in) más
     min-height:100vh (poco fiable en impresión). Con altura fija y
     break-inside:avoid, cualquier contenido que excediera por poco se
     empujaba completo fuera de la hoja: eso vaciaba las páginas 4 a 7.
     Ahora la altura es automática y el contenido manda. */
  /* v1.6.4 (sección 3.1) — CAUSA RAÍZ DE LA PÁGINA ÚNICA.
     .report-pages seguía siendo un contenedor flex durante la impresión, y
     los saltos de página declarados en los hijos NO se aplican dentro de un
     flex container: Chrome los ignoraba y unía las 12 páginas en una sola
     hoja. Convertirlo en bloque restaura la paginación real. */
  .report-shell, .report-pages{
    display:block !important; flex:none !important;
    width:100% !important; max-width:none !important;
    height:auto !important; min-height:0 !important; max-height:none !important;
    overflow:visible !important;
    padding:0 !important; margin:0 !important; gap:0 !important;
    align-items:initial !important; background:#fff !important;
  }

  /* ============================================================
     v1.6.5 CAPA 2 — CAJA FÍSICA UNIVERSAL.
     Ancho limitado por A4 (210mm) y altura limitada por Carta (279.4mm).
     209 × 278 mm entra en ambos formatos sin generar hojas extra por
     redondeo. A4 queda con algo más de aire vertical; Carta no desborda.
     ============================================================ */
  .report-page{
    display:block !important; position:relative !important;
    box-sizing:border-box !important;
    width:209mm !important; max-width:209mm !important;
    height:278mm !important; min-height:278mm !important; max-height:278mm !important;
    overflow:visible !important;
    margin:0 auto !important; padding:0 !important;
    box-shadow:none !important; transform:none !important;
    break-before:auto !important; page-break-before:auto !important;
    break-after:page !important; page-break-after:always !important;
    break-inside:avoid-page !important; page-break-inside:avoid !important;
  }
  .report-page:last-child{ break-after:auto !important; page-break-after:auto !important; }

  /* §5.1: caja interna con márgenes editoriales. El contenido debe caber
     aquí después de descontar padding, encabezado y pie. */
  .report-page__inner, .report-page > *{ box-sizing:border-box !important; }
  .report-page{ padding:10mm 12mm 9mm !important; }
  .report-page--cover{ padding:0 !important; display:flex !important; }
  .report-page--cover{ break-inside:avoid; }

  .report-page__header{ break-after:avoid; page-break-after:avoid; }
  .report-page__footer{ break-before:avoid; page-break-before:avoid; }

  /* v1.6.3 (sección 3.4): .dim-card se RETIRA de esta lista. En las páginas
     4 a 7 esa tarjeta es el contenido completo de la página, así que
     declararla indivisible obligaba al navegador a expulsarla entera cuando
     no cabía por márgenes mínimos. Los demás bloques sí son subcomponentes
     que caben holgadamente y conservan la regla. */
  .conv-card, .route-card, .matrix-wrap, .quadrant-wrap, .radar-wrap, .indicator-card, .card, .at-a-glance,
  .report-page-inner-break{
    break-inside:avoid; page-break-inside:avoid; box-shadow:none !important; border:1px solid #D8D4C6 !important;
  }
  h1,h2,h3,h4{ break-after:avoid; page-break-after:avoid; orphans:3; widows:3; }
  p{ orphans:3; widows:3; }

  .closing-block{ background:#fff !important; color:var(--bvm-navy) !important; border:2px solid var(--bvm-navy); }
  .closing-block .h2, .closing-block p{ color:var(--bvm-navy) !important; }
  a[href]:after{ content:""; }

  /* Compatibilidad A4: si el navegador imprime en A4, la hoja es un poco más
     angosta y alta; al usar unidades flexibles dentro de .report-page__content
     el contenido se reacomoda sin cortarse, aunque el aprovechamiento vertical
     no sea idéntico al de Carta. */

  /* v1.2: compactación específica para impresión de los bloques más altos
     agregados en v1.1/v1.2 (matrices, ruta, disposición), para mantener cada
     página del reporte dentro de una sola hoja Carta. Los tamaños normales
     en pantalla no cambian — esto aplica solo dentro de @media print. */
  .quadrant-svg-holder svg{ max-width:400px !important; }
  .radar-wrap svg{ max-width:380px !important; }
  .maturity-scale-wrap{ margin:8px 0 !important; }
  .findings-chain{ margin-top:10px !important; }
  .findings-step{ padding:8px 12px !important; }
  .findings-step p{ font-size:11pt !important; }
  .route-phase{ padding:10px 12px !important; }
  .route-phase-objective, .route-phase-detail{ font-size:10pt !important; margin-top:5px !important; }
  .disposition-module{ padding:12px 14px !important; }
  .ext-module{ padding:12px 14px !important; }
  .ext-module-grid{ gap:16px !important; }
  .ext-module-right{ padding-left:16px !important; }
  .ext-module-value{ font-size:26pt !important; }
  .ext-module-reading p{ font-size:10.5pt !important; }
  .ext-dist-bar-track{ height:56px !important; }
  .ext-dist-bar{ max-width:28px !important; }
  /* v1.4: elementos editoriales nuevos — compactados para caber en una hoja. */
  .exec-takeaway{ margin-top:14px !important; padding-top:12px !important; }
  .exec-takeaway p{ font-size:11.5pt !important; }
  .method-note{ margin-top:16px !important; padding-top:12px !important; }
  .method-note p{ font-size:10.5pt !important; }
  .report-cover-family{ font-size:22pt !important; margin-top:18pt !important; }
  .report-cover-fineprint{ margin-top:20pt !important; }
  .priority-ranking{ padding:12px 14px !important; }
  .priority-rank-row{ padding:5px 0 !important; }
  .next-action-card{ display:none !important; } /* operativo, no pertenece al reporte impreso */

  /* ============================================================
     v1.5 — elementos nuevos en impresión. Cada bloque agregado en esta
     versión necesita su compactación: sin esto, las páginas de dimensión
     y conversaciones desbordan la hoja Carta.
     ============================================================ */
  /* §10 páginas 4-7: composición editorial de las dimensiones */
  .dim-reading{ gap:16px !important; margin-top:10px !important; }
  .dim-reading-col p{ font-size:10.5pt !important; }
  .dim-reading-label{ font-size:9.5pt !important; }
  .dim-perception{ font-size:10pt !important; margin-top:12px !important; }
  .dim-question-block{ margin-top:12px !important; padding-top:10px !important; }
  .dim-question-block p{ font-size:11pt !important; }

  /* §10 página 10: jerarquía de conversaciones */
  .conv-card--primary{ padding-left:14px !important; }
  .conv-card--compact{ padding-left:14px !important; margin-top:12px !important; break-inside:avoid; page-break-inside:avoid; }
  .conv-compact-finding, .conv-compact-risk{ font-size:10pt !important; }
  .conv-question-strip--compact{ padding:6px 10px !important; }

  /* §10 página 11: estados de fase — el color debe sobrevivir a la impresión */
  .route-phase--past, .route-phase--current, .route-phase--future{
    print-color-adjust:exact; -webkit-print-color-adjust:exact;
  }
  .route-phase--past{ opacity:.8 !important; }

  /* §9: pregunta guía de cada matriz */
  .matrix-question{ font-size:11pt !important; margin-top:4px !important; }

  /* §8: microleyenda de distribuciones */
  .dist-microlegend{ font-size:8.5pt !important; margin-top:10px !important; padding-top:8px !important; }

  /* §4: la pantalla de cierre comercial es operativa, no parte del reporte */
  .closing-stage, .evolution-closing-cta{ display:none !important; }

  /* §6: bloque de siguiente paso en la página 12 */
  .report-next-step{ margin-top:16px !important; padding-top:12px !important; }
  .report-next-step-title{ font-size:16pt !important; }
  .report-next-step-body{ font-size:11pt !important; }
  .report-next-step-kicker{ font-size:10pt !important; margin-top:8px !important; }

  /* ============================================================
     v1.6.3 — IMPRESIÓN DE LAS PÁGINAS DE DIMENSIÓN (4 a 7).
     El contenedor deja de ser flex en impresión: un flex column con
     altura restringida puede recortar hijos en lugar de dejarlos fluir.
     Se compactan espacios para que las cuatro páginas quepan completas
     sin ocultar absolutamente nada.
     ============================================================ */
  .report-page{ display:block !important; }
  .report-page__content{ flex:none !important; display:block !important; }
  .report-page--cover{ display:flex !important; }

  /* Compactación específica de la tarjeta de dimensión */
  .dim-card{ padding:0 !important; border:0 !important; margin:0 !important; }
  .dim-card-head{ margin-bottom:8px !important; }
  .dim-layer{ padding:10px 0 0 !important; margin-top:10px !important; }
  .dim-layer--evidencia{ padding:10px 12px !important; margin-top:10px !important; }
  .maturity-scale-wrap{ margin:6px 0 !important; }
  .maturity-scale-wrap svg{ max-width:400px !important; }
  .dim-reading{ gap:14px !important; margin-top:10px !important; }
  .dim-reading-col p{ font-size:10pt !important; line-height:1.45 !important; }
  .dim-perception{ font-size:9.5pt !important; margin-top:10px !important; }
  .dim-question-block{ margin-top:10px !important; padding-top:9px !important; }
  .dim-question-block p{ font-size:10.5pt !important; }
  .dim-evidence-chips{ gap:6px !important; }
  .dim-chip{ font-size:9pt !important; padding:5px 9px !important; }

  /* Nada puede quedar oculto ni fuera de la hoja */
  .report-page, .report-page *{ overflow:visible !important; }
  .report-page *{ max-height:none !important; }
}

/* ============================================================
   v1.6.5 CAPA 3 — COMPACTACIÓN EDITORIAL.
   Respeta los límites tipográficos: cuerpo ≥8.5pt, notas ≥7.5pt,
   interlineado ≥1.18. No se oculta contenido ni se usa overflow.
   ============================================================ */
@media print{
  .report-page__header{ margin-bottom:5mm !important; }
  .report-page__footer{ margin-top:3mm !important; position:static !important; }
  .report-page h1{ margin-bottom:4mm !important; font-size:17pt !important; line-height:1.2 !important; }
  .report-page h2{ margin-top:2.5mm !important; margin-bottom:2mm !important; font-size:12.5pt !important; }
  .report-page h3{ font-size:12pt !important; margin-bottom:2mm !important; }
  .report-page p{ margin-top:0 !important; margin-bottom:2.2mm !important; line-height:1.22 !important; }
  .report-page__content{ font-size:9pt !important; }

  /* Sombras y radios fuera; no aportan en papel y suman ruido. */
  .card, .indicator-card, .dim-card, .conv-card, .route-card, .matrix-wrap,
  .quadrant-wrap, .radar-wrap, .at-a-glance, .ext-module{ box-shadow:none !important; }

  /* §12: gráficos adaptables, nunca con medidas fijas que excedan la caja. */
  .report-page svg{ max-width:100% !important; height:auto !important; }

  /* Página 3: el radar es el visual dominante pero acotado. */
  #report-page-indicadores .radar-wrap svg{ max-height:78mm !important; }
  #report-page-indicadores .bars-wrap svg{ max-height:42mm !important; }
  #report-page-indicadores .charts-stack{ gap:4mm !important; }

  /* Páginas 4-7: misma gramática editorial, compactada. */
  .dim-card{ padding:0 !important; border:0 !important; }
  .dim-layer{ padding:3mm 0 0 !important; margin-top:3mm !important; }
  .dim-layer--evidencia{ padding:3mm 4mm !important; margin-top:3mm !important; }
  .maturity-scale-wrap{ margin:2mm 0 !important; }
  .maturity-scale-wrap svg{ max-height:16mm !important; }
  .dim-reading{ gap:5mm !important; margin-top:3mm !important; }
  .dim-reading-col p{ font-size:8.8pt !important; line-height:1.25 !important; }
  .dim-perception{ font-size:8.6pt !important; margin-top:3mm !important; }
  .dim-question-block{ margin-top:3mm !important; padding-top:2.5mm !important; }
