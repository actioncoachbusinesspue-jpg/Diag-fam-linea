// ============================================================
// GuidedTourManager — motor único para los tres recorridos.
// ============================================================
const GuidedTourManager = (function(){
  let autoplayTimer = null;
  let countdownTimer = null;
  let runToken = 0;      // identidad de ejecución: invalida callbacks de timers anteriores
  let stepElapsed = 0;   // décimas de segundo transcurridas en el paso actual
  const STEP_DURATION_MS = 5000;
  let opener = null;
  let resizeHandler = null;

  // v1.5 (sección 3.3): si el paso apunta a algo que no existe en este momento
  // (por ejemplo, una familia sin datos aún), se usa el texto de estado vacío
  // en lugar de describir algo que la persona no puede ver.
  // El fallbackSelector sirve ÚNICAMENTE para posicionar la tarjeta: no debe
  // influir en esta decisión, porque es un selector genérico que casi siempre
  // existe y enmascararía el estado vacío real.
  function stepBodyText(step){
    if(!step.targetSelector) return step.body;
    if(!step.emptyStateBody) return step.body;
    return qs(step.targetSelector) ? step.body : step.emptyStateBody;
  }

  function stepsFor(mode, filterTab){
    const all = TOUR_DEFINITIONS[mode] || [];
    return filterTab ? all.filter(function(s){ return s.tab === filterTab; }) : all;
  }

  function storageKey(mode){ return 'tour_state_' + mode; }
  function getSeenState(){ return StorageAdapter.loadPrototypeState() || {}; }
  // v1.6.2 (sección 4): dos estados INDEPENDIENTES por modo.
  //   introSeen   -> la pantalla previa ya se mostró en esta entrada
  //   noAutoStart -> preferencia explícita de no iniciar la guía sola
  // Antes ambos se mezclaban en "skipped", así que la casilla no describía lo
  // que realmente controlaba y omitir una vez bloqueaba el arranque para
  // siempre sin que la persona lo hubiera pedido.
  function hasCompletedOrSkipped(mode){
    const st = getSeenState();
    const t = st.tours && st.tours[mode];
    return !!(t && (t.completed || t.introSeen || t.noAutoStart));
  }
  function prefersNoAutoStart(mode){
    const st = getSeenState();
    return !!(st.tours && st.tours[mode] && st.tours[mode].noAutoStart);
  }
  // §4.C: reiniciar borra la preferencia SOLO del recorrido indicado y no
  // toca ningún dato del diagnóstico.
  function resetTourPreference(mode){
    const st = getSeenState();
    if(st.tours && st.tours[mode]){
      delete st.tours[mode].introSeen;
      delete st.tours[mode].noAutoStart;
      delete st.tours[mode].skipped;
      delete st.tours[mode].completed;
      StorageAdapter.savePrototypeState(st);
    }
    InternalLogger.log('tour-preference-reset', { mode: mode });
  }
  function markTourState(mode, patch){
    const st = getSeenState();
    st.tours = st.tours || {};
    st.tours[mode] = Object.assign({}, st.tours[mode], patch);
    StorageAdapter.savePrototypeState(st);
  }

  function start(mode, filterTab){
    if(StateManager.get().tour.active) return; // nunca dos recorridos a la vez
    opener = document.activeElement;
    const steps = stepsFor(mode, filterTab);
    if(!steps.length) return;
    document.body.classList.add('tour-active');
    StateManager.set({ tour: { active:true, mode:mode, filterTab:filterTab||null, stepIndex:0, playing:false, hasPlayed:false, menuOpen:false } });
  }
  function maybeAutostart(mode){
    if(!hasCompletedOrSkipped(mode)) start(mode, null);
  }

  // v1.4: un único temporizador encadenado por paso (nunca setInterval, que
  // dejaba timers huérfanos y duplicados). runToken invalida cualquier callback
  // pendiente de un ciclo anterior, así "Salir" o "Comenzar nuevamente" nunca
  // dejan avances fantasma.
  function stopAutoplay(){
    runToken++;
    if(autoplayTimer){ clearTimeout(autoplayTimer); autoplayTimer = null; }
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
    stepElapsed = 0;
    updateCountdownUI(0);
  }

  function updateCountdownUI(pct){
    const el = qs('#tourStepProgressFill');
    if(el) el.style.width = Math.max(0, Math.min(100, pct)) + '%';
  }

  // Programa el avance del paso actual. Da retroalimentación visual inmediata
  // (la barra de tiempo empieza a moverse en <100ms), así "Reproducir" nunca
  // parece descompuesto durante los segundos de espera.
  function scheduleNextStep(){
    if(autoplayTimer){ clearTimeout(autoplayTimer); autoplayTimer = null; }
    if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
    const myToken = ++runToken;
    stepElapsed = 0;
    updateCountdownUI(0);
    countdownTimer = setInterval(function(){
      if(myToken !== runToken){ clearInterval(countdownTimer); return; }
      stepElapsed += 100;
      updateCountdownUI((stepElapsed / STEP_DURATION_MS) * 100);
    }, 100);
    autoplayTimer = setTimeout(function(){
      if(myToken !== runToken) return; // callback obsoleto: se ignora
      const t = StateManager.get().tour;
      if(!t.active || !t.playing) return;
      const steps = stepsFor(t.mode, t.filterTab);
      if(t.stepIndex >= steps.length-1){
        // Último paso: detiene autoplay pero NUNCA cierra el recorrido solo.
        stopAutoplay();
        StateManager.set({ tour: Object.assign({}, StateManager.get().tour, { playing:false }) });
        return;
      }
      StateManager.set({ tour: Object.assign({}, StateManager.get().tour, { stepIndex: t.stepIndex+1 }) });
    }, STEP_DURATION_MS);
  }

  // v1.6.1 (sección 3.4): omitir la guía es la acción principal de salida.
  // No pide confirmación, restaura las ayudas contextuales y conserva la
  // pestaña, la posición y los datos.
  function skipGuide(){
    stopAutoplay();
    releaseBottomSpace();
    if(resizeHandler){ window.removeEventListener('resize', resizeHandler); window.removeEventListener('orientationchange', resizeHandler); resizeHandler = null; }
    const t = StateManager.get().tour;
    const wasTraining = t.mode === 'training';
    if(t.mode) markTourState(t.mode, { introSeen:true });
    document.body.classList.remove('tour-active');
    qsa('.tour-spotlight').forEach(function(el){ el.classList.remove('tour-spotlight'); });
    StateManager.set({ tour: { active:false, mode:null, filterTab:null, stepIndex:0, playing:false, hasPlayed:false, menuOpen:false } });
    if(wasTraining) setTimeout(leaveTrainingSpace, 0);
    if(opener && typeof opener.focus === 'function') opener.focus();
    opener = null;
    if(typeof showToast === 'function') showToast('Guía omitida. Puede volver a abrirla desde Ayuda.');
  }

  function toggleMenu(){
    const t = StateManager.get().tour;
    StateManager.set({ tour: Object.assign({}, t, { menuOpen: !t.menuOpen }) });
  }

  function exit(dontShowAgain){
    stopAutoplay();
    releaseBottomSpace();
    if(resizeHandler){ window.removeEventListener('resize', resizeHandler); window.removeEventListener('orientationchange', resizeHandler); resizeHandler = null; }
    document.body.classList.remove('tour-active');
    const t = StateManager.get().tour;
    const wasTraining = t.mode === 'training';
    if(t.mode) markTourState(t.mode, dontShowAgain ? { skipped:true } : {});
    if(wasTraining) setTimeout(leaveTrainingSpace, 0);
    StateManager.set({ tour: { active:false, mode:null, filterTab:null, stepIndex:0, playing:false } });
    if(opener && typeof opener.focus === 'function') opener.focus();
    opener = null;
  }
  function complete(){
    stopAutoplay();
    releaseBottomSpace();
    if(resizeHandler){ window.removeEventListener('resize', resizeHandler); window.removeEventListener('orientationchange', resizeHandler); resizeHandler = null; }
    document.body.classList.remove('tour-active');
    const t = StateManager.get().tour;
    if(t.mode) markTourState(t.mode, { completed:true });
    const wasTraining = t.mode === 'training';
    StateManager.set({ tour: { active:false, mode:null, filterTab:null, stepIndex:0, playing:false } });
    if(wasTraining) leaveTrainingSpace();
    if(opener && typeof opener.focus === 'function') opener.focus();
    opener = null;
  }

  // v1.5 (sección 3.6): al terminar o salir del entrenamiento se regresa al
  // espacio real, para que nadie siga operando sobre la demostración sin darse
  // cuenta y crea estar administrando una familia real.
  function leaveTrainingSpace(){
    StorageNamespaceManager.setNamespace('real');
    StateManager.setAdmin({ tab:'datos', commercial:false });
    if(typeof showToast === 'function'){
      showToast('Entrenamiento finalizado. Volvió al espacio de trabajo real de BVM.');
    }
  }
  function restart(mode, filterTab){
    stopAutoplay();
    // v1.5 (sección 3.4): nunca activar un recorrido sin pasos — antes esto
    // producía un overlay invisible que bloqueaba la interfaz sin mostrar nada.
    const steps = stepsFor(mode, filterTab);
    if(!steps.length){
      InternalLogger.log('tour-no-steps', { mode: mode, filterTab: filterTab });
      StateManager.openModal({
        title:'Esta sección todavía no tiene explicación guiada',
        body:'Puede consultar el Centro de ayuda o ver el recorrido completo desde el encabezado.',
        confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){}
      });
      return;
    }
    StateManager.set({ tour: { active:true, mode:mode, filterTab:filterTab||null, stepIndex:0, playing:false } });
  }

  // v1.4: next/prev cancelan cualquier avance pendiente antes de cambiar de
  // paso. Antes no lo hacían: un clic manual durante autoplay dejaba el timer
  // anterior vivo, provocando dobles avances y controles que "no responden".
  function next(){
    const t = StateManager.get().tour;
    const steps = stepsFor(t.mode, t.filterTab);
    stopAutoplay();
    if(t.stepIndex >= steps.length-1){ complete(); return; }
    StateManager.set({ tour: Object.assign({}, t, { stepIndex:t.stepIndex+1, playing:t.playing }) });
  }
  function prev(){
    const t = StateManager.get().tour;
    if(t.stepIndex <= 0) return;
    stopAutoplay();
    StateManager.set({ tour: Object.assign({}, t, { stepIndex:t.stepIndex-1, playing:t.playing }) });
  }
  function togglePlay(){
    const t = StateManager.get().tour;
    const playing = !t.playing;
    if(!playing) stopAutoplay();
    // v1.6.1 (sección 3.3): hasPlayed distingue "Reproducir" (nunca iniciado)
    // de "Reanudar" (el usuario ya lo pausó). Antes se mostraba "Pausado"
    // desde el inicio, antes de que nadie hubiera reproducido nada.
    if(playing) t.hasPlayed = true;
    // El cambio de estado se renderiza de inmediato (botón pasa a "Pausar" y
    // aparece el estado "Reproduciendo"); scheduleNextStep se llama en bind(),
    // ya con el DOM del nuevo render disponible.
    StateManager.set({ tour: Object.assign({}, t, { playing:playing, hasPlayed: t.hasPlayed || playing }) });
  }

  // v1.4: "Repetir paso" vuelve a enfocar, desplazar, resaltar y anunciar el
  // mismo paso — antes solo re-renderizaba, sin re-ejecutar el enfoque.
  function repeatStep(){
    const t = StateManager.get().tour;
    stopAutoplay();
    StateManager.set({ tour: Object.assign({}, t, { playing:false, repeatNonce: (t.repeatNonce||0)+1 }) });
  }

  // ---- Render ----
  function render(t){
    const steps = stepsFor(t.mode, t.filterTab);
    if(!steps.length){ return ''; }
    const idx = Math.min(t.stepIndex, steps.length-1);
    const step = steps[idx];
    const pct = Math.round(((idx+1)/steps.length)*100);
    const isLast = idx === steps.length-1;
    return (
    '<div class="tour-overlay no-print" role="dialog" aria-modal="true" aria-labelledby="tourTitle" aria-describedby="tourBody" id="tourOverlay">' +
      '<div class="tour-scrim"></div>' +
      // v1.6.1 (sección 3.2): controles simplificados. Encabezado con "Omitir
      // guía", una sola barra de progreso, y Repetir/Reiniciar movidos a un
      // menú secundario. Se eliminaron la segunda barra, el estado permanente
      // "Pausado" y las instrucciones repetidas.
      '<div class="tour-card" id="tourCard">' +
        '<div class="tour-card-head">' +
          '<div class="tour-head-row">' +
            '<span class="tour-step-count">Paso '+(idx+1)+' de '+steps.length+'</span>' +
            '<button class="tour-skip" id="tourSkipBtn" type="button">Omitir guía <span aria-hidden="true">×</span></button>' +
          '</div>' +
          '<div class="tour-progress-track"><div class="tour-progress-fill" id="tourStepProgressFill" style="width:'+pct+'%"></div></div>' +
          '<h3 class="tour-title" id="tourTitle">'+escapeHtml(step.title)+'</h3>' +
        '</div>' +
        '<div class="tour-card-body">' +
          '<p class="tour-body-text" id="tourBody">'+escapeHtml(stepBodyText(step))+'</p>' +
        '</div>' +
        '<div class="tour-card-foot">' +
          '<button class="btn btn-secondary btn-tour btn-tour--nav" id="tourPrevBtn" '+(idx===0?'disabled':'')+'>Anterior</button>' +
          '<button class="btn btn-primary btn-tour btn-tour--nav" id="tourNextBtn">'+(isLast?'Finalizar':'Siguiente')+'</button>' +
          '<button class="tour-icon-btn" id="tourPlayBtn" type="button" aria-label="'+(t.playing?'Pausar reproducción automática':(t.hasPlayed?'Reanudar reproducción automática':'Reproducir automáticamente'))+'">' +
            (t.playing?'Pausar':(t.hasPlayed?'Reanudar':'Reproducir')) +
          '</button>' +
          '<div class="tour-more">' +
            '<button class="tour-icon-btn tour-more-btn" id="tourMoreBtn" type="button" aria-label="Más opciones de la guía" aria-expanded="'+(t.menuOpen?'true':'false')+'">⋯</button>' +
            (t.menuOpen ?
              ('<div class="tour-more-menu" role="menu">' +
                 '<button class="tour-more-item" id="tourRepeatBtn" role="menuitem" type="button">Repetir paso</button>' +
                 '<button class="tour-more-item" id="tourRestartBtn" role="menuitem" type="button">Reiniciar recorrido</button>' +
               '</div>') : '') +
          '</div>' +
        '</div>' +
        '<p class="tour-live sr-only" aria-live="polite">Paso '+(idx+1)+' de '+steps.length+'</p>' +
      '</div>' +
    '</div>'
    );
  }

  function bind(t){
    const steps = stepsFor(t.mode, t.filterTab);
    if(!steps.length) return;
    const idx = Math.min(t.stepIndex, steps.length-1);
    const step = steps[idx];

    // Navega a la pestaña del paso si aplica (solo modo admin/commercial).
    if(step.tab && StateManager.get().admin.tab !== step.tab){
      StateManager.setAdmin({ tab: step.tab });
      return; // el nuevo render disparará bind() de nuevo ya en la pestaña correcta
    }

    qsa('.tour-spotlight').forEach(function(el){ el.classList.remove('tour-spotlight'); });

    // v1.5 (sección 3.3): resolución del objetivo con respaldo. Si el objetivo
    // principal no existe se intenta el fallback; si tampoco existe, el paso
    // sigue siendo utilizable — la tarjeta se centra y el texto se adapta al
    // estado vacío, sin bloquear Siguiente/Anterior/Pausar/Salir.
    let targetEl = step.targetSelector ? qs(step.targetSelector) : null;
    if(!targetEl && step.fallbackSelector) targetEl = qs(step.fallbackSelector);
    const isEmptyState = !!(step.targetSelector && !targetEl);
    if(isEmptyState) InternalLogger.log('tour-step-empty-state', { id: step.id });


    // v1.5 (sección 3.2): secuencia estable. Se esperan dos requestAnimationFrame
    // para que el DOM de la pestaña esté montado y el desplazamiento aplicado
    // ANTES de medir. Medir antes producía coordenadas obsoletas.
    // v1.6.4 (sección 4.2): secuencia robusta. Se ESPERA a que el objetivo
    // exista y tenga caja, se desplaza, se VERIFICA que quedó visible, y solo
    // entonces se muestra el resaltado y se coloca la tarjeta. Antes se
    // asumía que el objetivo estaba listo en el mismo tick, lo que fallaba al
    // cambiar a "reporte-integral" (12 páginas montadas de golpe).
    const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
    placeCard(null); // posición provisional, nunca un instante sin colocar

    raf(function(){ raf(function(){
      waitForTarget(step.targetSelector, function(found){
        let el = found;
        if(!el && step.fallbackSelector) el = qs(step.fallbackSelector);
        if(!el){ placeCard(null); return; }   // §4.3: tarjeta centrada, sin resaltado huérfano
        ensureTargetVisible(el, function(){
          if(!el.isConnected) return;         // §4.5: nunca operar sobre un nodo desconectado
          el.classList.add('tour-spotlight');
          placeCard(el);
          if(window.innerWidth <= 640) reserveBottomSpace(qs('#tourCard'), el);
        });
      });
    }); });

    // §5.4: recalcular solo al cambiar tamaño u orientación, nunca durante el
    // scroll — eso provocaría que la tarjeta se moviera sin motivo.
    if(resizeHandler){ window.removeEventListener('resize', resizeHandler); window.removeEventListener('orientationchange', resizeHandler); }
    resizeHandler = function(){ placeCard(targetEl); };
    window.addEventListener('resize', resizeHandler);
    window.addEventListener('orientationchange', resizeHandler);

    const overlay = qs('#tourOverlay');
    const prevBtn = qs('#tourPrevBtn'); if(prevBtn) prevBtn.addEventListener('click', prev);
    const nextBtn = qs('#tourNextBtn'); if(nextBtn) nextBtn.addEventListener('click', next);
    const playBtn = qs('#tourPlayBtn'); if(playBtn) playBtn.addEventListener('click', togglePlay);
    const skipBtn = qs('#tourSkipBtn'); if(skipBtn) skipBtn.addEventListener('click', skipGuide);
    const moreBtn = qs('#tourMoreBtn'); if(moreBtn) moreBtn.addEventListener('click', toggleMenu);
    const repeatBtn = qs('#tourRepeatBtn'); if(repeatBtn) repeatBtn.addEventListener('click', function(){
      StateManager.set({ tour: Object.assign({}, StateManager.get().tour, { menuOpen:false }) });
      repeatStep();
    });
    const restartBtn = qs('#tourRestartBtn'); if(restartBtn) restartBtn.addEventListener('click', function(){ restart(t.mode, t.filterTab); });
    if(overlay) overlay.addEventListener('keydown', function(e){
      if(e.key==='Escape') skipGuide();
      else if(e.key==='ArrowRight') next();
      else if(e.key==='ArrowLeft') prev();
      else if(e.key===' ' || e.key==='Spacebar'){ e.preventDefault(); togglePlay(); }
      else if(e.key==='Tab'){
        const els = qsa('button, input, select, textarea, a[href]', card).filter(function(el){ return !el.disabled && el.offsetParent !== null; });
        if(!els.length) return;
        const first = els[0], last = els[els.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    });
    const card = qs('#tourCard');
    if(nextBtn) nextBtn.focus(); else if(card){ card.setAttribute('tabindex','-1'); card.focus(); }

    // v1.4: el temporizador se programa AQUÍ, al final de bind() — con el DOM
    // del paso ya montado, la pestaña correcta abierta y el objetivo enfocado.
    // Así el avance automático nunca depende de un return frágil tras cambiar
    // de pestaña, y la barra de tiempo empieza a moverse de inmediato.
    if(t.playing){ scheduleNextStep(); }
  }

  // v1.5 (sección 3.1): posicionamiento con MEDICIÓN REAL. La versión anterior
  // usaba una posición fija abajo; antes de eso, una altura supuesta de 220px
  // cuando la tarjeta real supera 440px, lo que dejaba botones fuera de la
  // pantalla. Ahora se mide la tarjeta con getBoundingClientRect() y se elige
  // la colocación que no cubra el objetivo, garantizando que quede completa
  // dentro del viewport.

  // ============================================================
  // v1.6.2 (secciones 5 y 6) — POSICIÓN FIJA CON PREVENCIÓN DE COLISIONES.
  // La tarjeta vive abajo a la izquierda y NO persigue al objetivo en cada
  // paso. Solo si esa posición cubriera realmente lo que se explica, se
  // prueban las otras tres esquinas en orden. Una vez elegida, la posición
  // no cambia mientras la persona permanezca en ese paso.
  // ============================================================
  const EDGE = 16;
  const COLLISION_MARGIN = 12;

  // §6.1: reserva espacio inferior equivalente a la altura REAL del panel
  // (medida, no estimada) para que el contenido pueda desplazarse por encima.
  // §6.2: si el objetivo aún queda detrás del panel, se desplaza lo necesario.
  // v1.6.4 (sección 5.1): la zona útil va del borde inferior del encabezado
  // hasta la parte superior REAL del panel. No empieza en 0.
  function getMobileSafeArea(sheetRect){
    const header = document.querySelector('.participant-topbar, .admin-topbar');
    const hr = header ? header.getBoundingClientRect() : null;
    const top = Math.max(16, (hr && hr.bottom > 0) ? hr.bottom + 12 : 16);
    const bottom = Math.max(top + 80, sheetRect.top - 16);
    return { top: top, bottom: bottom, height: bottom - top };
  }

  // §5.3/§5.5: desplaza en AMBOS sentidos hasta que el objetivo quede dentro de
  // la zona útil, garantizando que el resaltado no toque el panel.
  function ensureTargetInMobileSafeArea(target, sheet, done, attempts){
    attempts = (attempts === undefined) ? 4 : attempts;
    if(!target || !sheet || attempts <= 0) return done && done(false);
    const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
    const sheetRect = sheet.getBoundingClientRect();
    const safe = getMobileSafeArea(sheetRect);
    const t = target.getBoundingClientRect();
    const fits = t.height <= safe.height;
    if(fits && t.top >= safe.top && t.bottom <= safe.bottom) return done && done(true);
    let delta = 0;
    if(t.top < safe.top) delta = t.top - safe.top;
    else if(t.bottom > safe.bottom) delta = t.bottom - safe.bottom;
    if(delta !== 0){ try{ window.scrollBy({ top: delta, behavior:'auto' }); }catch(e){} }
    raf(function(){ ensureTargetInMobileSafeArea(target, sheet, done, attempts-1); });
  }

  function reserveBottomSpace(card, targetEl){
    const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
    raf(function(){
      const sheet = card.getBoundingClientRect();
      const space = Math.round(sheet.height + 24);
      document.documentElement.style.setProperty('--tour-bottom-space', space + 'px');
      if(!targetEl) return;
      raf(function(){ ensureTargetInMobileSafeArea(targetEl, card); });
    });
  }
  // §6.5: al cerrar se retira el espacio reservado, sin dejar huecos.
  function releaseBottomSpace(){
    document.documentElement.style.removeProperty('--tour-bottom-space');
  }

  function rectsIntersectWithMargin(a, b, margin){
    margin = (margin === undefined) ? COLLISION_MARGIN : margin;
    return !(
      a.right + margin < b.left ||
      a.left - margin > b.right ||
      a.bottom + margin < b.top ||
      a.top - margin > b.bottom
    );
  }

  function placeCard(targetEl){
    const card = qs('#tourCard');
    if(!card) return;

    // Móvil: hoja inferior. v1.6.3 (sección 6) — estar dentro del viewport no
    // basta: el panel cubría parte de la escala y del botón Continuar. Ahora se
    // reserva espacio real debajo del contenido y se sube el objetivo por
    // encima del panel.
    if(window.innerWidth <= 640){
      card.classList.add('tour-card--sheet');
      card.style.left = '12px'; card.style.right = '12px';
      card.style.top = 'auto'; card.style.bottom = '12px';
      card.style.maxHeight = Math.round(window.innerHeight * 0.40) + 'px';
      reserveBottomSpace(card, targetEl);
      return;
    }
    card.classList.remove('tour-card--sheet');
    card.style.right = 'auto';
    card.style.maxHeight = Math.round(window.innerHeight * 0.46) + 'px';

    const c = card.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const cw = c.width, ch = c.height;

    // §5.1: posición predeterminada.
    const corners = [
      { id:'bottom-left',  left: EDGE,           top: vh - ch - EDGE },
      { id:'bottom-right', left: vw - cw - EDGE, top: vh - ch - EDGE },
      { id:'top-right',    left: vw - cw - EDGE, top: EDGE },
      { id:'top-left',     left: EDGE,           top: EDGE }
    ];

    function apply(pos){
      card.style.position = 'fixed';
      card.style.left = Math.max(EDGE, Math.min(pos.left, vw - cw - EDGE)) + 'px';
      card.style.top  = Math.max(EDGE, Math.min(pos.top,  vh - ch - EDGE)) + 'px';
      card.style.bottom = 'auto';
    }

    if(!targetEl){ return apply(corners[0]); }
    const t = targetEl.getBoundingClientRect();

    // §5.6: un objetivo enorme no deja ninguna esquina libre; en ese caso se
    // conserva la posición predeterminada en vez de saltar sin sentido.
    const targetArea = (t.width * t.height) / (vw * vh);
    if(targetArea > 0.70){ return apply(corners[0]); }

    for(let i=0;i<corners.length;i++){
      const cand = corners[i];
      const rect = { left:cand.left, top:cand.top, right:cand.left+cw, bottom:cand.top+ch };
      if(!rectsIntersectWithMargin(rect, t)) return apply(cand);
    }
    // §5.6: si ninguna queda libre, se elige la de menor intersección.
    let best = corners[0], bestOverlap = Infinity;
    corners.forEach(function(cand){
      const rect = { left:cand.left, top:cand.top, right:cand.left+cw, bottom:cand.top+ch };
      const ox = Math.max(0, Math.min(rect.right, t.right) - Math.max(rect.left, t.left));
      const oy = Math.max(0, Math.min(rect.bottom, t.bottom) - Math.max(rect.top, t.top));
      const area = ox*oy;
      if(area < bestOverlap){ bestOverlap = area; best = cand; }
    });
    apply(best);
  }

  // §6.6: el desplazamiento se ejecuta ANTES de medir, sin animación, para que
  // las coordenadas no estén a medio camino.
  function scrollTargetIntoView(el){
    try{ el.scrollIntoView({ behavior:'auto', block:'center', inline:'nearest' }); }
    catch(e){ try{ el.scrollIntoView(); }catch(e2){} }
  }

  // v1.6.4 (sección 4.3): espera acotada a que el objetivo exista Y tenga caja.
  // El paso 6 comercial cambia a "reporte-integral", que monta 12 páginas: el
  // objetivo no está disponible en el mismo tick.
  function waitForTarget(selector, done, attempts){
    attempts = (attempts === undefined) ? 20 : attempts;
    const el = selector ? qs(selector) : null;
    if(el && el.getClientRects().length > 0) return done(el);
    if(attempts <= 0) return done(null);
    setTimeout(function(){ waitForTarget(selector, done, attempts-1); }, 50);
  }

  // v1.6.4 (sección 4.4): verifica visibilidad REAL tras desplazar, y corrige.
  // Antes se desplazaba una sola vez sin comprobar: con el objetivo a ~17.000px
  // la ventana se quedaba en scrollY 0 y el recorrido explicaba la página 12
  // mientras el usuario seguía viendo la portada.
  function ensureTargetVisible(target, done, attempts){
    attempts = (attempts === undefined) ? 3 : attempts;
    if(!target || !target.isConnected) return done(false);
    scrollTargetIntoView(target);
    const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
    raf(function(){ raf(function(){
      const r = target.getBoundingClientRect();
      const visible = r.top >= 24 && r.bottom <= window.innerHeight - 24;
      if(visible || attempts <= 1){
        return done(r.bottom > 0 && r.top < window.innerHeight);
      }
      const desiredTop = Math.max(24, (window.innerHeight - r.height) / 2);
      try{ window.scrollBy({ top: r.top - desiredTop, behavior:'auto' }); }catch(e){}
      raf(function(){ ensureTargetVisible(target, done, attempts-1); });
    }); });
  }


  return { start, restart, exit, skipGuide, toggleMenu, prefersNoAutoStart, resetTourPreference, markTourState, complete, next, prev, togglePlay, repeatStep, render, bind, maybeAutostart, stepsFor, hasCompletedOrSkipped };
})();

ParticipantApp.renderExternalQuestions = function(pstate){
  const qs_ = QUESTIONNAIRE.externalQuestions;
  const allAnswered = qs_.every(function(eq){ return pstate.externalAnswers[eq.id] != null; });
  const blocks = qs_.map(function(eq, i){
    const options = eq.options.map(function(o){

      return '<div class="scale-option scale-option--external'+sel+'" data-extid="'+eq.id+'" data-value="'+o.value+'" tabindex="0" role="radio" aria-checked="'+(pstate.externalAnswers[eq.id]===o.value)+'">' +
        '<span class="scale-num">'+o.value+'</span><span class="scale-txt">'+escapeHtml(o.label)+'</span><span class="scale-check">'+ICONS.check+'</span></div>';

  }).join('');

  '<div class="card">' +

ParticipantApp.bind = function(pstate){
  const stage = pstate.stage;
  const tourState = StateManager.get().tour;
  // v1.4: el microrrecorrido del participante solo tiene sentido en la pantalla
  // de preguntas — sus pasos apuntan a elementos que solo existen ahí. Si la
  // persona avanza a revisión, preguntas externas o final, el recorrido se
  // cierra solo en vez de quedar activo apuntando a elementos inexistentes.
  if(tourState.active && tourState.mode === 'participant'){
    if(stage === 'question'){
      GuidedTourManager.bind(tourState);
    } else {
      // v1.6.3: los pasos del participante viven en la pantalla de preguntas.
      // Si se solicita la guía desde otra pantalla, en vez de cerrarla en
      // silencio —lo que hacía que "Comenzar guía" pareciera no funcionar—
      // se deja pendiente y arranca al llegar a las preguntas.
      ParticipantApp._pendingGuide = true;
      GuidedTourManager.complete();
      return;
    }
  }
  // Arranque diferido al entrar a la pantalla de preguntas.
  if(stage === 'question' && ParticipantApp._pendingGuide && !tourState.active){
    ParticipantApp._pendingGuide = false;
    setTimeout(function(){ GuidedTourManager.start('participant', null); }, 0);
  }

  const exitBtn = qs('[data-action="exit-participant"]');
  if(exitBtn) exitBtn.addEventListener('click', function(){
    const hasProgress = pstate.answers.some(function(r){ return r!=null; }) && stage!=='final' && stage!=='locked';
    if(!hasProgress){ AppModeManager.exitToSelector(); return; }
    if(StorageAdapter.isUsingMemoryFallback()){
      StateManager.openModal({
        title:'El avance no ha podido guardarse',
        body:'Si sale ahora, podría perder sus respuestas.',
        confirmLabel:'Salir de todos modos', cancelLabel:'Permanecer aquí', danger:true,
        onConfirm: function(){ AppModeManager.exitToSelector(); }
      });
    } else {
      StateManager.openModal({
        title:'Su avance ya está guardado',
        body:'Su avance ya está guardado en este navegador. Podrá continuar más adelante escribiendo el mismo nombre, en la misma computadora y el mismo navegador.',
        confirmLabel:'Volver al inicio', cancelLabel:'Continuar respondiendo',
        onConfirm: function(){ AppModeManager.exitToSelector(); }
      });
    }
  });

  if(stage==='cover'){
    qs('[data-action="to-identify"]').addEventListener('click', function(){
      StateManager.setParticipant({ stage:'identify' });
    });
  }

  if(stage==='identify'){
    qs('[data-action="back-to-cover"]').addEventListener('click', function(){
      StateManager.setParticipantSilent({ name: qs('#pname').value.trim() });
      StateManager.setParticipant({ stage:'cover' });
    });
    const pnameInput = qs('#pname');
    if(pnameInput){
      pnameInput.addEventListener('input', function(){ StateManager.setParticipantSilent({ name: pnameInput.value }); });
    }
    const genSelect = qs('#pgen');
    if(genSelect) genSelect.addEventListener('change', function(){ StateManager.setParticipantSilent({ generation: genSelect.value }); });
    const roleSelect = qs('#prole');
    if(roleSelect) roleSelect.addEventListener('change', function(){ StateManager.setParticipantSilent({ participationRole: roleSelect.value }); });

    qs('[data-action="to-instructions"]').addEventListener('click', function(){
      const name = qs('#pname').value.trim();
      if(!name){ showToastGlobal('Escriba su nombre completo para continuar.'); return; }
      const existing = StorageAdapter.findParticipantByName(name);
      if(existing && existing.status === 'finalizado'){
        StateManager.setParticipant({ stage:'locked', participantId: existing.participantId, name: existing.participantName });
        return;
      }
      if(existing){
        StateManager.setParticipant({
          stage:'instructions', participantId: existing.participantId, name: existing.participantName,
          generation: existing.generation||genSelect.value, participationRole: existing.participationRole||roleSelect.value,
          answers: existing.answers, externalAnswers: existing.externalAnswers||{}, currentIndex: existing.currentIndex||0
        });
        showToastGlobal('Se recuperó el avance guardado para este nombre.');
      } else {
        const created = StorageAdapter.createParticipant({
          name:name, generation:genSelect.value, participationRole:roleSelect.value
        });
        if(!created){ showToastGlobal('No hay una familia activa para registrar su participación.'); return; }
        StateManager.setParticipant({ stage:'instructions', participantId: created.participantId, name: created.participantName });
      }
    });
  }

  if(stage==='locked'){
    const supportBtn = qs('[data-action="request-support"]');
    if(supportBtn) supportBtn.addEventListener('click', function(){
      StateManager.openModal({
        title:'Solicitar apoyo a BVM',
        body:'En la versión conectada, esta acción notificará a su consultor BVM para revisar el caso. En este prototipo local no se envía ninguna información.',
        confirmLabel:'Entendido', cancelLabel:'Cerrar', onConfirm:function(){}
      });
    });
  }

  if(stage==='instructions'){
    qs('[data-action="back-to-identify"]').addEventListener('click', function(){ StateManager.setParticipant({ stage:'identify' }); });
    qs('[data-action="to-first-question"]').addEventListener('click', function(){
      StateManager.setParticipant({ stage:'question' });
      // v1.6.1 (sección 3.4): también voluntaria para el participante.
      if(!GuidedTourManager.hasCompletedOrSkipped('participant')) OnboardingManager.runSequence(['participant']);
    });
  }

  if(stage==='question'){
    const idx = pstate.currentIndex;
    const reopenGuideBtn = qs('[data-action="reopen-participant-guide"]');
    // v1.6.1 (sección 12): abre una explicación contextual breve, no el
    // recorrido completo. El texto evita afirmar que una práctica frecuente
    // es automáticamente Estable.
    if(reopenGuideBtn) reopenGuideBtn.addEventListener('click', function(){
      StateManager.openModal({
        title:'¿Cómo debo responder?',
        body:'Responda pensando en lo que ocurre habitualmente, no en lo que debería ocurrir ni en un caso excepcional. Ejemplo: si una práctica ocurre algunas veces y depende de una sola persona, probablemente es Incipiente, no Estable.',
        confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){}
      });
    });
    // v1.6.3 (sección 8) — FOCO Y NAVEGACIÓN DE LA ESCALA.
    // Antes, al seleccionar con Espacio la pantalla se volvía a renderizar y el
    // foco se perdía al body: había que empezar de nuevo con Tab. Ahora el
    // foco se restaura sobre la misma opción tras el render.
    const scaleOpts = qsa('.scale-option');
    // §8.1: solo la opción seleccionada es tabulable; el resto se recorre con flechas.
    const currentVal = pstate.answers[idx];
    scaleOpts.forEach(function(opt){
      const v = parseInt(opt.getAttribute('data-value'),10);
      opt.setAttribute('tabindex', (currentVal==null ? (v===1?'0':'-1') : (v===currentVal?'0':'-1')));
    });
    function selectAndKeepFocus(value){
      ParticipantApp._focusScaleValue = value;   // se restaura tras el render
      selectAnswer(pstate, idx, value);
    }
    function moveFocus(delta){
      const active = document.activeElement;
      const cur = active && active.getAttribute ? parseInt(active.getAttribute('data-value'),10) : (currentVal||1);
      const next = Math.max(1, Math.min(scaleOpts.length, (isNaN(cur)?1:cur) + delta));
      const el = scaleOpts.filter(function(o){ return parseInt(o.getAttribute('data-value'),10)===next; })[0];
      if(el){ scaleOpts.forEach(function(o){ o.setAttribute('tabindex','-1'); }); el.setAttribute('tabindex','0'); el.focus({preventScroll:true}); }
    }
    scaleOpts.forEach(function(opt){
      opt.addEventListener('click', function(){ selectAndKeepFocus(parseInt(opt.getAttribute('data-value'),10)); });
      opt.addEventListener('keydown', function(e){
        if(e.key==='Enter' || e.key===' '){ e.preventDefault(); selectAndKeepFocus(parseInt(opt.getAttribute('data-value'),10)); }
        // §8.4: navegación con flechas dentro del grupo de radios.
        else if(e.key==='ArrowDown' || e.key==='ArrowRight'){ e.preventDefault(); moveFocus(1); }
        else if(e.key==='ArrowUp' || e.key==='ArrowLeft'){ e.preventDefault(); moveFocus(-1); }
        else if(e.key==='Home'){ e.preventDefault(); moveFocus(-99); }
        else if(e.key==='End'){ e.preventDefault(); moveFocus(99); }
      });
    });
    // §8.3: restauración del foco después del render.
    if(ParticipantApp._focusScaleValue != null){
      const want = ParticipantApp._focusScaleValue;
      ParticipantApp._focusScaleValue = null;
      const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
      raf(function(){
        const el = qs('.scale-option[data-value="'+want+'"]');
        if(el) el.focus({ preventScroll:true });
      });
    }
    qs('[data-action="prev-question"]').addEventListener('click', function(){
      if(idx===0){ StateManager.setParticipant({ stage:'instructions' }); }
      else { StateManager.setParticipant({ currentIndex: idx-1 }); }
    });
    const nextBtn = qs('[data-action="next-question"]');
    nextBtn.addEventListener('click', function(){
      if(pstate.answers[idx]==null) return;
      if(idx===19){ StateManager.setParticipant({ stage:'review' }); }
      else { StateManager.setParticipant({ currentIndex: idx+1 }); }
    });
    ParticipantApp._keyHandler = function(e){
      if(['1','2','3','4','5'].indexOf(e.key)>=0){ selectAnswer(pstate, idx, parseInt(e.key,10)); }
      else if(e.key==='Enter' && pstate.answers[idx]!=null){ nextBtn.click(); }
    };
    document.addEventListener('keydown', ParticipantApp._keyHandler);
  } else if(ParticipantApp._keyHandler){
    document.removeEventListener('keydown', ParticipantApp._keyHandler);
    ParticipantApp._keyHandler = null;
  }

  if(stage==='review'){
    qs('[data-action="back-to-last-question"]').addEventListener('click', function(){ StateManager.setParticipant({ stage:'question', currentIndex:19 }); });
    const toExt = qs('[data-action="to-external"]');
    if(toExt) toExt.addEventListener('click', function(){ StateManager.setParticipant({ stage:'external' }); });
  }

  if(stage==='external'){
    qs('[data-action="back-to-review"]').addEventListener('click', function(){ StateManager.setParticipant({ stage:'review' }); });
    qsa('.scale-option--external').forEach(function(opt){
      opt.addEventListener('click', function(){
        const extId = opt.getAttribute('data-extid');
        const val = parseInt(opt.getAttribute('data-value'),10);
        const newExternal = Object.assign({}, pstate.externalAnswers);
        newExternal[extId] = val;
        StorageAdapter.saveParticipantAnswers(pstate.participantId, { externalAnswers: newExternal, currentIndex: pstate.currentIndex });
        StateManager.setParticipant({ externalAnswers: newExternal });
      });
    });
    const fin = qs('[data-action="finalize"]');
    if(fin) fin.addEventListener('click', function(){
      const t = COPY_CONFIG.safeActions.finalize;
      StateManager.openModal({
        title:t.title, body:t.body, confirmLabel:t.confirm, cancelLabel:t.cancel,
        onConfirm: function(){
          StorageAdapter.completeParticipant(pstate.participantId, {
            answers: pstate.answers, externalAnswers: pstate.externalAnswers, currentIndex:20
          });
          StateManager.setParticipant({ stage:'final' });
        }
      });
    });
  }

  function selectAnswer(pst, index, value){
    const newAnswers = pst.answers.slice();
    newAnswers[index] = value;
    const saveOk = StorageAdapter.saveParticipantAnswers(pst.participantId, {
      answers: newAnswers, currentIndex: index
    });
    StateManager.setParticipant({ answers: newAnswers });
    setTimeout(function(){
      const ind = qs('#saveIndicator');
      if(!ind) return;
      if(saveOk){
        ind.querySelector('span:last-child').textContent = 'Avance guardado';
        ind.classList.remove('save-indicator--error');
        ind.classList.add('show');
        setTimeout(function(){ ind && ind.classList.remove('show'); }, 1400);
      } else {
        ind.querySelector('span:last-child').textContent = 'No fue posible guardar el avance en este navegador. No cierre esta ventana y comuníquese con la persona de BVM que le envió el diagnóstico.';
        ind.classList.add('show', 'save-indicator--error');
      }
    }, 30);
  }
};

function showToastGlobal(msg){
  const t = qs('#globalToast');
  if(t){ t.querySelector('.toast-msg').textContent = msg; t.classList.add('show'); setTimeout(function(){ t.classList.remove('show'); }, 2600); }
  else { alert(msg); }
}

const AdminDashboard = {
  _computed: null,

  computeAll: function(astate){
    const cfg = StorageAdapter.loadFamilyConfiguration() || {};
    const participants = StorageAdapter.loadFamilyResults();
    const finishedParticipants = participants.filter(function(p){ return ValidationEngine.isParticipantComplete(p.answers); });
    const hasData = finishedParticipants.length > 0;
    let scoring = null, alignment = null, itemStats = null, narrative = null, matrix = null, conversations = null, route = null;
    if(hasData){
      scoring = ScoringEngine.buildFullScoring(finishedParticipants);
      alignment = AlignmentEngine.buildFullAlignment(finishedParticipants);
      itemStats = ItemStatsEngine.buildDimensionItemStats(scoring.questionAverages, alignment.questionDispersion);
      narrative = NarrativeEngine.buildExecutiveNarrative(cfg.familyName || 'La familia', scoring.dimensionScores, scoring.normalizedDimensionScores, scoring.generalIndex, alignment, itemStats, scoring.externalQuestionAverages);
      matrix = RiskOpportunityEngine.computePosition(scoring.normalizedDimensionScores, scoring.generalIndex, alignment);
      conversations = ConversationPriorityEngine.pickPriorityConversations(scoring.normalizedDimensionScores, alignment, itemStats);
      route = EvolutionEngine.buildRoute(scoring.normalizedDimensionScores, scoring.generalIndex, alignment, matrix);
    }
    this._computed = {
      cfg: cfg, participants: participants, finishedParticipants: finishedParticipants, hasData: hasData,
      scoring: scoring, alignment: alignment, itemStats: itemStats, narrative: narrative, matrix: matrix, conversations: conversations, route: route,
      commercial: !!(astate && astate.commercial)
    };
    return this._computed;
  },

  render: function(astate){
    const c = this.computeAll(astate);
    const allTabs = [
      { id:'sintesis', label:'Síntesis' },
      { id:'dimensiones', label:'Dimensiones' },
      { id:'alineacion', label:'Alineación' },
      { id:'riesgo', label:'Riesgo y oportunidad' },
      { id:'conversaciones', label:'Conversaciones' },
      { id:'evolucion', label:'Evolución' },
      { id:'metodologia', label:'Metodología' },
      { id:'datos', label:'Administración BVM' }
    ];
    const tabs = astate.commercial ? allTabs.filter(function(t){ return t.id!=='datos' && t.id!=='metodologia'; }) : allTabs;

    // Defensa adicional: ningún estado residual puede dejar visible una pestaña
    // interna mientras el modo activo es comercial.
    const forbiddenInCommercial = ['datos','metodologia','guia-presentador'];
    if(astate.commercial && forbiddenInCommercial.indexOf(astate.tab) !== -1){
      astate = Object.assign({}, astate, { tab:'sintesis' });
    }

    // Vista de reporte integral: documento completo, sin navegación ni controles,
    // pensado para imprimirse/guardarse como PDF independientemente de la pestaña activa.
    if(astate.tab === 'reporte-integral'){
      return this.renderReportShell(c);
    }
    if(astate.tab === 'guia-presentador' && !astate.commercial){
      return this.renderPresenterGuide(c);
    }

    const navHtml = tabs.map(function(t){
      return '<button class="admin-nav-btn'+(astate.tab===t.id?' active':'')+'" data-tab="'+t.id+'">'+t.label+'</button>';
    }).join('');
    const mobileNavOptions = tabs.map(function(t){
      return '<option value="'+t.id+'"'+(astate.tab===t.id?' selected':'')+'>'+t.label+'</option>';
    }).join('');

    const introMap = {
      sintesis:'Presenta la lectura general y los hallazgos que conviene revisar primero.',
      dimensiones:'Muestra las capacidades más consolidadas y aquellas con mayor espacio de desarrollo.',
      alineacion:'Permite observar en qué temas las percepciones familiares son similares y dónde existen diferencias que conviene conversar.',
      riesgo:'Integra distintas señales para orientar el foco de atención. No representa una predicción.',
      conversaciones:'Propone temas que pueden ayudar a la familia a comprenderse mejor y avanzar hacia acuerdos más claros.',
      evolucion:'Organiza los siguientes pasos en tres fases e indica en cuál conviene comenzar.',
      metodologia:'Explica de manera resumida cómo se construye la lectura y cuáles son sus límites.',
      datos:'Permite preparar demostraciones, crear respaldos, recuperar información y generar el reporte.'
    };

    const introHtml = introText ? '<p class="tab-intro no-print">'+escapeHtml(introText)+'</p>' : '';

    let body = '';

      body = this.renderEmptyState();
    } else {
      if(astate.tab==='sintesis') body = this.renderSintesis(c);
      else if(astate.tab==='dimensiones') body = this.renderDimensiones(c);
      else if(astate.tab==='alineacion') body = this.renderAlineacion(c);
      else if(astate.tab==='riesgo') body = this.renderRiesgo(c);
      else if(astate.tab==='conversaciones') body = this.renderConversaciones(c);
      else if(astate.tab==='evolucion') body = this.renderEvolucion(c);
      else if(astate.tab==='metodologia') body = this.renderMetodologia(c);
      else if(astate.tab==='datos' && !astate.commercial) body = this.renderDatos(c);

// v1.6: antes esta función devolvía 6 cuando no había dato, de modo que el
// encabezado mostraba "0 de 6 participantes" junto a "Sin familia cargada":
// afirmaba una expectativa que nadie había configurado. Ahora, si no hay un
// número esperado, no se inventa un denominador.
function participacionesLabel(finalizadas, esperadas){
  // v1.6: si ya finalizaron más participaciones de las esperadas, el número
  // esperado quedó desactualizado y mostrar "5 de 2 participantes" se lee como
  // un error de la herramienta. En ese caso el dato cierto es el finalizado.
  if(esperadas > 0 && finalizadas > esperadas){
    return finalizadas + ' participaciones finalizadas';
  }
  if(esperadas > 0) return finalizadas + ' de ' + esperadas + ' participantes';
  if(finalizadas > 0) return finalizadas + (finalizadas === 1 ? ' participación finalizada' : ' participaciones finalizadas');
  return 'Sin participaciones registradas';
}


AdminDashboard.renderSintesis = function(c){
  const s = c.scoring, a = c.alignment;
  const generalLevel = getMaturityLevel(s.generalIndex);
  const strongDim = Object.keys(s.dimensionScores).reduce(function(best,d){ return s.dimensionScores[d] > s.dimensionScores[best] ? d : best; });
  const weakDim = Object.keys(s.dimensionScores).reduce(function(worst,d){ return s.dimensionScores[d] < s.dimensionScores[worst] ? d : worst; });
  const dimLabel = {}; QUESTIONNAIRE.dimensions.forEach(function(d){ dimLabel[d.id]=d.name; });

  // Vista ejecutiva de participación (v0.3): agregada únicamente. La combinación de
  // código + generación + forma de participación podría identificar indirectamente
  // a una persona en una familia pequeña, así que esa vista detallada solo vive en
  // "Datos del prototipo" (uso interno BVM), nunca aquí.
  const expected = c.cfg.expectedParticipants || c.participants.length || c.finishedParticipants.length;
  const finished = c.finishedParticipants.length;
  const pct = expected>0 ? Math.round((finished/expected)*100) : 0;
  let participationBlock = (
    '<div class="participation-summary">' +
      '<div class="participation-stat"><div class="ind-value" style="font-size:26px;">'+finished+' de '+expected+'</div><div class="ind-label">participaciones finalizadas</div></div>' +
      '<div class="participation-stat"><div class="ind-value" style="font-size:26px;">'+pct+'%</div><div class="ind-label">participación completa</div></div>' +
      '<div class="participation-stat"><div class="ind-value" style="font-size:17px;">'+(pct>=100?'Completa':'En curso')+'</div><div class="ind-label">estado general</div></div>' +
    '</div>'
  );
  if(PRIVACY_CONFIG.showParticipantCodesInExecutiveView){
    participationBlock += '<div class="participant-status-list" style="margin-top:14px;">' + c.participants.map(function(p){
      const st = p.status==='finalizado' ? 'done' : (p.answers.some(function(r){return r!=null;}) ? 'progress' : 'pending');
      const stLabel = st==='done' ? 'Finalizado' : (st==='progress' ? 'En proceso' : 'Pendiente');
      const meta = PRIVACY_CONFIG.showParticipantMetadataInExecutiveView ? (' · '+escapeHtml([p.generation,p.participationType].filter(Boolean).join(' · '))) : '';
      return '<div class="participant-status-row"><span>'+escapeHtml(p.participantName)+meta+'</span><span class="status-tag '+st+'">'+stLabel+'</span></div>';
    }).join('') + '</div>';
  }

  const indicators = [
    { label:'Índice general de madurez', value:s.generalIndex.toFixed(0)+' / 100', sub:generalLevel.label },
    { label:'Dimensión más consolidada', value:dimLabel[strongDim], sub:s.normalizedDimensionScores[strongDim].toFixed(0)+'/100' },
    { label:'Principal dimensión por desarrollar', value:dimLabel[weakDim], sub:s.normalizedDimensionScores[weakDim].toFixed(0)+'/100' },
    { label:'Nivel general de alineación', value:getDispersionLevel(a.generalDispersion).label, sub:'Coincidencia entre integrantes', tooltip:'Desviación estándar promedio: '+a.generalDispersion.toFixed(2) }
  ];

  const glance = c.narrative.atAGlance;
  const glanceBlock = (
    '<div class="at-a-glance card" data-tour-target="executive-summary">' +
      '<span class="eyebrow" data-tour-target="commercial-overview-title">En una mirada</span>' +
      '<div class="glance-grid">' +
        '<div data-tour-target="main-strength"><div class="dim-mini-label">Fortaleza principal</div><div class="dim-mini-text">'+escapeHtml(glance.strength)+'</div></div>' +
        '<div data-tour-target="main-gap"><div class="dim-mini-label">Capacidad por desarrollar</div><div class="dim-mini-text">'+escapeHtml(glance.development)+'</div></div>' +
        '<div><div class="dim-mini-label">Oportunidad principal</div><div class="dim-mini-text">'+glance.opportunity+'</div></div>' +
        '<div><div class="dim-mini-label">Conversación prioritaria</div><div class="dim-mini-text">'+escapeHtml(glance.conversation)+'</div></div>' +
      '</div>' +
      '<button type="button" class="btn btn-secondary btn-compact no-print" id="toggleFullNarrative" aria-expanded="true" aria-controls="fullNarrativeBlock">Leer interpretación completa</button>' +
    '</div>'

  return (

// Contenido reutilizable de la matriz de riesgo y oportunidad (sin título ni contenedor).
AdminDashboard.renderRiesgoBody = function(c){
  const m = c.matrix;
  const size = 380, pad = 46;
  const plotSize = size - pad*2;
  const mid = pad + plotSize/2;
  // Traduce (x,y) del modelo (0..1, y=riesgo de abajo hacia arriba) a coordenadas SVG
  // (donde y crece hacia abajo). ÚNICA fuente de verdad: RiskOpportunityEngine.computePosition().
  const px = pad + m.x * plotSize;
  const py = pad + (1 - m.y) * plotSize;

  function quadrantLabelPos(q){
    const cx = q.xRange[0]===0 ? (pad + plotSize*0.25) : (pad + plotSize*0.75);
    const cyTopHalf = q.yRange[0] >= 0.5; // true → mitad de más riesgo → arriba en el SVG
    const cy = cyTopHalf ? (pad + 20) : (size - pad - 10);
    return { x: cx, y: cy };
  }
  const quadLabels = Object.keys(RISK_OPPORTUNITY_QUADRANTS).map(function(id){
    const q = RISK_OPPORTUNITY_QUADRANTS[id];
    const pos = quadrantLabelPos(q);
    return '<text x="'+pos.x+'" y="'+pos.y+'" text-anchor="middle" font-size="11" font-family="Poppins,sans-serif" fill="var(--bvm-navy)" font-weight="700">'+q.title+'</text>';
  }).join('');

  const svg = '<svg viewBox="0 0 '+size+' '+size+'" width="100%" style="display:block;" role="img" aria-label="Matriz de riesgo estructural y potencial de oportunidad">' +
    // §9.2: cada cuadrante toma el color del TIPO DE RESPUESTA ESTRATÉGICA que
    // representa, no una progresión de favorabilidad. Esto la distingue de la
    // matriz de capacidad/alineación, que responde otra pregunta.
    //   Consolidar navy/gris azulado · Desarrollar verde petróleo
    //   Proteger y ordenar naranja   · Actuar con prioridad rojo
    '<rect x="'+pad+'" y="'+mid+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#E7ECF2"/>' +
    '<rect x="'+mid+'" y="'+mid+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#E2EDE7"/>' +
    '<rect x="'+pad+'" y="'+pad+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#F7E6D6"/>' +
    '<rect x="'+mid+'" y="'+pad+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#F6DEDB"/>' +
    '<line x1="'+pad+'" y1="'+mid+'" x2="'+(size-pad)+'" y2="'+mid+'" stroke="#C7D0DB" stroke-width="1.5"/>' +
    '<line x1="'+mid+'" y1="'+pad+'" x2="'+mid+'" y2="'+(size-pad)+'" stroke="#C7D0DB" stroke-width="1.5"/>' +
    '<rect x="'+pad+'" y="'+pad+'" width="'+plotSize+'" height="'+plotSize+'" fill="none" stroke="var(--bvm-navy)" stroke-width="1.4"/>' +
    quadLabels +
    '<text x="'+mid+'" y="'+(size-14)+'" text-anchor="middle" font-size="11" font-family="Poppins,sans-serif" fill="var(--bvm-soft-gray)">Oportunidad de desarrollo patrimonial →</text>' +
    '<text x="16" y="'+mid+'" text-anchor="middle" font-size="11" font-family="Poppins,sans-serif" fill="var(--bvm-soft-gray)" transform="rotate(-90 16 '+mid+')">Riesgo estructural →</text>' +
    '<circle cx="'+px+'" cy="'+py+'" r="9" fill="var(--bvm-navy)" stroke="var(--bvm-gold)" stroke-width="2.5"/>' +
    // v1.6.11 (robustez con nombres variables): un nombre de familia largo
    // centrado en el punto podía salir del viewBox y quedar recortado. La
    // etiqueta reduce su tamaño según la longitud y su centro se acota para
    // que el texto completo permanezca dentro de la matriz.
    (function(){
      const famLabel = c.cfg.familyName || 'Familia';
      const famFs = famLabel.length > 34 ? 8.5 : (famLabel.length > 24 ? 10 : 11.5);
      const approxHalf = famLabel.length * famFs * 0.31;
      const lx = Math.min(Math.max(px, pad + approxHalf + 2), size - pad - approxHalf - 2);
      return '<text x="'+lx+'" y="'+(py-16)+'" text-anchor="middle" font-size="'+famFs+'" font-weight="700" font-family="Poppins,sans-serif" fill="var(--bvm-navy)">'+escapeHtml(famLabel)+'</text>';
    })() +
  '</svg>';

  const legendItems = Object.keys(RISK_OPPORTUNITY_QUADRANTS).map(function(id){
    const qd = RISK_OPPORTUNITY_QUADRANTS[id];
    // v1.6.1 (sección 7.5): solo el nombre del cuadrante. Las descripciones
    // largas de los cuatro se eliminaron; la explicación aplicable ya está en
    // el bloque de posición y foco recomendado.
    return '<div class="quadrant-legend-item'+(qd.id===m.quadrant.id?' active':'')+'"><span class="quadrant-dot"></span><span><strong>'+qd.title+'</strong></span></div>';
  }).join('');

  return (
    '<p class="matrix-question">¿Qué tipo de respuesta estratégica requiere la situación?</p>' +
    '<p class="matrix-scope-note">Este eje refleja principalmente la oportunidad de fortalecer capacidades vinculadas al desarrollo y organización patrimonial. No representa por sí solo la totalidad de las oportunidades familiares.</p>' +
    '<p class="body-text" style="margin-bottom:4px;">Eje horizontal: oportunidad de desarrollo patrimonial. Eje vertical: riesgo estructural. Cada cuadrante corresponde a un tipo de respuesta distinto.</p>' +

    '<div class="quadrant-wrap risk-opportunity-wrap">' +
      '<div class="quadrant-svg-holder">'+svg+'</div>' +
      '<div class="quadrant-legend">'+legendItems+'</div>' +
    '</div>' +
    // v1.6.1 (sección 7.2): dos niveles de lectura explícitos. Antes el punto
    // quedaba en un cuadrante y el texto declaraba otro, sin explicar el cambio.
    '<div class="bvm-emphasis bvm-emphasis--top" style="margin-top:16px;">' +
      (m.reframed ?
        ('<div class="matrix-readings">' +
           '<div class="matrix-reading">' +
             '<span class="matrix-reading-label">Posición matemática</span>' +
             '<span class="matrix-reading-value">'+m.mathQuadrant.title+'</span>' +
           '</div>' +
           '<div class="matrix-reading matrix-reading--applied">' +
             '<span class="matrix-reading-label">Reencuadre por brecha severa</span>' +
             '<span class="matrix-reading-value">'+m.quadrant.title+'</span>' +
           '</div>' +
         '</div>' +
         '<p class="matrix-reframe-note">'+m.explanation+'</p>')
        :
        ('<span class="eyebrow">Posición obtenida</span>' +
         '<h3 style="margin-top:4px;">'+m.quadrant.title+'</h3>' +
         '<p style="margin-top:8px;">'+m.explanation+'</p>')) +
      '<div class="dim-mini-label" style="margin-top:12px;">Foco recomendado</div>' +
      '<p style="margin-top:2px;">'+capitalizeFirst(m.quadrant.recommendedFocus)+'.</p>' +
    '</div>' +
    AdminDashboard.renderFindingsChain(c) +
    '<div class="card card--technical" style="margin-top:14px;font-size:12.5px;">Esta ubicación es orientativa y no constituye una predicción científica ni un diagnóstico definitivo. Sirve como punto de partida para conversar.</div>'
  );
};
function capitalizeFirst(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

// v1.1: cadena visual Hallazgo → Implicación → Riesgo → Foco, generada a
// partir de la dimensión con mayor brecha, la diferencia perceptual más
// relevante y el cuadrante obtenido — nunca frases genéricas fijas.
AdminDashboard.renderFindingsChain = function(c){
  const m = c.matrix;
  const weakDim = Object.keys(c.scoring.normalizedDimensionScores).reduce(function(w,d){ return c.scoring.normalizedDimensionScores[d]<c.scoring.normalizedDimensionScores[w]?d:w; });
  const dimLabel = {}; QUESTIONNAIRE.dimensions.forEach(function(d){ dimLabel[d.id]=d.name; });
  const bottomItem = c.itemStats[weakDim].bottomItem;
  const interp = ITEM_INTERPRETATIONS[bottomItem.id];
  const dispersedInterp = ITEM_INTERPRETATIONS[c.alignment.topDispersion[0].q];

  const steps = [
    { label:'Hallazgo principal', text: dimLabel[weakDim] + ' concentra la mayor brecha de esta lectura (' + c.scoring.normalizedDimensionScores[weakDim].toFixed(0) + ' de 100), en particular sobre "' + interp.developmentTitle.toLowerCase() + '".' },
    { label:'Implicación', text: capitalizeFirst(interp.riskNarrative) + ', lo que puede sostenerse mientras la operación es simple, pero exige más claridad conforme crece.' },
    { label:'Riesgo de no atenderlo', text: 'Sin abordarlo, ' + dispersedInterp.riskNarrative + ', y las decisiones seguirán dependiendo de acuerdos informales que no todos interpretan igual.' },
    { label:'Foco recomendado', text: capitalizeFirst(m.quadrant.recommendedFocus) + '.' }
  ];
  const chain = steps.map(function(s, i){
    return '<div class="findings-step">' +
      '<span class="findings-step-label">'+escapeHtml(s.label)+'</span>' +
      '<p class="findings-step-text">'+escapeHtml(s.text)+'</p>' +
    '</div>' + (i<steps.length-1 ? '<div class="findings-arrow" aria-hidden="true">↓</div>' : '');
  }).join('');
  return '<div class="findings-chain" role="img" aria-label="Cadena de hallazgo, implicación, riesgo y foco recomendado, derivada de los resultados de la familia">' + chain + '</div>';
};

// Contenido reutilizable de Conversaciones prioritarias (sin título ni contenedor).
AdminDashboard.renderConversacionesBody = function(c){
  const main = c.conversations.main;
  const extra = c.conversations.extra;
  const kicker = ['Conversación prioritaria','Segunda conversación relevante','Conversación de continuidad','Conversación adicional'];

  // v1.1: ranking visual de las tres principales conversaciones, normalizado
  // 0-100 como prioridad RELATIVA (no una calificación de madurez).
  const top3 = main.slice(0,3);
  const maxScore = Math.max.apply(null, top3.map(function(cv){ return cv.priorityScore; })) || 1;
  // v1.4: paleta ejecutiva. Las INSIGNIAS usan tonos ligeramente más profundos
  // para que las tres alcancen WCAG AA (≥4.5) con texto blanco uniforme
  // (inmediata 4.78 · alta 4.61 · relevante 5.07). Las BARRAS conservan los
  // tonos de la especificación, porque no llevan texto encima.
  const urgency = [
    { label:'Prioridad inmediata', badgeBg:'#C7473C', badgeText:'#FFFFFF', barColor:'#C7473C' },
    { label:'Prioridad alta',      badgeBg:'#B25F22', badgeText:'#FFFFFF', barColor:'#D87524' },
    { label:'Prioridad relevante', badgeBg:'#846C1F', badgeText:'#FFFFFF', barColor:'#C6A128' }
  ];
  const rankingRows = top3.map(function(conv, i){
    const rel = Math.round((conv.priorityScore/maxScore)*100);
    const u = urgency[i];
    return '<div class="priority-rank-row">' +
      '<span class="priority-rank-num">0'+(i+1)+'</span>' +
      '<div class="priority-rank-body">' +
        '<div class="priority-rank-title">'+escapeHtml(conv.title)+' <span class="priority-rank-dim">· '+escapeHtml(QUESTIONNAIRE.dimensions.filter(function(d){return d.id===conv.dimension;})[0] ? QUESTIONNAIRE.dimensions.filter(function(d){return d.id===conv.dimension;})[0].name : 'Alineación')+'</span></div>' +
        '<div class="priority-rank-track"><div class="priority-rank-fill" style="width:'+Math.max(8,rel)+'%;background:'+u.barColor+';"></div></div>' +
      '</div>' +
      '<span class="priority-rank-qual" style="background:'+u.badgeBg+';color:'+u.badgeText+';">'+u.label+'</span>' +
    '</div>';
  }).join('');
  const rankingBlock = '<div class="priority-ranking" role="img" aria-label="Prioridad relativa de conversación: ranking de las tres conversaciones principales">' +
    '<span class="dim-layer-eyebrow">Prioridad relativa de conversación</span>' +
    '<div style="margin-top:10px;">'+rankingRows+'</div>' +
  '</div>';

  // v1.5 (sección 10, página 10): la conversación 1 se desarrolla ampliamente
  // y las siguientes se compactan. Antes las tres tenían el mismo peso visual,
  // de modo que la lectura no sabía por cuál empezar. Además el riesgo ahora
  // es específico por tema (se toma de la dimensión de la conversación), no
  // una frase genérica repetida en las tres tarjetas.
  const cards = main.map(function(conv, i){
    const isPrimary = i === 0;
    const dimForRisk = conv.dimension && conv.dimension !== 'alineacion' ? conv.dimension : null;
    const specificRisk = dimForRisk
      ? capitalizeFirst(NarrativeEngine.consequenceFor(dimForRisk, c.scoring.normalizedDimensionScores[dimForRisk])) + '.'
      : conv.whyItMatters;

    if(isPrimary){
      return (
      '<div class="conv-card conv-card--primary report-page-inner-break" data-tour-target="priority-conversation">' +
        '<div class="conv-card-head" data-tour-target="commercial-priority-title">' +
          '<span class="conv-number">01</span>' +
          '<div><span class="conv-num">'+kicker[0]+'</span><h4>'+escapeHtml(conv.title)+'</h4></div>' +
        '</div>' +
        '<div class="conv-flow">' +
          '<div class="conv-flow-step"><span class="conv-flow-label">Hallazgo</span><p>'+conv.finding+'</p></div>' +
          '<div class="conv-flow-arrow" aria-hidden="true">→</div>' +
          '<div class="conv-flow-step"><span class="conv-flow-label">Riesgo de no atenderlo</span><p>'+escapeHtml(specificRisk)+'</p></div>' +
          '<div class="conv-flow-arrow" aria-hidden="true">→</div>' +
          '<div class="conv-flow-step"><span class="conv-flow-label">Capacidad a desarrollar</span><p>'+escapeHtml(conv.developmentCapability||conv.title)+'</p></div>' +
        '</div>' +
        '<div class="conv-question-strip"><div class="conv-field-label">Pregunta sugerida</div><div class="conv-question-text">'+escapeHtml(conv.suggestedQuestion)+'</div></div>' +
        '<div class="conv-field"><div class="conv-field-label">Resultado deseable</div><div class="conv-field-text">'+conv.desiredOutcome+'</div></div>' +
        (conv.accompanimentType ? '<div class="conv-field"><div class="conv-field-label">Tipo de acompañamiento que podría facilitarlo</div><div class="conv-field-text">'+escapeHtml(conv.accompanimentType)+'</div></div>' : '') +
      '</div>'
      );
    }
    // Conversaciones 2 y 3: compactas — hallazgo, riesgo y pregunta.
    return (
    '<div class="conv-card conv-card--compact report-page-inner-break">' +
      '<div class="conv-card-head conv-card-head--compact">' +
        '<span class="conv-number conv-number--compact">0'+(i+1)+'</span>' +
        '<div><span class="conv-num">'+(kicker[i]||kicker[3])+'</span><h4>'+escapeHtml(conv.title)+'</h4></div>' +
      '</div>' +
      '<p class="conv-compact-finding">'+conv.finding+'</p>' +
      '<p class="conv-compact-risk"><strong>Riesgo:</strong> '+escapeHtml(specificRisk)+'</p>' +
      '<div class="conv-question-strip conv-question-strip--compact"><div class="conv-question-text">'+escapeHtml(conv.suggestedQuestion)+'</div></div>' +
    '</div>'
    );
  }).join('');
  const extraBlock = extra.length ? (
    '<div class="card" style="margin-top:8px;"><h4 class="h3" style="margin-bottom:8px;">Otras conversaciones que podrían explorarse</h4>' +
      '<p class="body-text" style="font-size:13px;">' + extra.map(escapeHtml).join(' · ') + '</p>' +
    '</div>'
  ) : '';
  return rankingBlock + cards + extraBlock;
};

// Ruta de evolución (v1.1): diagrama de tres fases, con la fase sugerida
// para iniciar destacada. Horizontal en escritorio, vertical en móvil (CSS).
AdminDashboard.renderEvolutionBody = function(c){
  const r = c.route;
  const phaseCards = r.phases.map(function(ph, i){
    // v1.5 (sección 10, página 11): tres estados visuales explícitos.
    // Fase anterior = navy atenuado (ya recorrida) · actual = dorada
    // (donde conviene empezar) · futura = gris (todavía no toca).
    const suggestedIdx = r.phases.map(function(p){ return p.id; }).indexOf(r.suggestedStart);
    const isSuggested = ph.id === r.suggestedStart;
    const phaseState = i < suggestedIdx ? 'past' : (isSuggested ? 'current' : 'future');
    return (
    '<div class="route-phase route-phase--'+phaseState+(isSuggested?' route-phase--suggested':'')+'">' +
      (isSuggested ? '<span class="route-phase-badge">Fase sugerida para iniciar</span>' : '') +
      '<span class="route-phase-num">'+(i+1)+'</span>' +
      '<h4 class="route-phase-title">'+escapeHtml(ph.title)+'</h4>' +
      '<p class="route-phase-objective">'+escapeHtml(ph.objective)+'</p>' +
      // v1.5 (sección 10, página 11): el detalle completo se muestra SOLO en la
      // fase sugerida para iniciar. Antes las tres fases desplegaban los tres
      // campos (12 bloques de texto en una página), lo que competía con el
      // énfasis de la fase actual y hacía de esta la página más cargada.
      (isSuggested ?
        ('<div class="route-phase-detail"><strong>Capacidades relacionadas:</strong> '+escapeHtml(ph.capabilities.join(' · '))+'</div>' +
         '<div class="route-phase-detail"><strong>Conversación que debería ocurrir:</strong> '+escapeHtml(ph.conversations)+'</div>' +
         '<div class="route-phase-detail"><strong>Resultado que podría construirse:</strong> '+escapeHtml(ph.outcome)+'</div>')
        : '<div class="route-phase-outcome-brief">'+escapeHtml(ph.outcome)+'</div>') +
    '</div>'
    );
  }).join('<div class="route-connector" aria-hidden="true">→</div>');
  return (
    '<div class="route-diagram" role="img" aria-label="Ruta de evolución en tres fases: Alinear, Acordar e Institucionalizar. Fase sugerida para iniciar: '+escapeHtml(r.phases.filter(function(p){return p.id===r.suggestedStart;})[0].title)+'.">'+phaseCards+'</div>' +
    '<div class="align-note" style="margin-top:16px;">'+INTERPRETATION_RULES.disclaimers.routeNote+' No representa entregables comprometidos; es una orientación basada en los resultados de esta lectura.</div>'
  );
};

// Módulo "Disposición para avanzar" (v1.1) — reutilizable en panel y reporte.
// Las preguntas externas se muestran siempre separadas de la calificación.
AdminDashboard.renderDispositionModule = function(c){
  const s = c.scoring;
  const qs_ = QUESTIONNAIRE.externalQuestions;
  // v1.4: paletas ejecutivas firmes, no pastel.
  // Prioridad = urgencia creciente (gris corporativo → rojo ejecutivo).
  // Disposición = apertura progresiva (rojo → verde profundo).
  // v1.5 (sección 8): UNA sola gramática para ambas distribuciones. Antes eran
  // dos paletas distintas de cinco colores cada una, de modo que un mismo valor
  // 4 aparecía naranja en una gráfica y verde en la otra sin explicación.
  // Ahora: sin respuestas = gris claro · con respuestas = navy · barra
  // dominante = dorado BVM. El SIGNIFICADO se diferencia en el badge global.
  const DIST_EMPTY = '#E3E7EC';
  const DIST_FILLED = '#172541';
  const DIST_DOMINANT = '#B08026';
  // v1.4: etiquetas descriptivas, no solo el adjetivo — "Prioridad alta",
  // "Disposición favorable", según el módulo.
  function qualitativeLabel(avg, isPriority){
    if(avg==null) return '—';
    if(isPriority){
      if(avg >= 4.25) return 'Prioridad inmediata';
      if(avg >= 3.25) return 'Prioridad alta';
      if(avg >= 2.25) return 'Prioridad moderada';
      return 'Prioridad baja';
    }
    if(avg >= 4.25) return 'Disposición decidida';
    if(avg >= 3.25) return 'Disposición favorable';
    if(avg >= 2.25) return 'Disposición exploratoria';
    return 'Disposición reservada';
  }
  function distribution(key){
    const counts = [0,0,0,0,0];
    c.finishedParticipants.forEach(function(p){
      const v = p.externalAnswers ? p.externalAnswers[key==='priorityNextTwelveMonths'?'ext1':'ext2'] : null;
      if(v>=1 && v<=5) counts[v-1]++;
    });
    return counts;
  }
  const total = c.finishedParticipants.length;
  function distBars(counts){
    const max = Math.max.apply(null, counts);
    const dominantIdx = counts.indexOf(max);
    // v1.6.9: la altura era px fijo calculado para el track de pantalla
    // (104px). En impresión el track se comprime a 11-14mm (~42-53px) para
    // que la página 11 quepa completa, y una barra de hasta 92px terminaba
    // desbordando su propio contenedor y encimándose con el texto de arriba
    // — por eso no se veían. Con % del contenedor, la barra siempre ocupa
    // la proporción correcta sin importar cuánto se comprima el track.
    return '<div class="ext-dist">' + counts.map(function(n,i){
      const h = max>0 ? Math.round((n/max)*84) + 8 : 8;
      const fill = n===0 ? DIST_EMPTY : (i===dominantIdx ? DIST_DOMINANT : DIST_FILLED);
      return '<div class="ext-dist-col">' +
        '<span class="ext-dist-n">'+n+'</span>' +
        '<div class="ext-dist-bar-track"><div class="ext-dist-bar" style="height:'+h+'%;background:'+fill+';"></div></div>' +
        '<span class="ext-dist-value-label">'+(i+1)+'</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  // v1.4: la interpretación considera promedio Y dispersión. Usa la redacción
  // ejecutiva especificada y nunca afirma unanimidad, consenso ni resistencia
  // si los datos no lo sostienen. "Concentrada" = 2 valores distintos o menos.
  function interpretationText(kind, avg, counts){
    if(avg==null) return '';
    const distinctValues = counts.filter(function(n){ return n>0; }).length;
    const isConcentrated = distinctValues <= 2;
    if(kind==='priority'){
      if(avg >= 3.25){
        return isConcentrated
          ? 'Existe una percepción ampliamente compartida de que estas capacidades requieren atención durante los próximos doce meses.'
          : 'La familia reconoce la necesidad de avanzar, aunque no todos comparten el mismo nivel de urgencia.';
      }
      if(avg >= 2.25) return 'Los resultados sugieren que estos temas conviene analizarlos con mayor profundidad antes de definir los siguientes pasos.';
      return 'La lectura no muestra, por ahora, una percepción de urgencia sobre estas capacidades.';
    } else {
      if(avg >= 3.25){
        return isConcentrated
          ? 'La familia muestra una disposición consistente para participar en conversaciones y acciones concretas.'
          : 'Existe apertura para avanzar, aunque la disposición no está igualmente instalada entre todos los participantes.';
      }
      if(avg >= 2.25) return 'Se observa apertura para explorar un proceso, con distintos grados de disposición entre los participantes.';
      return 'La lectura no muestra, por ahora, una disposición definida para iniciar un proceso de este tipo.';
    }
  }
  const modules = qs_.map(function(eq){
    const avg = s.externalQuestionAverages[eq.key];
    const isPriority = eq.key === 'priorityNextTwelveMonths';
    const counts = distribution(eq.key);
    // v1.4: la insignia usa una variante más profunda del color para que el
    // texto blanco alcance WCAG AA en los cinco niveles (medido, no estimado).
    // §8: el badge es lo único que interpreta el significado del promedio.
    // Prioridad escala hacia naranja/rojo (urgencia); Disposición hacia verde
    // (apertura favorable). Todos alcanzan WCAG AA con texto blanco.
    const BADGE_PRIORITY = ['#5C6773','#846C1F','#B25F22','#B25F22','#C7473C'];
    const BADGE_DISPOSITION = ['#C7473C','#B25F22','#846C1F','#5F7A3E','#3F7F5A'];
    const badgeIdx = avg!=null ? Math.max(0,Math.min(4,Math.round(avg)-1)) : 0;
    const badgeColor = avg!=null ? (isPriority?BADGE_PRIORITY:BADGE_DISPOSITION)[badgeIdx] : '#5C6773';
    const badgeText = '#FFFFFF';
    const interp = interpretationText(isPriority?'priority':'disposition', avg, counts);
    return (
    '<div class="ext-module">' +
      '<div class="ext-module-grid">' +
        '<div class="ext-module-left">' +
          '<div class="ext-module-title">'+(isPriority?'Prioridad declarada':'Disposición declarada')+'</div>' +
          '<div class="ext-module-value">'+(avg!=null?avg.toFixed(1):'—')+'<span class="ext-module-value-of5"> / 5</span></div>' +
          '<span class="ext-module-qual" style="background:'+badgeColor+';color:'+badgeText+';">'+qualitativeLabel(avg, isPriority)+'</span>' +
          (interp ? '<div class="ext-module-reading"><span class="ext-module-reading-label">Lectura ejecutiva</span><p>'+escapeHtml(interp)+'</p></div>' : '') +
        '</div>' +
        '<div class="ext-module-right">' +
          (total>1 ? ('<p class="ext-dist-caption">Distribución de respuestas</p>' + distBars(counts)) :
                     '<p class="ext-dist-caption">Se requiere más de una participación para mostrar la distribución.</p>') +
        '</div>' +
      '</div>' +
    '</div>'
    );
  }).join('');
  return (
    '<div class="disposition-module">' +
      '<span class="eyebrow">Disposición para avanzar</span>' +
      '<p class="body-text" style="margin-top:8px;font-size:13px;">Refleja qué tan prioritario consideran los participantes fortalecer estas capacidades durante los próximos doce meses, y qué tan dispuestos estarían a participar en un proceso de conversaciones y acciones para lograrlo.</p>' +
      '<div class="align-note" style="margin:10px 0 14px;">Estas respuestas no forman parte de la calificación de madurez.</div>' +
      '<div class="dim-grid-2">' + modules + '</div>' +
      // §8: microleyenda obligatoria — explica por qué el color de las barras
      // y el del badge no significan lo mismo.
      '<p class="dist-microlegend">La distribución utiliza una escala común: gris cuando nadie eligió esa opción, azul cuando sí, y dorado en la respuesta más frecuente. El color del badge interpreta el significado del promedio.</p>' +
    '</div>'
  );
};
