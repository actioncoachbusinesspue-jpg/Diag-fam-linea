      capabilities: [DIM_LABEL[weak]],
      conversations: 'Quién propone, quién decide y qué reglas seguirán cuando aumente la complejidad.',
      outcome: 'Acuerdos explícitos que puedan consultarse y aplicarse de la misma manera por todos.'
    };
    const institucionalizar = {
      id:'institucionalizar', title:'Institucionalizar',
      objective: 'Convertir los acuerdos ya alcanzados en mecanismos estables, con seguimiento y capacidad de transferirse entre generaciones.',
      capabilities: [DIM_LABEL[weak], 'Continuidad y legado'],
      conversations: 'Qué mecanismo de seguimiento falta, y quién sería responsable de sostenerlo.',
      outcome: 'Prácticas que se sostienen aunque cambien las personas involucradas, y una base más firme para preparar la continuidad.'
    };

    return { phases:[alinear, acordar, institucionalizar], suggestedStart: suggestedStart, strong: strong, weak: weak };
  }

  return { buildRoute: buildRoute };
})();

// ============================================================
// ConversationPriorityEngine — conversaciones prioritarias, jerarquizadas
// y derivadas de hallazgos concretos. v1.0: cada hallazgo se documenta
// con la estructura de venta consultiva (hallazgo, implicación, riesgo,
// pregunta, capacidad a desarrollar, tipo de acompañamiento posible),
// sin lenguaje de venta agresiva.
// ============================================================
const ConversationPriorityEngine = (function(){
  const DIM_LABEL = {};
  QUESTIONNAIRE.dimensions.forEach(function(d){ DIM_LABEL[d.id] = d.name; });

  // Tipos de acompañamiento coherentes por dimensión — nunca "necesitan contratar BVM".
  const ACCOMPANIMENT_BY_DIM = {
    relaciones: 'reglas de diálogo y facilitación de conversaciones familiares',
    gobierno: 'reglas de decisión y definición de roles de gobierno',
    desarrollo: 'criterios de inversión y seguimiento de resultados patrimoniales',
    continuidad: 'preparación de nuevas generaciones y documentación de una ruta de transición',
    alineacion: 'facilitación de conversaciones para explorar diferencias de percepción'
  };

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildFromItem(qId, dimId, finding){
    const interp = ITEM_INTERPRETATIONS[qId];
    return {
      title: interp.developmentTitle,
      finding: finding,
      whyItMatters: 'Sin atenderlo, esta brecha puede sostenerse mientras todo va bien, pero perder sostén conforme crezcan el patrimonio y la familia.',
      suggestedQuestion: interp.conversationQuestion,
      desiredOutcome: capitalize(interp.opportunityNarrative) + '.',
      developmentCapability: interp.developmentTitle,
      accompanimentType: ACCOMPANIMENT_BY_DIM[dimId] || 'acompañamiento para construir acuerdos y capacidades concretas',
      sourceItems: [qId],
      dimension: dimId
    };
  }

  function scoreCandidate(baseGap, dimWeaknessBonus, signalBonus){
    return round2(baseGap * 2 + dimWeaknessBonus + signalBonus);
  }

  // normalizedDimensionScores (0-100), generalIndex (0-100)
  function pickPriorityConversations(normalizedDimensionScores, alignment, itemStats){
    const weakDim = Object.keys(normalizedDimensionScores).reduce(function(w,d){ return normalizedDimensionScores[d]<normalizedDimensionScores[w]?d:w; });
    const maxScore = Math.max.apply(null, Object.keys(normalizedDimensionScores).map(function(d){ return normalizedDimensionScores[d]; }));

    let globalMostDispersed = 1;
    alignment.questionDispersion.forEach(function(sd, idx){ if(sd > alignment.questionDispersion[globalMostDispersed-1]) globalMostDispersed = idx+1; });

    const candidates = [];
    const usedItems = {};
    function pushCandidate(qId, dimId, finding, score){
      if(usedItems[qId]) return;
      usedItems[qId] = true;
      candidates.push(Object.assign({ priorityScore: score }, buildFromItem(qId, dimId, finding)));
    }

    // 1. Afirmación con mayor espacio de desarrollo de la dimensión más débil.
    const weakBottom = itemStats[weakDim].bottomItem;
    pushCandidate(weakBottom.id, weakDim,
      'Es la afirmación con mayor espacio de desarrollo dentro de ' + DIM_LABEL[weakDim] + ', la dimensión con más oportunidad de fortalecerse.',
      scoreCandidate((maxScore - weakBottom.avg*20)/20, 2, 0));

    // 2. Segunda dimensión más débil, si aporta un hallazgo distinto.
    const sortedDims = Object.keys(normalizedDimensionScores).sort(function(a,b){ return normalizedDimensionScores[a]-normalizedDimensionScores[b]; });
    const secondWeakDim = sortedDims[1];
    if(secondWeakDim && normalizedDimensionScores[secondWeakDim] < 70){
      const secondBottom = itemStats[secondWeakDim].bottomItem;
      pushCandidate(secondBottom.id, secondWeakDim,
        'Es la afirmación con mayor espacio de desarrollo dentro de ' + DIM_LABEL[secondWeakDim] + ', la segunda dimensión con mayor oportunidad de fortalecerse.',
        scoreCandidate((maxScore - secondBottom.avg*20)/20, 1, 0));
    }

    // 3. Afirmación con mayor dispersión de toda la familia, si supera el umbral relevante.
    if(alignment.generalDispersion >= SCORING_CONFIG.relevantDispersionThreshold * 0.65){
      const dispersedInterp = ITEM_INTERPRETATIONS[globalMostDispersed];
      if(!usedItems[globalMostDispersed]){
        usedItems[globalMostDispersed] = true;
        candidates.push({
          priorityScore: scoreCandidate(0, 0, alignment.generalDispersion),
          title: 'Explorar una diferencia de percepción',
          finding: 'Es la afirmación con mayor diferencia de percepción entre integrantes en toda la familia.',
          whyItMatters: 'Las diferencias de percepción pueden provocar que algunos integrantes consideren resuelto un tema que otros todavía perciben como pendiente.',
          suggestedQuestion: '¿Qué información distinta tiene cada integrante que explique por qué percibimos esto de forma diferente?',
          desiredOutcome: 'Entender el origen de la diferencia antes de asumir que representa un desacuerdo de fondo.',
          developmentCapability: 'Alineación de percepción entre integrantes',
          accompanimentType: ACCOMPANIMENT_BY_DIM.alineacion,
          sourceItems: [globalMostDispersed],
          dimension: 'alineacion'
        });
      }
    }

    // 4. Relleno: visión patrimonial compartida (A12), si aún hay espacio.
    if(candidates.length < 4 && !usedItems[12]){
      usedItems[12] = true;
      const interp = ITEM_INTERPRETATIONS[12];
      candidates.push(Object.assign({ priorityScore: 1.2 }, buildFromItem(12, 'desarrollo', 'Conviene verificar que todos los integrantes compartan la misma imagen del patrimonio que la familia quiere construir.')));
    }

    candidates.sort(function(a,b){ return b.priorityScore - a.priorityScore; });
    const main = candidates.slice(0,4);
    const extra = candidates.slice(4).map(function(c){ return c.title; });
    return { main: main, extra: extra };
  }

  return { pickPriorityConversations: pickPriorityConversations };
})();


// ============================================================
// ChartRenderer — gráfica radar en SVG puro (sin librerías externas)
// ============================================================
const ChartRenderer = {
  // Etiquetas cortas para los ejes: en un radar de 4 puntas, los ejes
  // izquierdo y derecho tienen poco margen horizontal disponible, así que
  // los nombres largos de dimensión ("Gobierno y toma de decisiones",
  // "Continuidad y legado") se recortan visualmente. Se usa una forma breve
  // y reconocible en el propio eje; el nombre completo ya aparece en el
  // resto del reporte (títulos de sección, tarjetas de dimensión, etc.).
  // v1.1: escalera de madurez compacta y reutilizable — 5 segmentos iguales
  // (No existe · Incipiente · Parcial · Estable · Consolidado) con un
  // marcador en la posición exacta del resultado (0-100). Misma función,
  // mismo diseño, en las cuatro páginas de dimensión y en el panel.
  // v1.3: colores pastel tipo semáforo, únicos para los cinco niveles de
  // madurez — misma lógica en panel, reporte y cualquier escala equivalente.
  maturityLevelColor: function(levelId){
    const map = { no_existe:'#B94A42', incipiente:'#D4782F', parcial:'#C3A132', estable:'#7D9A55', consolidado:'#3F7F5A' };
    return map[levelId] || '#E9EDF2';
  },

  // v1.4: variantes ligeramente más profundas para INSIGNIAS, donde el texto va
  // encima. Medidas con WCAG: las cinco alcanzan AA (≥4.5) con texto blanco, así
  // que las etiquetas se ven uniformes y legibles. Los segmentos y barras siguen
  // usando maturityLevelColor (la paleta original), porque ahí no hay texto sobre
  // el color y conviene conservar los tonos definidos en la especificación.
  //   No existe    #B94A42 → 5.10   Incipiente #B25F22 → 4.61
  //   Parcial      #846C1F → 5.07   Estable    #5F7A3E → 4.84
  //   Consolidado  #3F7F5A → 4.78
  maturityBadgeColor: function(levelId){
    const map = { no_existe:'#B94A42', incipiente:'#B25F22', parcial:'#846C1F', estable:'#5F7A3E', consolidado:'#3F7F5A' };
    return map[levelId] || '#5C6773';
  },

  // v1.3: mini escala horizontal de 1 a 5 (discreta) para los módulos de
  // Prioridad y Disposición declaradas — marca la posición exacta del promedio.
  renderMiniScale1to5: function(avg, colors){
    const width = 300, height = 34, pad = 4, segW = (width-pad*2)/5;
    const clamped = Math.max(1, Math.min(5, avg));
    const markerX = pad + ((clamped-1)/4)*(width-pad*2);
    let segs = '';
    for(let i=0;i<5;i++){
      const x = pad + i*segW;
      segs += '<rect x="'+x+'" y="10" width="'+(segW-3)+'" height="12" rx="3" fill="'+colors[i]+'"/>';
    }
    return '<svg viewBox="0 0 '+width+' '+height+'" width="100%" style="display:block;max-width:260px;print-color-adjust:exact;-webkit-print-color-adjust:exact;" role="img" aria-label="Escala de 1 a 5, promedio '+avg.toFixed(1)+'">' +
      segs +
      '<polygon points="'+markerX+',0 '+(markerX-5)+',8 '+(markerX+5)+',8" fill="var(--bvm-navy)"/>' +
    '</svg>';
  },

  renderMaturityScale: function(score, rawAverage, level){
    const width = 640, height = 60, pad = 4;
    const trackW = width - pad*2;
    const segW = trackW/5;
    const segLabels = ['No existe','Incipiente','Parcial','Estable','Consolidado'];
    // v1.3: semáforo pastel — los cinco tonos siempre visibles (no solo el
    // activo). El nivel activo se distingue por contorno más fuerte, marcador
    // superior y mayor peso tipográfico, nunca solo por el color.
    const segColors = ['#B94A42','#D4782F','#C3A132','#7D9A55','#3F7F5A'];
    const clampedScore = Math.max(0, Math.min(100, score));
    const markerX = pad + (clampedScore/100)*trackW;
    const activeIdx = Math.min(4, Math.floor(clampedScore/20));
    let segs = '';
    for(let i=0;i<5;i++){
      const x = pad + i*segW;
      const active = i === activeIdx;
      segs += '<rect x="'+x+'" y="20" width="'+(segW-3)+'" height="14" rx="3" fill="'+segColors[i]+'" stroke="'+(active?'var(--bvm-navy)':'none')+'" stroke-width="'+(active?'2.5':'0')+'"/>';
      segs += '<text x="'+(x+(segW-3)/2)+'" y="48" text-anchor="middle" font-size="10" font-family=\'Poppins,sans-serif\' fill="var(--bvm-navy)" font-weight="'+(active?'800':'600')+'">'+segLabels[i]+'</text>';
    }
    // Marcador: línea que atraviesa toda la barra + círculo exactamente sobre
    // la posición del resultado + triángulo superior — indica la posición
    // exacta además del bloque activo ya resaltado arriba.
    const marker =
      '<line x1="'+markerX+'" y1="4" x2="'+markerX+'" y2="34" stroke="var(--bvm-navy)" stroke-width="2.5"/>' +
      '<polygon points="'+markerX+',0 '+(markerX-7)+',10 '+(markerX+7)+',10" fill="var(--bvm-gold)"/>' +
      '<circle cx="'+markerX+'" cy="27" r="6" fill="var(--bvm-navy)" stroke="var(--bvm-gold)" stroke-width="2.5"/>';
    const svg = '<svg viewBox="0 0 '+width+' '+height+'" width="100%" style="display:block;print-color-adjust:exact;-webkit-print-color-adjust:exact;" role="img" aria-label="Escalera de madurez: resultado '+score.toFixed(0)+' de 100, nivel '+level.label+', marcador en la posición exacta del resultado">' +
      segs + marker +
    '</svg>';
    const caption = '<div class="maturity-scale-caption">' +
      '<span class="maturity-scale-score">'+score.toFixed(0)+' / 100</span>' +
      '<span class="maturity-scale-avg">Promedio '+rawAverage.toFixed(1)+' / 5</span>' +
      '<span class="maturity-scale-level">'+escapeHtml(level.label)+'</span>' +
    '</div>';
    return '<div class="maturity-scale-wrap">' + svg + caption + '</div>';
  },

  // v1.1: barras horizontales comparativas de las cuatro dimensiones —
  // complementa al radar (equilibrio del perfil) con comparación exacta.
  // Orden metodológico fijo (no por valor), para que la posición de cada
  // dimensión sea siempre la misma entre lecturas y facilite comparar.
  renderHorizontalBars: function(normalizedDimensionScores, labels){
    const dims = QUESTIONNAIRE.dimensions.map(function(d){ return d.id; });
    const width = 640, rowH = 62, pad = 6, labelW = 190, trackW = width - labelW - 66;
    const height = dims.length*rowH + pad*2;
    let rows = '';
    dims.forEach(function(dimId, i){
      const score = normalizedDimensionScores[dimId];
      const level = getMaturityLevel(score);
      const y = pad + i*rowH;
      const barW = (score/100)*trackW;
      const markerYTop = y + 4, markerYBottom = y + 30; // relativo a ESTA fila, no absoluto
      rows +=
        '<text x="0" y="'+(y+16)+'" font-size="13.5" font-family=\'Poppins,sans-serif\' font-weight="700" fill="var(--bvm-navy)">'+escapeHtml(labels[dimId])+'</text>' +
        '<text x="0" y="'+(y+30)+'" font-size="10.5" font-family=\'Poppins,sans-serif\' fill="var(--bvm-gold)" font-weight="700" letter-spacing="0.02em">'+escapeHtml(level.label.toUpperCase())+'</text>' +
        '<rect x="'+labelW+'" y="'+(y+8)+'" width="'+trackW+'" height="18" rx="5" fill="#EDEFF3"/>' +
        // Marcas de referencia cada 20 puntos (límites de nivel), sutiles.
        '<line x1="'+(labelW+trackW*0.2)+'" y1="'+(y+8)+'" x2="'+(labelW+trackW*0.2)+'" y2="'+(y+26)+'" stroke="#fff" stroke-width="1.5"/>' +
        '<line x1="'+(labelW+trackW*0.4)+'" y1="'+(y+8)+'" x2="'+(labelW+trackW*0.4)+'" y2="'+(y+26)+'" stroke="#fff" stroke-width="1.5"/>' +
        '<line x1="'+(labelW+trackW*0.6)+'" y1="'+(y+8)+'" x2="'+(labelW+trackW*0.6)+'" y2="'+(y+26)+'" stroke="#fff" stroke-width="1.5"/>' +
        '<line x1="'+(labelW+trackW*0.8)+'" y1="'+(y+8)+'" x2="'+(labelW+trackW*0.8)+'" y2="'+(y+26)+'" stroke="#fff" stroke-width="1.5"/>' +
        '<rect x="'+labelW+'" y="'+(y+8)+'" width="'+Math.max(6,barW)+'" height="18" rx="5" fill="var(--bvm-navy)"/>' +
        '<line x1="'+(labelW+barW)+'" y1="'+markerYTop+'" x2="'+(labelW+barW)+'" y2="'+markerYBottom+'" stroke="var(--bvm-gold)" stroke-width="2.5"/>' +
        '<text x="'+(labelW+trackW+12)+'" y="'+(y+21)+'" font-size="16" font-weight="800" font-family=\'Poppins,sans-serif\' fill="var(--bvm-navy)">'+score.toFixed(0)+'</text>';
    });
    return '<svg viewBox="0 0 '+width+' '+height+'" width="100%" style="display:block;" role="img" aria-label="Comparación de las cuatro dimensiones en escala de 0 a 100, con nivel de madurez de cada una">'+rows+'</svg>';
  },

  axisLabel: function(dimId){
    const short = { relaciones:'Relaciones', gobierno:'Gobierno', desarrollo:'Desarrollo', continuidad:'Continuidad' };
    return short[dimId] || dimId;
  },

  // v1.1: matriz capacidad vs. alineación — las 4 dimensiones como puntos
  // independientes. Eje X: capacidad percibida (normalizedDimensionScores).
  // Eje Y: alineación = 100 × (1 - dispersión normalizada), misma heurística
  // de normalización de dispersión ya usada en RISK_OPPORTUNITY_CONFIG.
  renderCapacityAlignmentMatrix: function(normalizedDimensionScores, dimensionDispersion, labels){
    const plotSize = 420, pad = 46, labelColW = 148;
    const width = pad*2 + plotSize + labelColW, height = pad*2 + plotSize;
    const mid = pad + plotSize/2;
    const ceiling = RISK_OPPORTUNITY_CONFIG.dispersionNormalizationCeiling;
    const dims = QUESTIONNAIRE.dimensions.map(function(d){ return d.id; });
    const points = dims.map(function(dimId){
      const capacityScore = normalizedDimensionScores[dimId];
      const dispNorm = Math.min(1, dimensionDispersion[dimId] / ceiling);
      const alignmentScore = 100 * (1 - dispNorm);
      const x = pad + (capacityScore/100)*plotSize;
      const y = pad + (1 - alignmentScore/100)*plotSize;
      return { dimId:dimId, x:x, y:y, capacityScore:capacityScore, alignmentScore:alignmentScore };
    });
    // v1.5 (sección 9.1) — CORRECCIÓN DE SEMÁNTICA. El eje Y coloca la
    // alineación ALTA arriba (y = 1 - alignment). Las etiquetas anteriores
    // estaban invertidas verticalmente: el cuadrante superior derecho —alta
    // capacidad y lectura compartida— decía "Fortaleza no compartida", lo que
    // llevaba a la conclusión contraria. Etiquetas correctas:
    //   ↑ arriba = coinciden        ↓ abajo = lectura dividida
    //   → derecha = capacidad alta  ← izquierda = capacidad baja
    const quadLabels = [
      { x:pad+10, y:pad+16, anchor:'start', tone:'mid',
        lines:['Brecha reconocida','(coinciden en que falta)'] },
      { x:pad+plotSize-10, y:pad+16, anchor:'end', tone:'good',
        lines:['Zona favorable','(capacidad y lectura compartida)'] },
      { x:pad+10, y:pad+plotSize-24, anchor:'start', tone:'attention',
        lines:['Zona de mayor atención','(capacidad baja, lectura dividida)'] },
      { x:pad+plotSize-10, y:pad+plotSize-24, anchor:'end', tone:'mid',
        lines:['Fortaleza no compartida','(no todos la reconocen)'] }
    ];
    const TONE_COLOR = { good:'#3F7F5A', mid:'#5C6773', attention:'#C7473C' };
    const quadTexts = quadLabels.map(function(q){
      return '<text x="'+q.x+'" y="'+q.y+'" text-anchor="'+q.anchor+'" font-size="9.5" font-family=\'Poppins,sans-serif\' fill="'+TONE_COLOR[q.tone]+'" font-weight="700">' +
        q.lines.map(function(line, i){ return '<tspan x="'+q.x+'" dy="'+(i===0?0:12)+'" font-weight="'+(i===0?'700':'500')+'">'+line+'</tspan>'; }).join('') +
      '</text>';
    }).join('');
    // v1.2: las etiquetas ya NO viven dentro del cuadro — se colocan por completo
    // fuera, en una columna a la derecha, en cuatro posiciones fijas y separadas
    // (ordenadas según la altura real de cada punto), unidas por una línea guía.
    // Así es imposible que una etiqueta se encime con el trazado o con otra.
    const labelColX = pad + plotSize + 26;
    const slotYs = [pad+22, pad+plotSize*0.38, pad+plotSize*0.66, pad+plotSize-10];
    const byY = points.slice().sort(function(a,b){ return a.y-b.y; });
    const labelYByDim = {};
    byY.forEach(function(p, idx){ labelYByDim[p.dimId] = slotYs[idx]; });
    const dots = points.map(function(p){
      const labelY = labelYByDim[p.dimId];
      return '<line x1="'+p.x+'" y1="'+p.y+'" x2="'+(labelColX-8)+'" y2="'+labelY+'" stroke="var(--bvm-gold)" stroke-width="1.2" stroke-dasharray="2,2"/>' +
        '<circle cx="'+p.x+'" cy="'+p.y+'" r="7" fill="var(--bvm-navy)" stroke="var(--bvm-gold)" stroke-width="2.5"/>';
    }).join('');
    const labelTexts = points.map(function(p){
      const labelY = labelYByDim[p.dimId];
      return '<circle cx="'+labelColX+'" cy="'+labelY+'" r="3" fill="var(--bvm-gold)"/>' +
        '<text x="'+(labelColX+9)+'" y="'+(labelY+4)+'" font-size="12.5" font-weight="700" font-family=\'Poppins,sans-serif\' fill="var(--bvm-navy)">'+escapeHtml(ChartRenderer.axisLabel(p.dimId))+'</text>';
    }).join('');
    const svg = '<svg viewBox="0 0 '+width+' '+height+'" width="100%" style="display:block;" role="img" aria-label="Matriz de capacidad percibida y alineación entre integrantes, cuatro dimensiones, con etiquetas conectadas por línea">' +
      // §9.1: progresión de favorabilidad coherente con las etiquetas.
      // Inferior izquierdo = mayor atención (tinte cálido más marcado);
      // superior derecho = zona favorable (tinte verde suave).
      '<rect x="'+pad+'" y="'+mid+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#F6E3E0"/>' +
      '<rect x="'+mid+'" y="'+mid+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#F1EFE7"/>' +
      '<rect x="'+pad+'" y="'+pad+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#F1EFE7"/>' +
      '<rect x="'+mid+'" y="'+pad+'" width="'+plotSize/2+'" height="'+plotSize/2+'" fill="#E4EFE6"/>' +
      '<line x1="'+pad+'" y1="'+mid+'" x2="'+(pad+plotSize)+'" y2="'+mid+'" stroke="#C7D0DB" stroke-width="1.5"/>' +
      '<line x1="'+mid+'" y1="'+pad+'" x2="'+mid+'" y2="'+(pad+plotSize)+'" stroke="#C7D0DB" stroke-width="1.5"/>' +
      '<rect x="'+pad+'" y="'+pad+'" width="'+plotSize+'" height="'+plotSize+'" fill="none" stroke="var(--bvm-navy)" stroke-width="1.4"/>' +
      quadTexts +
      '<text x="'+mid+'" y="'+(pad+plotSize+22)+'" text-anchor="middle" font-size="11" font-family=\'Poppins,sans-serif\' fill="var(--bvm-soft-gray)">Capacidad percibida →</text>' +
      '<text x="16" y="'+mid+'" text-anchor="middle" font-size="11" font-family=\'Poppins,sans-serif\' fill="var(--bvm-soft-gray)" transform="rotate(-90 16 '+mid+')">Alineación entre participantes →</text>' +
      dots + labelTexts +
    '</svg>';
    return { svg: svg, points: points };
  },


  // v1.1: usa la escala 0-100 (normalizedDimensionScores), consistente con
  // el resto de la aplicación — antes graficaba en 1-5, lo que mostraba una
  // cifra distinta a la que aparece en cualquier otra parte del reporte.
  renderRadar: function(normalizedDimensionScores, labels){
    const dims = Object.keys(normalizedDimensionScores);
    const n = dims.length;
    const size = 460, cx = size/2, cy = size/2, maxR = 130;
    const angleFor = function(i){ return (Math.PI*2*i/n) - Math.PI/2; };
    const pointFor = function(i, value){
      const r = (value/100) * maxR;
      const a = angleFor(i);
      return [cx + r*Math.cos(a), cy + r*Math.sin(a)];
    };

    // Bandas alternas sutiles (zebra) entre niveles, para dar profundidad
    // sin recurrir a colores ajenos a la paleta institucional.
    let gridBands = '';
    let gridPolys = '';
    for(let lv=100; lv>=20; lv-=20){
      const pts = dims.map(function(d,i){ return pointFor(i, lv).join(','); }).join(' ');
      if((lv/20) % 2 === 0){
        gridBands += '<polygon points="'+pts+'" fill="#EFF3F7"/>';
      }
      gridPolys += '<polygon points="'+pts+'" fill="none" stroke="#D7DEE6" stroke-width="1"/>';
    }

    let axisLines = '';
    let axisLabels = '';
    dims.forEach(function(d,i){
      const [x,y] = pointFor(i, 108);
      axisLines += '<line x1="'+cx+'" y1="'+cy+'" x2="'+pointFor(i,100)[0]+'" y2="'+pointFor(i,100)[1]+'" stroke="#B9C4D1" stroke-width="1"/>';
      const anchor = (x < cx-4) ? 'end' : (x > cx+4 ? 'start' : 'middle');
      // Separación clara entre el nombre de la dimensión y su valor (líneas distintas, con espacio).
      axisLabels += '<text x="'+x+'" y="'+y+'" text-anchor="'+anchor+'" font-size="12.5" font-weight="700" fill="#172541" font-family="Poppins,sans-serif">'+escapeHtml(ChartRenderer.axisLabel(d))+'</text>';
      axisLabels += '<text x="'+x+'" y="'+(y+17)+'" text-anchor="'+anchor+'" font-size="12" fill="#B08026" font-weight="700" font-family="Poppins,sans-serif">'+normalizedDimensionScores[d].toFixed(0)+' / 100</text>';
    });

    const dataPts = dims.map(function(d,i){ return pointFor(i, normalizedDimensionScores[d]).join(','); }).join(' ');
    const dataDots = dims.map(function(d,i){
      const [x,y] = pointFor(i, normalizedDimensionScores[d]);
      return '<circle cx="'+x+'" cy="'+y+'" r="5" fill="#172541" stroke="#EDCD5B" stroke-width="2.5"/>';
    }).join('');

    const gradientId = 'radarFill' + Math.random().toString(36).slice(2,8);

    return '<svg viewBox="0 0 '+size+' '+(size+34)+'" width="100%" style="display:block;" role="img" aria-label="Gráfica radar de las cuatro dimensiones del diagnóstico, escala de 0 a 100">' +
      '<defs>' +
        '<radialGradient id="'+gradientId+'" cx="50%" cy="50%" r="65%">' +
          '<stop offset="0%" stop-color="#B08026" stop-opacity="0.55"/>' +
          '<stop offset="100%" stop-color="#EDCD5B" stop-opacity="0.30"/>' +
        '</radialGradient>' +
      '</defs>' +
      '<g transform="translate(0,17)">' +
      gridBands + gridPolys + axisLines +
      '<polygon points="'+dataPts+'" fill="url(#'+gradientId+')" stroke="#B08026" stroke-width="2.5"/>' +
      dataDots + axisLabels +
      '</g></svg>';
  }
};


// ============================================================
// StateManager — estado central de la aplicación (interfaz separada de datos)
// ============================================================
const StateManager = (function(){
  let state = {
    view: 'selector', // selector | participant | admin
    participant: {
      stage: 'cover', // cover | identify | instructions | question | review | external | final | locked
      participantId: '',
      name: '',
      generation: '',
      participationRole: '',
      participationType: '',
      answers: new Array(20).fill(null),
      externalAnswers: {},
      currentIndex: 0
    },
    admin: {
      tab: 'sintesis',
      commercial: false // true = Demostración ejecutiva (modo comercial), false = Administración BVM interna
    },
    modal: null, // { title, body, onConfirm, confirmLabel }
    help: { open:false, topic:null },
    onboarding: { active:false, mode:null, step:0 },
    tour: { active:false, mode:null, filterTab:null, stepIndex:0, playing:false },
    printHelp: { open:false }
  };

  function get(){ return state; }
  function set(patch){ state = Object.assign({}, state, patch); render(); }
  function setParticipant(patch){ state = Object.assign({}, state, { participant: Object.assign({}, state.participant, patch) }); render(); }
  // Actualiza el estado sin volver a renderizar la pantalla — evita perder el foco/cursor
  // o el texto no confirmado de un campo (por ejemplo, al elegir un radio mientras se escribe el código).
  function setParticipantSilent(patch){ state = Object.assign({}, state, { participant: Object.assign({}, state.participant, patch) }); }
  function setAdmin(patch){ state = Object.assign({}, state, { admin: Object.assign({}, state.admin, patch) }); render(); }
  let modalOpener = null;
  // ============================================================
  // v1.4: guardián único de overlays. Un recorrido guiado y cualquier otro
  // overlay modal (confirmación, ayuda, guía de impresión, onboarding) no
  // pueden coexistir: se apilan visualmente y declaran aria-modal="true" a la
  // vez, lo que impide a un lector de pantalla saber cuál es el diálogo
  // activo. En vez de repetir la comprobación en cada punto de apertura, se
  // centraliza aquí y se invoca desde todos ellos.
  // ============================================================
  function dismissTourForOverlay(){
    if(state.tour.active && typeof GuidedTourManager !== 'undefined'){
      GuidedTourManager.exit(false);
    }
  }

  function openModal(modal){ dismissTourForOverlay(); modalOpener = document.activeElement; state = Object.assign({}, state, { modal: modal }); render(); }
  function closeModal(){
    state = Object.assign({}, state, { modal: null }); render();
    if(modalOpener && typeof modalOpener.focus === 'function') modalOpener.focus();
    modalOpener = null;
  }

  function openHelp(topic){
    dismissTourForOverlay();
    state = Object.assign({}, state, { help: { open:true, topic: topic || 'primeros-pasos' } });
    render();
  }
  function closeHelp(){ state = Object.assign({}, state, { help: { open:false, topic:null } }); render(); }

  function startOnboarding(mode){ dismissTourForOverlay(); state = Object.assign({}, state, { onboarding: { active:true, mode:mode, step:0 } }); render(); }
  function setOnboardingStep(step){ state = Object.assign({}, state, { onboarding: Object.assign({}, state.onboarding, { step:step }) }); render(); }
  function closeOnboarding(){ state = Object.assign({}, state, { onboarding: { active:false, mode:null, step:0 } }); render(); }


  function openPrintHelp(){ dismissTourForOverlay(); state = Object.assign({}, state, { printHelp: { open:true } }); render(); }
  function closePrintHelp(){ state = Object.assign({}, state, { printHelp: { open:false } }); render(); }

  function resetParticipantFlow(){
    setParticipant({ stage:'cover', participantId:'', name:'', generation:'', participationRole:'', participationType:'', answers:new Array(20).fill(null), externalAnswers:{}, currentIndex:0 });
  }

  let isRendering = false;
  let renderQueued = false;
  function render(){
    if(isRendering){
      // Un bind() en curso disparó otro cambio de estado (por ejemplo, el
      // recorrido guiado cambiando de pestaña). En vez de anidar el render
      // (lo que duplicaba el botón de Ayuda y el aviso de almacenamiento en
      // v0.7), se pospone una única repetición para cuando termine el actual.
      renderQueued = true;
      return;
    }
    isRendering = true;
    try{
      renderOnce();
    } finally {
      isRendering = false;
    }
    if(renderQueued){
      renderQueued = false;
      render();
    }
  }
  function renderOnce(){
    const root = qs('#appRoot');
    if(!root) return;
    if(state.view === 'selector'){
      root.innerHTML = SelectorScreen.render();
      SelectorScreen.bind();
    } else if(state.view === 'participant'){
      root.innerHTML = ParticipantApp.render(state.participant);
      ParticipantApp.bind(state.participant);
    } else if(state.view === 'admin'){
      root.innerHTML = AdminDashboard.render(state.admin);
      AdminDashboard.bind(state.admin);
    }
    // v1.5 (sección 11): el aviso de almacenamiento se adapta al modo.
    // - Demostración: se oculta (el prospecto no debe ver advertencias técnicas).
    // - Participante: nota discreta, sin lenguaje de administración.
    // - Administración BVM: aviso completo, que es donde se puede actuar.
    const isCommercialMode = state.view === 'admin' && state.admin.commercial;
    const isParticipantMode = state.view === 'participant';
    const showStorageWarning = APP_CONFIG.storageWarningEnabled
      && StorageAdapter.isUsingMemoryFallback()
      && !APP_CONFIG.dismissStorageWarningForSession
      && !isCommercialMode;
    if(showStorageWarning){
      const noticeText = isParticipantMode
        ? 'Su avance se guarda en este dispositivo.'
        : 'Guardado local limitado. Al cerrar esta ventana podría perderse el avance. Consulte las opciones de respaldo en Administración BVM.';
      root.insertAdjacentHTML('afterbegin',
        '<div class="storage-fallback-banner storage-fallback-compact no-print' + (isParticipantMode ? ' storage-fallback-quiet' : '') + '">' +
          '<span>' + ICONS.info + '</span>' +
          '<span>' + noticeText + '</span>' +
          '<button type="button" class="storage-fallback-dismiss" data-action="dismiss-storage-notice" aria-label="Cerrar aviso">&times;</button>' +
        '</div>'
      );
      const dismissBtn = qs('[data-action="dismiss-storage-notice"]');
      if(dismissBtn) dismissBtn.addEventListener('click', function(){ APP_CONFIG.dismissStorageWarningForSession = true; render(); });
    }
    // Botón de ayuda flotante — no se imprime, disponible en toda la app salvo dentro del reporte de impresión.
    if(state.view !== 'admin' || state.admin.tab !== 'reporte-integral'){
      root.insertAdjacentHTML('beforeend',
        '<button type="button" class="help-fab no-print" data-action="open-help" aria-label="Ayuda">'+ICONS.info+'<span>Ayuda</span></button>'
      );
      const helpFab = qs('[data-action="open-help"]');
      if(helpFab) helpFab.addEventListener('click', function(){ openHelp(HelpCenter.topicForCurrentScreen(state)); });
    }
    renderModal();
    renderHelp();
    renderOnboarding();
    renderPrintHelp();
    renderTourOverlay();
    AccessibilityManager.onRender();
  }

  function renderModal(){
    const holder = qs('#modalRoot');
    if(!holder) return;
    if(!state.modal){ holder.innerHTML = ''; return; }
    const m = state.modal;
    holder.innerHTML =
      '<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalBody">' +
        '<div class="modal-box">' +
          '<h3 class="h3" id="modalTitle">'+escapeHtml(m.title)+'</h3>' +
          '<div class="body-text" id="modalBody" style="margin-top:10px;">'+m.body+'</div>' +
          '<div class="modal-actions">' +
            '<button class="btn btn-secondary" id="modalCancel">'+escapeHtml(m.cancelLabel||'Cancelar')+'</button>' +
            '<button class="btn '+(m.danger?'btn-primary':'btn-gold')+'" id="modalConfirm">'+escapeHtml(m.confirmLabel||'Confirmar')+'</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    qs('#modalCancel').addEventListener('click', closeModal);
    qs('#modalConfirm').addEventListener('click', function(){
      const fn = m.onConfirm;
      // El modal permanece en el DOM mientras se ejecuta onConfirm, para que pueda
      // leer valores de campos (por ejemplo el PIN) antes de cerrarse. Si onConfirm
      // devuelve exactamente false, el modal permanece abierto (validación fallida).
      const result = fn ? fn() : undefined;
      if(result !== false) closeModal();
    });
    const overlay = qs('#modalOverlay');
    const box = qs('.modal-box', overlay);
    function focusableEls(){
      return qsa('button, input, select, textarea, a[href]', box).filter(function(el){ return !el.disabled && el.offsetParent !== null; });
    }
    overlay.addEventListener('keydown', function(e){
      if(e.key==='Escape' && m.cancelLabel!==''){ closeModal(); return; }
      if(e.key==='Enter' && (e.target.tagName==='INPUT')){ e.preventDefault(); qs('#modalConfirm').click(); return; }
      if(e.key==='Tab'){
        const els = focusableEls();
        if(!els.length) return;
        const first = els[0], last = els[els.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
    });
    // Foco inicial: el primer campo si existe, si no, el título.
    const firstInput = qs('input, select, textarea', box);
    if(firstInput) firstInput.focus();
    else { box.setAttribute('tabindex','-1'); box.focus(); }
  }

  function renderHelp(){
    const holder = qs('#helpRoot') || (function(){ const d = document.createElement('div'); d.id='helpRoot'; document.body.appendChild(d); return d; })();
    if(!state.help.open){ holder.innerHTML=''; return; }
    holder.innerHTML = HelpCenter.render(state.help.topic, state);
    HelpCenter.bind();
  }

  function renderOnboarding(){
    const holder = qs('#onboardingRoot') || (function(){ const d = document.createElement('div'); d.id='onboardingRoot'; document.body.appendChild(d); return d; })();
    if(!state.onboarding.active){ holder.innerHTML=''; return; }
    holder.innerHTML = OnboardingManager.render(state.onboarding);
    OnboardingManager.bind(state.onboarding);
  }

  function renderPrintHelp(){
    const holder = qs('#printHelpRoot') || (function(){ const d = document.createElement('div'); d.id='printHelpRoot'; document.body.appendChild(d); return d; })();
    if(!state.printHelp.open){ holder.innerHTML=''; return; }
    holder.innerHTML = PrintHelpManager.render();
    PrintHelpManager.bind();
  }

  function renderTourOverlay(){
    const holder = qs('#tourOverlayRoot') || (function(){ const d = document.createElement('div'); d.id='tourOverlayRoot'; document.body.appendChild(d); return d; })();
    if(!state.tour.active){ holder.innerHTML=''; return; }
    holder.innerHTML = GuidedTourManager.render(state.tour);
    GuidedTourManager.bind(state.tour);
  }

  return {
    get, set, setParticipant, setParticipantSilent, setAdmin, openModal, closeModal, resetParticipantFlow, render,
    openHelp, closeHelp, startOnboarding, setOnboardingStep, closeOnboarding,
    openPrintHelp, closePrintHelp
  };
})();

// ============================================================
// AppModeManager — controla la entrada/salida de cada modo y protege
// la información real cuando se activa la demostración comercial.
// ============================================================
const AppModeManager = (function(){
  // v0.7: ya no existe copia temporal ni restauración. Entrar y salir de la
  // demostración únicamente cambia qué namespace de almacenamiento está activo.
  // Los datos reales nunca se leen, copian ni sobrescriben al abrir la demostración.

  function enterParticipant(){
    StorageNamespaceManager.setNamespace('real');
    const fam = StorageAdapter.getActiveFamily();
    if(!fam){
      StateManager.openModal({
        title:'Todavía no hay una familia configurada',
        body:'BVM debe crear y activar una familia desde Administración BVM antes de que los participantes puedan responder.',
        confirmLabel:'Entendido', cancelLabel:'', onConfirm:function(){}
      });
      return;
    }
    StateManager.resetParticipantFlow();
    StateManager.set({ view:'participant' });
  }

  function enterCommercial(){
    StorageNamespaceManager.setNamespace('demo');
    StorageAdapter.ensureDemoDataset();
    StateManager.setAdmin({ tab:'sintesis', commercial:true });
    StateManager.set({ view:'admin' });
    OnboardingManager.runSequence(['commercial']);
  }

  function enterAdmin(){
    StorageNamespaceManager.setNamespace('real');
    StateManager.setAdmin({ tab:'sintesis', commercial:false });
    StateManager.set({ view:'admin' });
    // v1.6.1 (sección 3.4): la guía es voluntaria. Antes el recorrido
    // administrativo arrancaba solo; ahora primero se ofrece elegir entre
    // "Comenzar guía" y "Explorar libremente", con casilla para no volver a
    // preguntarlo. Si ya se omitió antes, no se vuelve a mostrar.
    if(!GuidedTourManager.hasCompletedOrSkipped('admin')) OnboardingManager.runSequence(['admin']);
  }

  function exitToSelector(){
    // v1.4: cualquier recorrido activo se cierra al salir. Antes el overlay
    // quedaba abierto sobre la pantalla inicial, apuntando a elementos que
    // solo existen dentro del panel.
    if(StateManager.get().tour.active) GuidedTourManager.exit(false);
    StorageNamespaceManager.setNamespace('real');
    StateManager.set({ view:'selector' });
  }

  return { enterParticipant, enterCommercial, enterAdmin, exitToSelector };
})();

  // Determina el modo activo para filtrar el índice de ayuda — cada modo solo
  // ve los temas que le corresponden, no una lista genérica con todo mezclado.
  function currentMode(state){
    if(state.view === 'participant') return 'participant';
    if(state.view === 'admin') return state.admin.commercial ? 'commercial' : 'admin';
    return 'selector';
  }
  function indexForMode(mode){
    return INDEX.filter(function(it){ return it.modes.indexOf(mode) !== -1; });
  }

  function topicForCurrentScreen(state){
    if(state.view === 'participant'){
      if(state.participant.stage === 'review') return 'guardado-avance';
      return 'participar';
    }
    if(state.view === 'admin'){
      if(state.admin.commercial) return 'demostracion';
      if(state.admin.tab === 'datos') return 'gestionar-familias';
      if(state.admin.tab === 'reporte-integral') return 'guardar-pdf';
      return 'radiografia';
    }
    return 'primeros-pasos';
  }

  function render(topicId, state){
    const mode = currentMode(state || {view:'selector'});
    const visibleIndex = indexForMode(mode);
    const isTopicVisible = visibleIndex.some(function(it){ return it.id===topicId; });
    const effectiveTopicId = isTopicVisible ? topicId : 'primeros-pasos';
    const topic = HELP_CONTENT[effectiveTopicId] || HELP_CONTENT['primeros-pasos'];
    const navItems = visibleIndex.map(function(it){
      return '<button type="button" class="help-nav-item'+(it.id===effectiveTopicId?' active':'')+'" data-help-topic="'+it.id+'">'+it.label+'</button>';
    }).join('');
    return (
    '<div class="modal-overlay help-overlay" id="helpOverlay" role="dialog" aria-modal="true" aria-labelledby="helpTitle">' +
      '<div class="help-panel">' +
        '<div class="help-panel-head">' +
          '<span class="eyebrow">Centro de ayuda</span>' +
          '<button type="button" class="help-close" id="helpCloseBtn" aria-label="Cerrar ayuda">&times;</button>' +
        '</div>' +
        '<div class="help-panel-body">' +
          '<nav class="help-nav" aria-label="Índice de ayuda">'+navItems+'</nav>' +
          '<div class="help-content">' +
            '<h3 class="h3" id="helpTitle">'+escapeHtml(topic.title)+'</h3>' +
            '<div class="help-content-body body-text">'+topic.body+'</div>' +
            // v1.6.1 (sección 3.5): omitir una guía no debe impedir volver a
            // consultarla. Estas tres acciones la recuperan desde aquí.
            // v1.6.2 (sección 3): en modo Participante se ofrecen SOLO las
            // acciones que le corresponden. Antes las tres acciones vivían
            // únicamente en Administración y quien omitía la guía como
            // participante no tenía forma directa de recuperarla.
            (state && state.view === 'participant' ?
              ('<div class="help-guide-actions">' +
                 '<span class="help-guide-label">Ayuda para responder</span>' +
                 '<button class="btn btn-secondary btn-compact" data-action="help-participant-guide">Ver guía para responder</button>' +
                 '<button class="btn-text btn-text--xs" data-action="help-participant-reset">Reiniciar guía del participante</button>' +
               '</div>') : '') +
            (state && state.view === 'admin' ?
              ('<div class="help-guide-actions">' +
                 '<span class="help-guide-label">Guía de la aplicación</span>' +
                 '<button class="btn btn-secondary btn-compact" data-action="help-tour-section">Ver guía de esta sección</button>' +
                 '<button class="btn btn-secondary btn-compact" data-action="help-tour-full">Ver recorrido completo</button>' +
                 '<button class="btn-text btn-text--xs" data-action="help-tour-restart">Reiniciar guía</button>' +
               '</div>') : '') +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
    );
  }

  function bind(){
    // §3: abre la pantalla previa del participante (Comenzar guía / Explorar
    // libremente), respetando la casilla de preferencia.
    const pGuideBtn = qs('[data-action="help-participant-guide"]');
    if(pGuideBtn) pGuideBtn.addEventListener('click', function(){
      // §4.3: apertura forzada — ignora introSeen y noAutoStart.
      OnboardingManager.openModeIntro('participant');
    });
    // §3: borra SOLO el estado de visualización del recorrido del participante.
    // No toca respuestas, avance, familia activa ni datos administrativos.
    const pResetBtn = qs('[data-action="help-participant-reset"]');
    if(pResetBtn) pResetBtn.addEventListener('click', function(){
      // §4.4: borra SOLO las preferencias de 'participant'. No toca respuestas,
      // avance, nombre, familyId, ni los estados de admin o commercial.
      GuidedTourManager.resetTourPreference('participant');
      OnboardingManager.openModeIntro('participant');
    });
    const secBtn = qs('[data-action="help-tour-section"]');
    if(secBtn) secBtn.addEventListener('click', function(){
      const st = StateManager.get();
      StateManager.closeHelp();
      GuidedTourManager.restart(st.admin.commercial ? 'commercial' : 'admin', st.admin.tab);
    });
    const fullBtn = qs('[data-action="help-tour-full"]');
    if(fullBtn) fullBtn.addEventListener('click', function(){
      const st = StateManager.get();
      StateManager.closeHelp();
      GuidedTourManager.restart(st.admin.commercial ? 'commercial' : 'admin', null);
    });
    const restartBtn = qs('[data-action="help-tour-restart"]');
    if(restartBtn) restartBtn.addEventListener('click', function(){
      const st = StateManager.get();
      StateManager.closeHelp();
      GuidedTourManager.restart(st.admin.commercial ? 'commercial' : 'admin', null);
    });
    const closeBtn = qs('#helpCloseBtn');
    if(closeBtn) closeBtn.addEventListener('click', StateManager.closeHelp);
    const overlay = qs('#helpOverlay');
    if(overlay) overlay.addEventListener('keydown', function(e){ if(e.key==='Escape') StateManager.closeHelp(); });
    qsa('[data-help-topic]').forEach(function(btn){
      btn.addEventListener('click', function(){ StateManager.openHelp(btn.getAttribute('data-help-topic')); });
    });
  }

  return { render, bind, topicForCurrentScreen, INDEX };
})();


// ============================================================
// OnboardingManager — introducción breve de primer uso (general)
// y explicación específica al entrar por primera vez a cada modo.
// El estado de "ya visto" se guarda vía StorageAdapter, separado
// de las respuestas del participante.
// ============================================================
const OnboardingManager = (function(){
  const GENERAL_STEPS = [
    { title:'Elija qué desea hacer', body:'Puede responder el diagnóstico, conocer una demostración o acceder a las funciones internas de BVM.' },
    { title:'Su avance se guarda automáticamente', body:'Mientras utilice este mismo navegador y esta misma computadora, la herramienta guardará sus cambios automáticamente.' },
    { title:'Cree un respaldo antes de cambiar de equipo', body:'Si necesita trasladar la información a otra computadora, cree un respaldo desde Administración BVM.' },
    { title:'La ayuda siempre está disponible', body:'Use el botón Ayuda cuando necesite instrucciones sobre la pantalla o la acción que está realizando.' }
  ];
  const MODE_INTRO = {
    participant: { title:'Antes de comenzar', bullets:[
      'Se le pedirá su nombre completo. Sus respuestas quedarán asociadas a su nombre dentro del registro de esta familia; no se presentan como anónimas.',
      'Responderá 20 afirmaciones de manera individual. No existen respuestas correctas o incorrectas.',
      'Al final se le harán 2 preguntas adicionales que no modifican su calificación.',
      'Su avance se guarda automáticamente en este navegador.',
      'Podrá revisar sus respuestas antes de continuar.',
      'Una vez finalizada su participación, no podrá modificar sus respuestas.',
      'La radiografía familiar integra las percepciones de todos los participantes; no muestra calificaciones individuales por afirmación.'
    ]},
    commercial: { title:'Sobre esta demostración', bullets:[
      'Se utiliza una familia ficticia: Familia Horizonte.',
      'No modifica información real.',
      'Puede elegir un recorrido guiado o explorar libremente.',
      'Las cifras tienen un propósito demostrativo.',
      'El objetivo es mostrar cómo BVM convierte respuestas en conversaciones relevantes.'
    ]},
    admin: { title:'Administración BVM', bullets:[
      'Aquí prepara la demostración, crea y recupera respaldos, y genera el reporte.',
      'La información se guarda en el navegador de esta computadora.',
      'Guardar el reporte en PDF tiene su propia guía paso a paso.',
      'Algunas acciones eliminan o sustituyen información: siempre pedirán confirmación.',
      'Esta versión local no equivale a un sistema de producción.'
    ]}
  };

  function hasSeen(key){
    const s = StorageAdapter.loadPrototypeState() || {};
    return !!(s.onboardingSeen && s.onboardingSeen[key]);
  }
  function markSeen(key){
    const s = StorageAdapter.loadPrototypeState() || {};
    s.onboardingSeen = s.onboardingSeen || {};
    s.onboardingSeen[key] = true;
    StorageAdapter.savePrototypeState(s);
  }

  let queue = [];

  // Encadena pasos de onboarding sin mostrar dos a la vez. Cada paso se
  // muestra solo si no ha sido visto; al cerrarse, automáticamente se
  // muestra el siguiente pendiente de la cola.
  function runSequence(keys){
    queue = keys.slice();
    advance();
  }
  function advance(){
    if(StateManager.get().onboarding.active) return; // ya hay uno visible; se reintentará al cerrarlo
    while(queue.length){
      const next = queue.shift();
      const mode = next === 'general' ? null : next;
      const seenKey = next === 'general' ? 'general' : next;
      if(mode !== null && !MODE_INTRO[mode]) continue;
      if(!hasSeen(seenKey)){
        StateManager.startOnboarding(mode);
        return;
      }
    }
  }

  function render(ob){
    if(ob.mode){
      const intro = MODE_INTRO[ob.mode];
      const isCommercial = ob.mode === 'commercial';
      // v1.6.1 (sección 3.4): la guía es voluntaria en TODOS los modos. Antes
      // solo el modo comercial ofrecía elegir; en administración y participante
      // el recorrido arrancaba solo, sin opción previa de omitirlo.
      const actions =
        '<button class="btn btn-secondary" id="obExplore">Explorar libremente</button>' +
        '<button class="btn btn-primary" id="obGuided">Comenzar guía</button>';
      return (
      '<div class="modal-overlay" id="onboardingOverlay" role="dialog" aria-modal="true" aria-labelledby="obTitle">' +
        '<div class="modal-box onboarding-box">' +
          '<span class="eyebrow">Antes de continuar</span>' +
          '<h3 class="h3" id="obTitle" style="margin-top:6px;">'+escapeHtml(intro.title)+'</h3>' +
          '<ul class="onboarding-bullets">' + intro.bullets.map(function(b){ return '<li>'+escapeHtml(b)+'</li>'; }).join('') + '</ul>' +
          (isCommercial ? '<p class="body-text" style="font-size:12.5px;color:var(--bvm-soft-gray);margin-top:4px;">La demostración no utiliza ni modifica información de una familia real.</p>' : '') +
          '<label class="onboarding-dontshow"><input type="checkbox" id="obDontShow"> No iniciar automáticamente esta guía en futuras ocasiones</label>' +
          '<div class="modal-actions">' + actions + '</div>' +
        '</div>' +
      '</div>'
      );
    }
    const step = GENERAL_STEPS[ob.step];
    const isLast = ob.step === GENERAL_STEPS.length - 1;
    const dots = GENERAL_STEPS.map(function(s,i){ return '<span class="ob-dot'+(i===ob.step?' active':'')+'"></span>'; }).join('');
    return (
    '<div class="modal-overlay" id="onboardingOverlay" role="dialog" aria-modal="true" aria-labelledby="obTitle">' +
      '<div class="modal-box onboarding-box">' +
        '<span class="eyebrow">Paso '+(ob.step+1)+' de '+GENERAL_STEPS.length+'</span>' +
        '<h3 class="h3" id="obTitle" style="margin-top:6px;">'+escapeHtml(step.title)+'</h3>' +
        '<p class="body-text" style="margin-top:10px;">'+escapeHtml(step.body)+'</p>' +
        '<div class="ob-dots">'+dots+'</div>' +
        '<div class="modal-actions">' +
          (ob.step>0 ? '<button class="btn btn-secondary" id="obPrev">Anterior</button>' : '<button class="btn btn-secondary" id="obSkip">Omitir introducción</button>') +
          '<button class="btn btn-primary" id="obNext">'+(isLast?'Entendido, comenzar':'Siguiente')+'</button>' +
        '</div>' +
      '</div>' +
    '</div>'
    );
  }

  function bind(ob){
    const overlay = qs('#onboardingOverlay');
    if(ob.mode){
      const btn = qs('#obUnderstood');
      if(btn) btn.addEventListener('click', function(){ markSeen(ob.mode); StateManager.closeOnboarding(); advance(); });
      // v1.6.1: la casilla marca el recorrido como omitido para que no vuelva
      // a abrirse solo, sin impedir consultarlo después desde Ayuda.
      // v1.6.2 (sección 4): la casilla controla ÚNICAMENTE el arranque
      // automático. Elegir cualquiera de las dos acciones marca la pantalla
      // como vista; marcar la casilla añade la preferencia de no iniciarla
      // sola. Ninguna de las dos impide recuperarla desde Ayuda.
      function applyIntroChoice(mode){
        const cb = qs('#obDontShow');
        const key = mode === 'commercial' ? 'commercial' : (mode === 'participant' ? 'participant' : 'admin');
        const patch = { introSeen:true };
        if(cb && cb.checked) patch.noAutoStart = true;
        if(typeof GuidedTourManager !== 'undefined') GuidedTourManager.markTourState(key, patch);
      }
      const exploreBtn = qs('#obExplore');
      if(exploreBtn) exploreBtn.addEventListener('click', function(){ applyIntroChoice(ob.mode); markSeen(ob.mode); StateManager.closeOnboarding(); advance(); });
      const guidedBtn = qs('#obGuided');
      if(guidedBtn) guidedBtn.addEventListener('click', function(){
        applyIntroChoice(ob.mode);
        markSeen(ob.mode); StateManager.closeOnboarding(); queue=[];
        GuidedTourManager.start(ob.mode === 'commercial' ? 'commercial' : (ob.mode === 'participant' ? 'participant' : 'admin'), null);
      });
      if(overlay) overlay.addEventListener('keydown', function(e){ if(e.key==='Escape'){ markSeen(ob.mode); StateManager.closeOnboarding(); advance(); } });
      return;
    }
    const prev = qs('#obPrev'); if(prev) prev.addEventListener('click', function(){ StateManager.setOnboardingStep(ob.step-1); });
    const skip = qs('#obSkip'); if(skip) skip.addEventListener('click', function(){ markSeen('general'); StateManager.closeOnboarding(); advance(); });
    const next = qs('#obNext'); if(next) next.addEventListener('click', function(){
      if(ob.step === GENERAL_STEPS.length-1){ markSeen('general'); StateManager.closeOnboarding(); advance(); }
      else { StateManager.setOnboardingStep(ob.step+1); }
    });
    if(overlay) overlay.addEventListener('keydown', function(e){ if(e.key==='Escape'){ markSeen('general'); StateManager.closeOnboarding(); advance(); } });
  }

  function reopen(mode){ StateManager.startOnboarding(mode||null); }
  // v1.6.3 (sección 4.2): apertura FORZADA de la pantalla previa. Una petición
  // manual desde Ayuda debe ignorar introSeen y noAutoStart. Antes reutilizaba
  // la ruta automática, que decidía no mostrar nada porque la intro ya se
  // había visto: el botón parecía no hacer nada. No borra preferencias ni datos.
  function openModeIntro(mode){
    queue = [];
    StateManager.closeHelp();
    const raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn,16); };
    raf(function(){ StateManager.startOnboarding(mode); });
  }

  return { render, bind, runSequence, advance, reopen, openModeIntro };
})();

      title:'El siguiente paso',

  // v1.6.1 (sección 4.4): el entrenamiento práctico se conserva separado y no

  training: [

      body:'Recorrido operativo sobre la Familia Horizonte. Todo ocurre en el espacio de demostración: la información real no se modifica.' },
    { id:'tr-preparar', tab:'datos', targetSelector:'[data-action="load-demo"]', fallbackSelector:'.data-mgmt-grid', placement:'right', title:'1. Preparar la demostración',
      body:'Carga o restaura la Familia Horizonte. Es el punto de partida para practicar sin usar datos reales.',
      emptyStateBody:'Desde Administración BVM se prepara la demostración.' },

      body:'Comience siempre por aquí: la lectura ejecutiva resume qué conviene comprender primero.',
      emptyStateBody:'La síntesis aparecerá cuando existan participaciones finalizadas.' },
    { id:'tr-alineacion', tab:'alineacion', targetSelector:'[data-tour-target="alignment-matrix"]', fallbackSelector:'.admin-section', placement:'right', title:'3. Revisar la alineación',
      body:'El hallazgo que más suele sorprender: un promedio favorable puede ocultar que no todos leen igual la situación.',
      emptyStateBody:'Esta matriz cruza capacidad percibida con coincidencia.' },
    { id:'tr-reporte', tab:'sintesis', targetSelector:'[data-action="open-report"]', fallbackSelector:'.admin-topbar-inner', placement:'bottom', title:'4. Abrir el reporte',
      body:'Genera el documento de 12 páginas para imprimir o guardar como PDF.',
