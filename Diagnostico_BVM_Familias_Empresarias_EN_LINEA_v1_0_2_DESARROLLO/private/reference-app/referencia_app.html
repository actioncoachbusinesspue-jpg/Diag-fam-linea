  .dim-question-block p{ font-size:9.5pt !important; }
  .dim-chip{ font-size:7.8pt !important; padding:1mm 2mm !important; }

  /* Página 8 y 9: matrices acotadas, leyenda compacta. */
  .quadrant-svg-holder svg{ max-height:88mm !important; }
  .quadrant-legend{ font-size:8pt !important; gap:2mm !important; }
  .quadrant-legend-item{ padding:1mm 0 !important; }
  .matrix-scope-note, .align-warning{ font-size:7.8pt !important; }
  .findings-chain{ margin-top:3mm !important; }
  .findings-step{ padding:2.5mm 3mm !important; }
  .findings-step p{ font-size:8.6pt !important; }

  /* Página 10: la primera conversación domina; las otras compactas. */
  .priority-ranking{ padding:3mm 4mm !important; margin-bottom:3mm !important; }
  .priority-rank-row{ padding:1mm 0 !important; }
  .conv-card--primary{ padding-left:4mm !important; }
  .conv-card--compact{ margin-top:3mm !important; padding-left:4mm !important; }
  .conv-flow{ gap:2mm !important; }
  .conv-flow-step p, .conv-compact-finding, .conv-compact-risk{ font-size:8.6pt !important; }
  .conv-question-strip{ padding:2mm 3mm !important; }

  /* Página 11: ruta horizontal y módulos bajos. */
  .route-diagram{ margin-top:3mm !important; }
  .route-phase{ padding:3mm 3.5mm !important; }
  .route-phase-objective, .route-phase-detail, .route-phase-outcome-brief{ font-size:8.5pt !important; }
  .disposition-module{ padding:3mm 4mm !important; margin-top:3mm !important; }
  .ext-module{ padding:3mm 4mm !important; border:0 !important; }
  .ext-dist-bar-track{ height:14mm !important; }
  .ext-module-value{ font-size:20pt !important; }
  .ext-module-reading p{ font-size:8.5pt !important; }
  .dist-microlegend{ font-size:7.6pt !important; margin-top:2mm !important; padding-top:2mm !important; }

  /* Página 12: cierre con aire, sin cortarse. */
  .closing-synthesis{ gap:4mm !important; }
  .closing-synthesis-item p{ font-size:8.8pt !important; }
  .report-next-step{ margin-top:4mm !important; padding-top:3mm !important; }
  .report-next-step-title{ font-size:14pt !important; }
  .report-next-step-body{ font-size:9pt !important; }
  .method-footnote{ font-size:7.6pt !important; margin-top:3mm !important; }

  /* §7.2: densidad por página, solo si la medición lo exige. Nunca bajo 0.94. */
  .report-page.print-density-compact{ zoom:0.97; }
  .report-page.print-density-tight{ zoom:0.94; }
}

/* ============================================================
   v1.6.6 — CORRECCIONES SOBRE EVIDENCIA REAL DE NAVEGADOR.
   Las capas 1 y 2 funcionaron (12 hojas, secuencia correcta). Esta
   capa corrige lo que las capturas mostraron: portada sin fondo,
   gráficos ausentes en la página 3, y desbordes en 5, 6, 7, 8, 10 y 11.
   ============================================================ */
@media print{

  /* --- Portada: el fondo navy se perdía y el texto claro quedaba
     sobre blanco. print-color-adjust fuerza su impresión. --- */
  .report-page--cover{
    background:var(--bvm-navy) !important; color:#fff !important;

  /* v1.6.7 — CAUSA RAÍZ REAL del radar/barras ausentes en página 3.

  #report-page-indicadores .charts-stack{

  /* Margen de seguridad adicional: reducir el bloque combinado para que,

  .report-page svg, .report-page svg *{

  /* --- Páginas 4-7: se cortaban en la evidencia. Compactación mayor

  .dim-layer--evidencia{ padding:2.5mm 3mm !important; margin-top:2.5mm !important; }

  .dim-layer--lectura{ padding-top:2.5mm !important; margin-top:2.5mm !important; }

  /* --- Página 8: el titular se cortaba arriba. Encabezado más bajo. --- */

  /* --- Página 10: faltaba la conversación 03. Compactación fuerte

  #report-page-conversaciones .priority-ranking{ padding:2.5mm 3mm !important; margin-bottom:2.5mm !important; }
  #report-page-conversaciones .priority-rank-title{ font-size:8.6pt !important; }

  #report-page-conversaciones .conv-field-text, #report-page-conversaciones .conv-question-text{ font-size:8.4pt !important; }
  #report-page-conversaciones .conv-card--compact{ margin-top:2mm !important; padding-left:3mm !important; }

  /* v1.6.7 — MISMA causa raíz que el radar de la página 3: .conv-card--compact
     hereda break-inside:avoid (de .report-page-inner-break y de la regla de
     línea ~1176) y está redeclarado explícitamente en línea ~1238. La
     compactación de v1.6.6 redujo tamaños pero no evitó que, si el excedente
     seguía siendo mayor a cero, el navegador expulsara la tarjeta 03 entera
     en vez de acomodarla. Se retira de break-inside:avoid, igual que se

  #report-page-conversaciones .conv-card--compact{

  /* v1.6.10 — CAUSA RAÍZ del módulo "Disposición declarada" ausente: la
     página impresa (209mm ≈ 790px de ancho) cae por debajo del breakpoint
     responsive @media(max-width:860px) que colapsa .dim-grid-2 a una sola
     columna (pensado para tablet/celular, nunca para impresión). Eso
     duplicaba el alto necesario del bloque y empujaba el segundo módulo

  #report-page-evolucion .dim-grid-2{

/* ============================================================
   v1.6.11 — CIERRE DE IMPRESIÓN DINÁMICA.
   Corrección basada en la auditoría geométrica real con Chromium:
   con la caja física de 209×278 mm las páginas 2, 3, 8, 9 y 10
   seguían generando contenido más alto que la hoja (hasta +647 px),
   que Chromium recorta o derrama sobre la hoja siguiente.

   CAUSA RAÍZ PRINCIPAL: la hoja impresa mide ~790 px de ancho y cae
   por debajo del breakpoint responsive @media(max-width:860px), de modo
   que las retículas de dos columnas (.two-col, .glance-grid,
   .quadrant-legend) colapsaban a UNA columna en el papel — un layout
   pensado para tablet/celular que duplica la altura del contenido.
   Es el mismo patrón que v1.6.10 corrigió puntualmente para
   .dim-grid-2 en la página 11; aquí se corrige de forma sistemática.

   Además se define un área segura explícita por hoja con variables
   CSS y una ZONA RESERVADA para el pie: el pie queda anclado al borde
   inferior de la hoja y el contenido nunca puede ocupar su franja.
   No se oculta contenido, no se usa zoom global y la página 11
   conserva su composición aprobada.
   ============================================================ */
@media print{
  :root{
    /* Caja física compatible Carta/A4 (209×278 mm, igual que v1.6.5). */
    --print-page-width:209mm;
    --print-page-height:278mm;
    --print-padding-top:10mm;
    --print-padding-inline:12mm;
    /* Zona reservada del pie: margen inferior + altura del pie + separación.
       La caja del pie admite dos líneas de 8 pt: con nombres de familia
       largos el texto envuelve sin salirse de su zona reservada. */
    --print-footer-bottom:2mm;
    --print-footer-height:9mm;
    --print-footer-gap:2mm;
    /* Altura máxima real del contenido: 278−10−(2+9+2) = 255 mm. */
    --print-content-height:calc(var(--print-page-height) - var(--print-padding-top)
      - var(--print-footer-bottom) - var(--print-footer-height) - var(--print-footer-gap));
  }
  .report-page{
    width:var(--print-page-width) !important; max-width:var(--print-page-width) !important;
    height:var(--print-page-height) !important;
    min-height:var(--print-page-height) !important; max-height:var(--print-page-height) !important;
    padding:var(--print-padding-top) var(--print-padding-inline)
      calc(var(--print-footer-bottom) + var(--print-footer-height) + var(--print-footer-gap)) !important;
  }
  .report-page--cover{ padding:0 !important; }
  /* El pie vive anclado al borde inferior de la hoja: ya no depende de que
     el contenido "termine antes". La portada no lleva este pie. */
  .report-page__footer{
    position:absolute !important;
    left:var(--print-padding-inline) !important; right:var(--print-padding-inline) !important;
    bottom:var(--print-footer-bottom) !important; height:var(--print-footer-height) !important;
    box-sizing:border-box !important; margin:0 !important; padding-top:2mm !important;
    align-items:flex-start !important; overflow-wrap:anywhere; column-gap:5mm;
  }
  .report-page__footer span:last-child{ flex-shrink:0; white-space:nowrap; }
  /* Portada: la regla de v1.6.6 pintaba el texto de la etiqueta confidencial
     del MISMO color que su fondo (dorado claro sobre dorado claro), de modo
     que "Documento confidencial" se imprimía como una pastilla vacía. Se
     restituyen los colores reales de la etiqueta. */
  .report-page--cover .confidential-tag{
    color:var(--bvm-navy) !important; background:var(--bvm-light-gold) !important;
  }
  .report-page--cover .confidential-tag--demo{
    color:#fff !important; background:var(--bvm-gold) !important;
  }

  /* El banner de demostración compensaba el padding de PANTALLA (0.6/0.72 in);
     con el padding de impresión (10/12 mm) sobresalía 24 px de la hoja. */
  .report-demo-banner{
    margin:calc(-1 * var(--print-padding-top)) calc(-1 * var(--print-padding-inline)) 4mm !important;
  }

  /* --- CAUSA RAÍZ: restaurar las retículas de escritorio en el papel.
         El breakpoint móvil (≤860px) nunca debe aplicar a una hoja impresa. --- */
  .report-page .two-col{ grid-template-columns:1fr 1fr !important; gap:4mm !important; }
  .report-page .glance-grid{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
  .report-page .quadrant-legend{ grid-template-columns:repeat(2,minmax(0,1fr)) !important; gap:1.5mm 4mm !important; }
  .report-page .matrix-grid{ grid-template-columns:repeat(4,1fr) !important; }
  .report-page .dim-grid-2{ grid-template-columns:1fr 1fr !important; }

  /* --- Robustez ante nombres y textos variables: los textos largos parten
         y guionan dentro de su caja en lugar de desbordarla. --- */
  .report-page h1, .report-page h2, .report-page h3, .report-page h4,
  .report-cover-family, .report-cover-meta, .q-list-item span,
  .priority-rank-title, .conv-card h4, .dim-mini-text, .ind-value{
    overflow-wrap:anywhere; hyphens:auto;
  }

  /* --- Página 2 (síntesis ejecutiva): con la retícula 2×2 restaurada el
         bloque "En una mirada" recupera su proporción; se compactan las
         tarjetas para que la narrativa completa y el pie convivan en la hoja
         incluso con textos dinámicos largos. --- */
  #report-page-sintesis .at-a-glance{ padding:4mm 5mm !important; margin-bottom:3mm !important; }
  #report-page-sintesis .glance-grid{ margin:2mm 0 1mm !important; }
  #report-page-sintesis .glance-grid > div{ padding:1.5mm 4mm !important; }
  #report-page-sintesis .glance-grid .dim-mini-text{ font-size:8.6pt !important; line-height:1.25 !important; }
  #report-page-sintesis .glance-grid .dim-mini-label{ font-size:7.5pt !important; margin-bottom:1mm !important; }
  #report-page-sintesis .narrative-block{ padding:4mm 5mm !important; }
  #report-page-sintesis .narrative-block p{ font-size:9pt !important; line-height:1.3 !important; margin-bottom:2mm !important; }

  /* --- Página 3 (lectura general): el exceso medido (40–64 px) es contenido
         real (la lectura ejecutiva y el pie quedaban bajo el borde). Se
         reducen ligeramente los visuales sin perder etiquetas. --- */
  #report-page-indicadores .indicator-grid{ margin-top:2.5mm !important; gap:2.5mm !important; }
  #report-page-indicadores .indicator-card{ padding:2mm 3mm !important; }
  #report-page-indicadores .indicator-card--primary .ind-value{ font-size:20pt !important; }
  #report-page-indicadores .radar-wrap svg{ max-height:68mm !important; }
  #report-page-indicadores .bars-wrap svg{ max-height:35mm !important; }
  #report-page-indicadores .charts-stack{ margin-top:2.5mm !important; gap:2mm !important; }
  #report-page-indicadores .bars-wrap{ padding:2mm 0 0 !important; margin-top:1mm !important; }
  #report-page-indicadores .bars-wrap-title{ margin-bottom:1.5mm !important; font-size:7.5pt !important; }
  #report-page-indicadores .chart-note{ margin-top:1.5mm !important; font-size:7.5pt !important; }
  #report-page-indicadores .exec-takeaway{ margin-top:2.5mm !important; padding-top:2mm !important; }
  #report-page-indicadores .exec-takeaway p{ font-size:8.6pt !important; line-height:1.3 !important; }

  /* --- Página 8 (alineación): rediseño editorial de impresión. El visual
         principal pasa a ocupar una retícula de dos columnas (matriz a la
         izquierda, leyenda con los valores a la derecha) y las listas de
         coincidencia/dispersión recuperan sus dos columnas. Todo el
         contenido se conserva. --- */
  #report-page-alineacion .report-page__header{ margin-bottom:2mm !important; }
  #report-page-alineacion .align-summary{ margin-bottom:2mm !important; gap:2.5mm !important; }
  #report-page-alineacion .align-summary .indicator-card{ padding:1.5mm 3mm !important; }
  #report-page-alineacion .align-summary .ind-value{ font-size:10pt !important; margin-top:1mm !important; }
  #report-page-alineacion .dim-layer{ margin-top:1.5mm !important; padding-top:1mm !important; }
  #report-page-alineacion .quadrant-wrap{
    display:grid !important; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr) !important;
    gap:2mm 4mm !important; align-items:center !important;
    padding:2mm 3mm !important; margin-top:1mm !important;
  }
  #report-page-alineacion .quadrant-svg-holder svg{ max-height:58mm !important; }
  /* Compensación tipográfica: al reducir la matriz respecto de pantalla, las
     etiquetas internas del SVG se agrandan en el viewBox para conservar (o
     mejorar) la legibilidad impresa que tenían en v1.6.10. */
  #report-page-alineacion .quadrant-svg-holder svg text[font-size="9.5"]{ font-size:13px !important; }
  #report-page-alineacion .quadrant-svg-holder svg text[font-size="12.5"]{ font-size:15px !important; }
  #report-page-alineacion .quadrant-svg-holder svg text[font-size="11"]{ font-size:13.5px !important; }
  #report-page-alineacion .quadrant-legend{
    grid-template-columns:1fr !important; margin-top:0 !important; gap:1mm !important;
  }
  #report-page-alineacion .quadrant-legend-item{ padding:0 !important; font-size:8pt !important; }
  #report-page-alineacion .quadrant-legend-item strong{ font-size:8pt !important; }
  #report-page-alineacion .body-text{ font-size:8pt !important; margin-bottom:1mm !important; line-height:1.25 !important; }
  #report-page-alineacion .matrix-question{ margin-top:1mm !important; }
  #report-page-alineacion .bvm-emphasis{ padding:2mm 3.5mm !important; margin-top:1.5mm !important; }
  #report-page-alineacion .bvm-emphasis p{ font-size:8.5pt !important; line-height:1.25 !important; margin-bottom:0 !important; }
  #report-page-alineacion .two-col{ margin-top:2mm !important; }
  #report-page-alineacion .q-list-card{ padding:2mm 3mm !important; }
  #report-page-alineacion .q-list-card .h3{ font-size:9pt !important; margin-bottom:1mm !important; }
  #report-page-alineacion .q-list-item{ padding:1mm 0 !important; font-size:8.5pt !important; gap:2mm !important; line-height:1.22 !important; }
  #report-page-alineacion .card--question{ margin-top:1.5mm !important; padding:2mm 3.5mm !important; }
  #report-page-alineacion .card--question .dim-mini-text{ font-size:9pt !important; }
  #report-page-alineacion .card--question .dim-mini-label{ margin-bottom:0.8mm !important; }
  #report-page-alineacion .align-warning{ padding:1.5mm 2.5mm !important; margin-bottom:2mm !important; }

  /* --- Página 9 (riesgo y oportunidad): misma gramática editorial. Matriz y
         leyenda en dos columnas; la cadena hallazgo→implicación→riesgo→foco
         pasa a retícula de 2×2 con sus cuatro pasos completos ("Hallazgo" e
         "Implicación" en columnas paralelas). Los conectores "↓" son glifos
         puramente decorativos (aria-hidden, sin texto informativo) y en la
         retícula apuntarían en una dirección incorrecta: se retiran solo en
         impresión — ver justificación en resumen_cambios.md. --- */
  #report-page-riesgo .matrix-question{ margin-top:2mm !important; }
  #report-page-riesgo .quadrant-wrap{
    display:grid !important; grid-template-columns:minmax(0,1.12fr) minmax(0,1fr) !important;
    gap:2mm 4mm !important; align-items:center !important;
    padding:2.5mm 3mm !important; margin-top:1.5mm !important;
  }
  #report-page-riesgo .quadrant-svg-holder svg{ max-height:66mm !important; }
  /* Compensación tipográfica de las etiquetas internas del SVG (ver pág. 8). */
  #report-page-riesgo .quadrant-svg-holder svg text[font-size="11"]{ font-size:13px !important; }
  #report-page-riesgo .quadrant-svg-holder svg text[font-size="11.5"]{ font-size:13px !important; }
  #report-page-riesgo .body-text{ font-size:8.5pt !important; line-height:1.25 !important; }
  #report-page-riesgo .matrix-scope-note{ margin-top:1mm !important; }
  #report-page-riesgo .quadrant-legend{ grid-template-columns:1fr !important; margin-top:0 !important; gap:1.2mm !important; }
  #report-page-riesgo .quadrant-legend-item{ padding:0 !important; font-size:8.5pt !important; }
  #report-page-riesgo .bvm-emphasis{ padding:2.5mm 4mm !important; margin-top:2mm !important; }
  #report-page-riesgo .bvm-emphasis p{ font-size:8.5pt !important; line-height:1.28 !important; }
  #report-page-riesgo .bvm-emphasis h3{ font-size:11pt !important; margin-top:1mm !important; }
  #report-page-riesgo .matrix-reading-value{ font-size:10.5pt !important; }
  #report-page-riesgo .matrix-reframe-note{ font-size:8.5pt !important; margin-top:1.5mm !important; }
  #report-page-riesgo .findings-chain{
    display:grid !important; grid-template-columns:1fr 1fr !important;
    gap:2mm !important; max-width:none !important; margin-top:2mm !important;
  }
  #report-page-riesgo .findings-arrow{ display:none !important; }
  #report-page-riesgo .findings-step{ padding:2mm 3mm !important; }
  #report-page-riesgo .findings-step p{ font-size:8.5pt !important; line-height:1.28 !important; }
  #report-page-riesgo .findings-step-label{ font-size:7.5pt !important; margin-bottom:0.8mm !important; }
  #report-page-riesgo .card--technical{ margin-top:2mm !important; padding:2mm 3mm !important; font-size:7.5pt !important; }

  /* --- Página 10 (conversaciones prioritarias): la conversación principal a
         ancho completo y las secundarias en columnas paralelas. El motor
         genera 3 o 4 conversaciones según los datos: con dos secundarias se
         usan dos columnas; con tres (caso de datos reales variables), tres
         columnas, para que cada tarjeta aparezca completa con su encabezado,
         explicación, riesgo y pregunta. --- */
  #report-page-conversaciones .report-page__content{
    display:grid !important; grid-template-columns:repeat(6,minmax(0,1fr)) !important;
    gap:1.5mm 3mm !important; align-content:start !important;
  }

// ============================================================
// normalizeLikert — convierte una respuesta de escala 1-5 a una
// intensidad de 0 a 1, para uso interno en cálculos compuestos.
// 1 → 0.00, 2 → 0.25, 3 → 0.50, 4 → 0.75, 5 → 1.00
// ============================================================
function normalizeLikert(value){
  const numericValue = Number(value);
  if(!Number.isFinite(numericValue)) return 0;
  const clampedValue = Math.min(5, Math.max(1, numericValue));
  return (clampedValue - 1) / 4;
}
// v1.0: índice de madurez 0-100. Fórmula oficial: ((promedio - 1) / 4) * 100.
function toMaturityIndex(rawAverage1to5){
  return round2(normalizeLikert(rawAverage1to5) * 100);
}

function getMaturityLevel(index0to100){

function getRiskOpportunityQuadrant(x, y){
  for(const id in RISK_OPPORTUNITY_QUADRANTS){
    const q = RISK_OPPORTUNITY_QUADRANTS[id];
    const inX = x >= q.xRange[0] && x <= q.xRange[1];
    const inY = y >= q.yRange[0] && y <= q.yRange[1];
    if(inX && inY) return q;
  }
  return RISK_OPPORTUNITY_QUADRANTS.consolidar;
}
function getDispersionLevel(sd){
  for(const l of SCORING_CONFIG.dispersionLevels){ if(sd >= l.min && sd <= l.max) return l; }

}

// MVP LOCAL BVM:
// Este adaptador utiliza localStorage.
// En producción se sustituirá por una API conectada
// a PHP y MySQL/MariaDB en Hostinger.

// ============================================================
// STORAGE_NAMESPACES — espacios de almacenamiento completamente
// independientes. "real" y "demo" nunca se leen ni escriben de forma
// cruzada. "ui" guarda únicamente preferencias de interfaz (onboarding
// visto, ayuda de impresión descartada), nunca datos familiares.
// ============================================================
const STORAGE_NAMESPACES = {
  real: 'bvm_familias_real_v1_',
  demo: 'bvm_familias_demo_v1_',
  ui: 'bvm_familias_ui_v1_'
};

const StorageNamespaceManager = (function(){
  let current = 'real';
  function setNamespace(ns){
    if(!STORAGE_NAMESPACES[ns]) throw new Error('Namespace desconocido: ' + ns);
    current = ns;
  }
  function getNamespace(){ return current; }
  function getPrefix(ns){ return STORAGE_NAMESPACES[ns || current]; }
  return { setNamespace, getNamespace, getPrefix };
})();

// Normaliza un nombre para comparar (mayúsculas/minúsculas y espacios no
// deben crear dos participantes distintos para la misma persona).
function normalizeName(name){
  return String(name||'').trim().replace(/\s+/g,' ').toLowerCase();
}

const StorageAdapter = (function(){
  function testAvailability(){
    try{
      const testKey = STORAGE_NAMESPACES.ui + '__probe__';
      localStorage.setItem(testKey, '1');
      const read = localStorage.getItem(testKey);
      localStorage.removeItem(testKey);
      return read === '1';
    }catch(e){ return false; }
  }
  let memoryFallback = !testAvailability();
  const memoryStore = {};
  function isUsingMemoryFallback(){ return memoryFallback; }

  function k(ns, key){ return StorageNamespaceManager.getPrefix(ns) + key; }
  function readRaw(ns, key){
    try{
      const fullKey = k(ns, key);
      if(memoryFallback) return memoryStore.hasOwnProperty(fullKey) ? JSON.parse(memoryStore[fullKey]) : null;
      const v = localStorage.getItem(fullKey);
      return v ? JSON.parse(v) : null;
    }catch(e){ InternalLogger.log('storage-read-error', { ns:ns, key:key }); return null; }
  }
  function writeRaw(ns, key, value){
    try{
      const fullKey = k(ns, key);
      if(memoryFallback){ memoryStore[fullKey] = JSON.stringify(value); return true; }
      localStorage.setItem(fullKey, JSON.stringify(value));
      return true;
    }catch(e){ InternalLogger.log('storage-write-error', { ns:ns, key:key }); return false; }
  }
  function removeRaw(ns, key){
    try{
      const fullKey = k(ns, key);
      if(memoryFallback){ delete memoryStore[fullKey]; return true; }
      localStorage.removeItem(fullKey); return true;
    }catch(e){ return false; }
  }

  // ============================================================
  // v1.0: estructura multi-familia por namespace.
  // { families: [ { familyId, familyName, questionnaireVersion, createdAt,
  //                 expectedParticipants, reportDate, archived, participants: [...] } ],
  //   activeFamilyId }
  // ============================================================
  function loadStore(ns){
    ns = ns || StorageNamespaceManager.getNamespace();
    const store = readRaw(ns, 'families_store');
    return store || { families: [], activeFamilyId: null };
  }
  function saveStore(store, ns){
    ns = ns || StorageNamespaceManager.getNamespace();
    return writeRaw(ns, 'families_store', store);
  }

  function listFamilies(ns){
    const store = loadStore(ns);
    return store.families.filter(function(f){ return !f.archived; }).map(function(f){
      const finished = f.participants.filter(function(p){ return p.status==='finalizado'; }).length;
      return { familyId:f.familyId, familyName:f.familyName, participantCount:f.participants.length, finishedCount:finished, createdAt:f.createdAt, reportDate:f.reportDate };
    });
  }
  function createFamily(familyName){
    const store = loadStore();
    const familyId = uid('fam');
    store.families.push({
      familyId: familyId, familyName: familyName, questionnaireVersion: APP_CONFIG.questionnaireVersion,
      createdAt: new Date().toISOString(), expectedParticipants: null, reportDate: new Date().toISOString().slice(0,10),
      archived: false, participants: []
    });
    store.activeFamilyId = familyId;
    saveStore(store);
    InternalLogger.log('create-family', { familyId: familyId });
    return familyId;
  }
  function renameFamily(familyId, newName){
    const store = loadStore();
    const f = store.families.filter(function(x){ return x.familyId===familyId; })[0];
    if(!f) return false;
    f.familyName = newName;
    return saveStore(store);
  }
  function archiveFamily(familyId){
    const store = loadStore();
    const f = store.families.filter(function(x){ return x.familyId===familyId; })[0];
    if(!f) return false;
    f.archived = true;
    if(store.activeFamilyId === familyId) store.activeFamilyId = (store.families.filter(function(x){ return !x.archived; })[0]||{}).familyId || null;
    return saveStore(store);
  }
  function deleteFamily(familyId){
    const store = loadStore();
    store.families = store.families.filter(function(x){ return x.familyId!==familyId; });
    if(store.activeFamilyId === familyId) store.activeFamilyId = (store.families[0]||{}).familyId || null;
    return saveStore(store);
  }
  function setActiveFamily(familyId){
    const store = loadStore();
    if(!store.families.some(function(f){ return f.familyId===familyId; })) return false;
    store.activeFamilyId = familyId;
    return saveStore(store);
  }
  function getActiveFamily(){
    const store = loadStore();
    if(!store.activeFamilyId) return null;
    return store.families.filter(function(f){ return f.familyId===store.activeFamilyId; })[0] || null;
  }
  function getFamily(familyId){
    const store = loadStore();
    return store.families.filter(function(f){ return f.familyId===familyId; })[0] || null;
  }

  // ---- Participantes (siempre dentro de la familia activa) ----

  function findParticipantByName(name){
    const fam = getActiveFamily();
    if(!fam) return null;
    const norm = normalizeName(name);
    return fam.participants.filter(function(p){ return normalizeName(p.participantName)===norm; })[0] || null;
  }
  function createParticipant(info){
    const store = loadStore();
    const fam = store.families.filter(function(f){ return f.familyId===store.activeFamilyId; })[0];
    if(!fam) return null;
    const participantId = uid('p');
    const participant = {
      participantId: participantId, participantName: info.name, familyId: fam.familyId, familyName: fam.familyName,
      generation: info.generation||'', participationRole: info.participationRole||'',
      questionnaireVersion: APP_CONFIG.questionnaireVersion,
      answers: new Array(20).fill(null), externalAnswers: {},
      status: 'en_proceso', currentIndex: 0,
      createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), completedAt: null
    };
    fam.participants.push(participant);
    saveStore(store);
    return participant;
  }
  function loadParticipant(participantId){
    const fam = getActiveFamily();
    if(!fam) return null;
    return fam.participants.filter(function(p){ return p.participantId===participantId; })[0] || null;
  }
  function saveParticipantAnswers(participantId, patch){
    const store = loadStore();
    const fam = store.families.filter(function(f){ return f.familyId===store.activeFamilyId; })[0];
    if(!fam) return false;
    const p = fam.participants.filter(function(x){ return x.participantId===participantId; })[0];
    if(!p) return false;
    // Un participante ya finalizado nunca se sobrescribe.
    if(p.status === 'finalizado') return false;
    Object.assign(p, patch, { updatedAt: new Date().toISOString() });
    return saveStore(store);
  }
  function completeParticipant(participantId, patch){
    const store = loadStore();
    const fam = store.families.filter(function(f){ return f.familyId===store.activeFamilyId; })[0];
    if(!fam) return false;
    const p = fam.participants.filter(function(x){ return x.participantId===participantId; })[0];
    if(!p) return false;
    if(p.status === 'finalizado') return false;
    Object.assign(p, patch, { status:'finalizado', completedAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    return saveStore(store);
  }
  function loadActiveFamilyParticipants(){
    const fam = getActiveFamily();
    return fam ? fam.participants.slice() : [];
  }
  function saveFamilyConfiguration(cfg){
    const store = loadStore();
    const fam = store.families.filter(function(f){ return f.familyId===store.activeFamilyId; })[0];
    if(!fam) return false;
    if(cfg.familyName != null) fam.familyName = cfg.familyName;
    if(cfg.expectedParticipants != null) fam.expectedParticipants = cfg.expectedParticipants;
    if(cfg.reportDate != null) fam.reportDate = cfg.reportDate;
    return saveStore(store);
  }
  function loadFamilyConfiguration(){
    const fam = getActiveFamily();
    if(!fam) return {};
    return { familyId: fam.familyId, familyName: fam.familyName, expectedParticipants: fam.expectedParticipants, reportDate: fam.reportDate, createdAt: fam.createdAt };
  }
  // Alias de compatibilidad con vistas existentes.
  function loadFamilyResults(){ return loadActiveFamilyParticipants(); }

  // Estado de interfaz (onboarding visto, avisos descartados): namespace "ui"
  // fijo, nunca datos familiares, compartido entre modos.
  function savePrototypeState(state){ return writeRaw('ui', 'ui_state', state); }
  function loadPrototypeState(){ return readRaw('ui', 'ui_state'); }

  // ---- Respaldo: exclusivamente sobre la familia REAL activa ----

  function exportBackup(){
    const fam = getActiveFamily();
    const backup = {
      appName: APP_CONFIG.appName,
      schemaVersion: APP_CONFIG.schemaVersion,
      storageArchitectureVersion: APP_CONFIG.storageArchitectureVersion,
      questionnaireVersion: APP_CONFIG.questionnaireVersion,
      appVersion: APP_CONFIG.appVersion,
      backupType: 'real-family-data',
      exportDate: new Date().toISOString(),
      family: fam
    };
    InternalLogger.log('export-backup', { familyName: fam ? fam.familyName : null });
    return backup;
  }

  function importBackup(json){
    const val = ValidationEngine.validateBackup(json);
    if(!val.ok) return { ok:false, error: val.error };
    const migrated = migrateBackupToCurrentVersion(json);
    if(migrated._isLegacy){
      // Cuestionario/escala distintos: se guarda aparte, nunca se mezcla con
      // las familias activas ni participa en ningún cálculo v1.0.
      const legacyList = readRaw('real', 'legacy_backups') || [];
      legacyList.push({ importedAt: new Date().toISOString(), schemaVersion: migrated._migratedFrom, data: migrated });
      writeRaw('real', 'legacy_backups', legacyList);
      InternalLogger.log('import-backup-legacy', { fromVersion: migrated._migratedFrom });
      return { ok:true, legacy:true, migratedFrom: migrated._migratedFrom };
    }
    const store = loadStore('real');
    const idx = store.families.findIndex(function(f){ return f.familyId === migrated.family.familyId; });
    if(idx >= 0) store.families[idx] = migrated.family; else store.families.push(migrated.family);
    store.activeFamilyId = migrated.family.familyId;
    saveStore(store, 'real');
    InternalLogger.log('import-backup', { migratedFrom: migrated._migratedFrom });
    return { ok:true, legacy:false, migratedFrom: migrated._migratedFrom };
  }

  // Borra ÚNICAMENTE el espacio de trabajo real (todas las familias reales). Nunca toca demo.
  function clearRealData(){
    saveStore({ families: [], activeFamilyId: null }, 'real');
    InternalLogger.log('clear-real-data', {});
    return true;
  }

  // ---- Familia Horizonte: exclusivamente en DEMO, aislada de real ----

  function ensureDemoDataset(){
    const store = loadStore('demo');
    if(store.families.length){ return true; }
    return writeDemoDataset();
  }
  function writeDemoDataset(){
    saveStore({ families: [SAMPLE_FAMILY_DATA_v1()], activeFamilyId: SAMPLE_FAMILY_DATA.familyId }, 'demo');
    InternalLogger.log('write-demo-dataset', {});
    return true;
  }
  function resetDemoDataset(){
    saveStore({ families: [] , activeFamilyId: null }, 'demo');
    InternalLogger.log('reset-demo-dataset', {});
    return writeDemoDataset();
  }
  function isDemoDatasetReady(){
    const store = loadStore('demo');
    return store.families.length > 0;
  }
  function loadDemoData(){ return ensureDemoDataset(); }
  function isDemoLoaded(){ return isDemoDatasetReady(); }
  function resetDemo(){ return resetDemoDataset(); }
  function clearPrototypeData(){ return clearRealData(); }

  return {
    listFamilies, createFamily, renameFamily, archiveFamily, deleteFamily,
    setActiveFamily, getActiveFamily, getFamily,
    findParticipantByName, createParticipant, loadParticipant,
    saveParticipantAnswers, completeParticipant, loadActiveFamilyParticipants,
    saveFamilyConfiguration, loadFamilyConfiguration, loadFamilyResults,
    savePrototypeState, loadPrototypeState,
    exportBackup, importBackup, clearRealData, clearPrototypeData,
    ensureDemoDataset, resetDemoDataset, isDemoDatasetReady,
    loadDemoData, isDemoLoaded, resetDemo,
    isUsingMemoryFallback, readRaw, writeRaw, loadStore, saveStore
  };
})();

// ============================================================
// Utilidades generales
// ============================================================
function uid(prefix){ return (prefix||'id') + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, function(c){
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
  });
}
function fmtDate(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('es-MX', { day:'2-digit', month:'long', year:'numeric' });
  }catch(e){ return iso; }
}
function fmtDateTime(iso){
  if(!iso) return '—';
  try{
    const d = new Date(iso);
    return d.toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }catch(e){ return iso; }
}
function round2(n){ return Math.round(n*100)/100; }
function mean(arr){ if(!arr.length) return 0; return arr.reduce(function(a,b){return a+b;},0)/arr.length; }
function stdDev(arr){
  if(arr.length < 2) return 0;
  const m = mean(arr);
  const variance = mean(arr.map(function(x){ return Math.pow(x-m,2); }));
  return Math.sqrt(variance);
}
let _toastTimer = null;
function showToast(msg){
  const t = qs('#globalToast');
  if(!t) return;
  t.querySelector('.toast-msg').textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

// ============================================================
// ValidationEngine
// ============================================================
// ============================================================
// migrateBackupToCurrentVersion — trae un respaldo de una versión anterior
// (por ejemplo v0.2, schemaVersion 3) a la estructura actual, conservando
// toda la información y añadiendo campos nuevos con valores predeterminados.
// No se pierde información; nunca se descartan respuestas, códigos,
// generación, participación o fecha del reporte ya guardados.
// ============================================================
// ============================================================
// migrateBackupToCurrentVersion — v1.0: el cuestionario y la escala
// cambiaron por completo. Un respaldo de una versión anterior a la 5
// (pre-v1.0) NUNCA se reinterpreta como si fuera v1.0 — se marca como
// legacy y se conserva aparte, fuera de los cálculos activos.
// ============================================================
function migrateBackupToCurrentVersion(data){
  const migrated = JSON.parse(JSON.stringify(data)); // copia profunda, no muta el original
  const fromVersion = migrated.schemaVersion || 0;
  const fromQuestionnaireVersion = migrated.questionnaireVersion || migrated.family && migrated.family.questionnaireVersion || null;

  // v1.3: A9 y A18 cambiaron de significado operativo aunque la ESTRUCTURA
  // técnica (schemaVersion) no cambió. Un respaldo de BVM-FE-1.0 nunca se
  // reinterpreta silenciosamente como BVM-FE-1.1 — se trata como legacy igual
  // que un cambio estructural, aunque su schemaVersion coincida.
  const questionnaireMismatch = fromQuestionnaireVersion && fromQuestionnaireVersion !== APP_CONFIG.questionnaireVersion;

  if(fromVersion < APP_CONFIG.schemaVersion || questionnaireMismatch){
    // Cuestionario y escala distintos: se conserva como legacy, sin usarse en cálculos.
    migrated._migratedFrom = fromVersion;
    migrated._migratedFromQuestionnaire = fromQuestionnaireVersion;
    migrated._isLegacy = true;
    return migrated;
  }

  migrated.family = migrated.family || { familyId: uid('fam'), familyName:'Familia sin nombre', archived:false, participants:[] };
  migrated.family.participants = (migrated.family.participants || []).map(function(p){
    p.answers = p.answers || new Array(20).fill(null);
    p.externalAnswers = p.externalAnswers || {};
    p.status = p.status || 'en_proceso';
    p.currentIndex = (typeof p.currentIndex === 'number') ? p.currentIndex : 0;
    return p;
  });
  if(!migrated.family.reportDate) migrated.family.reportDate = new Date().toISOString().slice(0,10);

  migrated.schemaVersion = APP_CONFIG.schemaVersion;
  migrated.appVersion = APP_CONFIG.appVersion;
  migrated._migratedFrom = fromVersion;
  migrated._isLegacy = false;
  return migrated;
}

const ValidationEngine = {
  isAnswerValid: function(v){
    return typeof v === 'number' && v>=1 && v<=5 && Number.isInteger(v);
  },
  isParticipantComplete: function(responses){
    if(!responses || responses.length !== 20) return false;
    for(let i=0;i<20;i++){ if(!this.isAnswerValid(responses[i])) return false; }
    return true;
  },
  validateBackup: function(json){
    try{
      if(!json || typeof json !== 'object') return { ok:false, error:'El archivo no contiene un formato reconocible.' };
      if(json.appName !== APP_CONFIG.appName) return { ok:false, error:'El respaldo no corresponde a esta aplicación (Diagnóstico BVM para Familias Empresarias).' };
      if(json.backupType === 'demo-data'){
        return { ok:false, error:'Este archivo pertenece a una demostración y no puede recuperarse como información real.' };
      }
      if(typeof json.schemaVersion !== 'number'){
        return { ok:false, error:'El respaldo no indica una versión de estructura reconocible.' };
      }
      if(json.schemaVersion > APP_CONFIG.schemaVersion){
        return { ok:false, error:'Este respaldo fue creado con una versión más reciente del prototipo (versión de estructura '+json.schemaVersion+') y no puede leerse desde esta versión (versión de estructura '+APP_CONFIG.schemaVersion+').' };
      }
      // Respaldo v1.0 (estructura por familia): valida las respuestas si están presentes.
      // Un respaldo de una versión anterior (estructura distinta, cuestionario de 21
      // preguntas) se acepta aquí sin validar sus respuestas — se tratará como legacy
      // en migrateBackupToCurrentVersion y nunca se reinterpretará como v1.0.
      if(json.schemaVersion === APP_CONFIG.schemaVersion){
        if(!json.family || !Array.isArray(json.family.participants)){
          return { ok:false, error:'El respaldo no contiene información de familia válida.' };
        }
        for(const p of json.family.participants){
          if(p.answers && p.answers.length){
            for(const v of p.answers){ if(v!=null && !this.isAnswerValid(v)) return { ok:false, error:'Se encontraron valores de respuesta fuera del rango permitido (1 a 5).' }; }
          }
        }
      }
      return { ok:true };
    }catch(e){
      return { ok:false, error:'No fue posible leer el archivo. Verifique que sea un respaldo JSON válido generado por este prototipo.' };
    }
  }
};


// ============================================================
// ScoringEngine — calcula madurez por dimensión (v1.0: 20 afirmaciones,
// sin señales especiales). El índice general y los índices por dimensión
// se expresan en escala 0-100 mediante toMaturityIndex(); los promedios
// crudos 1-5 se conservan para identificar afirmaciones específicas.
// ============================================================
const ScoringEngine = {
  computeQuestionAverages: function(participants){
    const finished = participants.filter(function(p){ return ValidationEngine.isParticipantComplete(p.answers); });
    const avgs = [];
    for(let q=0; q<20; q++){
      const vals = finished.map(function(p){ return p.answers[q]; });
      avgs.push(round2(mean(vals)));
    }
    return avgs;
  },
  // Promedios crudos 1-5 por dimensión — se usan para identificar afirmaciones
  // específicas (más fuerte/más débil) y para mostrar chips de evidencia.
  computeDimensionScores: function(questionAverages){
    const result = {};
    for(const dimId in SCORING_CONFIG.maturityQuestions){
      const qIds = SCORING_CONFIG.maturityQuestions[dimId];
      const vals = qIds.map(function(qid){ return questionAverages[qid-1]; });
      result[dimId] = round2(mean(vals));
    }
    return result;
  },
  // v1.0: índices por dimensión normalizados a 0-100 — ((promedio-1)/4)*100.
  computeNormalizedDimensionScores: function(dimensionScores){
    const result = {};
    for(const dimId in dimensionScores){ result[dimId] = toMaturityIndex(dimensionScores[dimId]); }
    return result;
  },
  // v1.0: índice general = promedio simple de los cuatro índices dimensionales
  // YA normalizados a 0-100 (no de los promedios crudos 1-5).
  computeGeneralIndex: function(normalizedDimensionScores){
    const vals = Object.keys(normalizedDimensionScores).map(function(k){ return normalizedDimensionScores[k]; });
    return round2(mean(vals));
  },
  // Preguntas externas: se promedian por separado y NUNCA entran a dimensionScores,
  // generalIndex, el radar, la matriz ni el orden de brechas.
  computeExternalQuestionAverages: function(participants){
    const finished = participants.filter(function(p){ return ValidationEngine.isParticipantComplete(p.answers); });
    const out = {};
    QUESTIONNAIRE.externalQuestions.forEach(function(eq){
      const vals = finished.map(function(p){ return p.externalAnswers ? p.externalAnswers[eq.id] : null; }).filter(function(v){ return v!=null; });
      out[eq.key] = vals.length ? round2(mean(vals)) : null;
    });
    return out;
  },
  buildFullScoring: function(participants){
    const questionAverages = this.computeQuestionAverages(participants);
    const dimensionScores = this.computeDimensionScores(questionAverages);
    const normalizedDimensionScores = this.computeNormalizedDimensionScores(dimensionScores);
    const generalIndex = this.computeGeneralIndex(normalizedDimensionScores);
    const externalQuestionAverages = this.computeExternalQuestionAverages(participants);
    return {
      questionAverages: questionAverages, dimensionScores: dimensionScores,
      normalizedDimensionScores: normalizedDimensionScores, generalIndex: generalIndex,
      externalQuestionAverages: externalQuestionAverages
    };
  }
};

// ============================================================
// AlignmentEngine — coincidencia y dispersión de percepción
// ============================================================
const AlignmentEngine = {
  computeQuestionDispersion: function(participants){
    const finished = participants.filter(function(p){ return ValidationEngine.isParticipantComplete(p.answers); });
    const sds = [];
    for(let q=0; q<20; q++){
      const vals = finished.map(function(p){ return p.answers[q]; });
      sds.push(round2(stdDev(vals)));
    }
    return sds;
  },
  computeDimensionDispersion: function(questionDispersion){
    const result = {};
    for(const dimId in SCORING_CONFIG.maturityQuestions){
      const qIds = SCORING_CONFIG.maturityQuestions[dimId];
      const vals = qIds.map(function(qid){ return questionDispersion[qid-1]; });
      result[dimId] = round2(mean(vals));
    }
    return result;
  },
  rankQuestions: function(questionDispersion, n, mode){
    const items = questionDispersion.map(function(sd, idx){ return { q: idx+1, sd: sd }; });
    items.sort(function(a,b){ return mode==='top' ? a.sd-b.sd : b.sd-a.sd; });
    return items.slice(0, n);
  },
  buildFullAlignment: function(participants){
    const questionDispersion = this.computeQuestionDispersion(participants);
    const dimensionDispersion = this.computeDimensionDispersion(questionDispersion);
    const generalDispersion = round2(mean(Object.keys(dimensionDispersion).map(function(k){ return dimensionDispersion[k]; })));
    const dims = Object.keys(dimensionDispersion);
    let mostAligned = dims[0], mostDispersed = dims[0];
    dims.forEach(function(d){
      if(dimensionDispersion[d] < dimensionDispersion[mostAligned]) mostAligned = d;
      if(dimensionDispersion[d] > dimensionDispersion[mostDispersed]) mostDispersed = d;
    });
    // v1.6 — HONESTIDAD ESTADÍSTICA. Con una sola participación la desviación
    // estándar es 0 por definición matemática, no porque exista acuerdo. Con
    // dos, cualquier conclusión sobre alineación familiar es frágil. Antes el
    // reporte afirmaba "alta coincidencia entre los integrantes" con un solo
    // respondiente: convertía ausencia de datos en un hallazgo positivo.
    const finishedCount = participants.filter(function(p){ return ValidationEngine.isParticipantComplete(p.answers); }).length;
    const alignmentInterpretable = finishedCount >= SCORING_CONFIG.minParticipationsForAlignment;
    return {
      questionDispersion: questionDispersion,
      dimensionDispersion: dimensionDispersion,
      generalDispersion: generalDispersion,
      finishedCount: finishedCount,
      alignmentInterpretable: alignmentInterpretable,
      mostAlignedDimension: mostAligned,
      mostDispersedDimension: mostDispersed,
      topCoincidence: this.rankQuestions(questionDispersion, 3, 'top'),
      topDispersion: this.rankQuestions(questionDispersion, 3, 'bottom')
    };
  }
};

// ============================================================
// ItemStatsEngine — identifica, dentro de cada dimensión, qué afirmación
// es la más fuerte, cuál tiene mayor espacio de desarrollo, cuál es la
// intermedia y cuál concentra la mayor diferencia de percepción.
// selectDimensionHighlights() garantiza que ninguna afirmación se repita
// entre categorías y resuelve los empates de forma reproducible.
// ============================================================
const ItemStatsEngine = {
  // items: [{id, avg, sd}] — SOLO las afirmaciones de madurez de una dimensión.
  selectDimensionHighlights: function(items){
    const n = items.length;
    const strongCount = n >= 5 ? 2 : 1;
    const devCount = n >= 5 ? 2 : 1;

    // Fortaleza: promedio más alto; empate → menor dispersión; empate → id menor (reproducible).
    const byStrength = items.slice().sort(function(a,b){
      if(b.avg !== a.avg) return b.avg - a.avg;
      if(a.sd !== b.sd) return a.sd - b.sd;
      return a.id - b.id;
    });
    const strongest = byStrength.slice(0, strongCount).map(function(i){ return i.id; });

    // Desarrollo: promedio más bajo, entre lo que no quedó como fortaleza;
    // empate → mayor dispersión (la diferencia de percepción hace más prioritaria la conversación); empate → id menor.
    const remaining = items.filter(function(i){ return strongest.indexOf(i.id) === -1; });
    const byDevelopment = remaining.slice().sort(function(a,b){
      if(a.avg !== b.avg) return a.avg - b.avg;
      if(b.sd !== a.sd) return b.sd - a.sd;
      return a.id - b.id;
    });
    const developing = byDevelopment.slice(0, devCount).map(function(i){ return i.id; });

    // Intermedia: lo que sobra (siempre exactamente n - strongCount - devCount elementos).
    const middleItems = remaining.filter(function(i){ return developing.indexOf(i.id) === -1; });
    const middle = middleItems.length ? middleItems[0].id : null;

    // Mayor dispersión de toda la dimensión (puede coincidir o no con "developing").
    const byDispersion = items.slice().sort(function(a,b){
      if(b.sd !== a.sd) return b.sd - a.sd;
      return a.id - b.id;
    });
    const highestDispersion = byDispersion[0].id;

    return { strongest: strongest, developing: developing, middle: middle, highestDispersion: highestDispersion };
  },

  buildDimensionItemStats: function(questionAverages, questionDispersion){
    const result = {};
    for(const dimId in SCORING_CONFIG.maturityQuestions){
      const qIds = SCORING_CONFIG.maturityQuestions[dimId];
      const items = qIds.map(function(qid){ return { id: qid, avg: questionAverages[qid-1], sd: questionDispersion[qid-1] }; });
      const highlights = this.selectDimensionHighlights(items);
      result[dimId] = {
        topItem: { id: highlights.strongest[0], avg: questionAverages[highlights.strongest[0]-1] },
        bottomItem: { id: highlights.developing[highlights.developing.length-1], avg: questionAverages[highlights.developing[highlights.developing.length-1]-1] },
        mostDispersedItem: { id: highlights.highestDispersion, sd: questionDispersion[highlights.highestDispersion-1] },
        strongest: highlights.strongest,
        developing: highlights.developing,
        middle: highlights.middle,
        // Alias retenidos por compatibilidad con vistas existentes.
        topTwo: highlights.strongest,
        bottomTwo: highlights.developing
      };
    }
    return result;
  }
};


// ============================================================
// NarrativeEngine — construye la lectura ejecutiva a partir de reglas
// y del banco interpretativo por afirmación (ITEM_INTERPRETATIONS).
// v1.0: ya no existen señales especiales (A13/A14/A21). Cada párrafo
// responde a los reactivos reales (más alto, más bajo, más disperso)
// dentro de las cuatro dimensiones normalizadas a 0-100.
// ============================================================
const NarrativeEngine = (function(){

  const DIM_LABEL = {};
  QUESTIONNAIRE.dimensions.forEach(function(d){ DIM_LABEL[d.id] = d.name; });

  function strongestDimension(normalizedDimensionScores){
    let best = null;
    for(const d in normalizedDimensionScores){ if(best===null || normalizedDimensionScores[d] > normalizedDimensionScores[best]) best = d; }
    return best;
  }
  function weakestDimension(normalizedDimensionScores){
    let worst = null;
    for(const d in normalizedDimensionScores){ if(worst===null || normalizedDimensionScores[d] < normalizedDimensionScores[worst]) worst = d; }
    return worst;
  }
  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function generalReadingParagraph(generalIndex){
    const level = getMaturityLevel(generalIndex);
    if(level.id === 'consolidado'){
      return 'En conjunto, la familia muestra capacidades consolidadas: claramente definidas, aplicadas de manera consistente y reconocibles en la práctica. El reto a partir de aquí es sostener esta consistencia conforme aumenten el patrimonio, la complejidad y la participación de nuevas generaciones.';
    }
    if(level.id === 'estable'){
      return 'En conjunto, la familia muestra capacidades estables: se aplican habitualmente, aunque todavía presentan algunos vacíos. Cerrar esos vacíos puede marcar la diferencia conforme crezca la complejidad patrimonial.';
    }
    if(level.id === 'parcial'){
      return 'En conjunto, la familia muestra capacidades parciales: existen, pero se aplican de manera irregular o no todos las comprenden de la misma forma. Esto sugiere que la prioridad no es partir de cero, sino dar consistencia a lo que ya existe.';
    }
    if(level.id === 'incipiente'){
      return 'En conjunto, la familia muestra capacidades todavía incipientes: ocurren en algunos casos, pero dependen de personas o esfuerzos aislados. Formalizarlas puede reducir la dependencia de que una sola persona las sostenga.';
    }
    return 'En conjunto, la familia todavía no cuenta de forma reconocible con varias de estas capacidades. Esto no es un juicio sobre la familia, sino un punto de partida claro para decidir por dónde empezar.';
  }

  // v1.5 (sección 5.3): biblioteca de consecuencias por dimensión. Se nombran
  // consecuencias plausibles y proporcionales al nivel observado. NUNCA se
  // afirma destrucción de valor, conflicto o venta forzada como hecho.
  const CONSEQUENCE_LIBRARY = {
    relaciones: {
      alta: 'los desacuerdos tienden a evitarse, la confianza se erosiona sin que nadie lo declare y el desacuerdo termina trasladándose al terreno del gobierno',
      media: 'algunos temas se posponen y la conversación difícil llega más tarde de lo conveniente'
    },
    gobierno: {
      alta: 'las decisiones se demoran, la operación depende de personas clave, aparecen vetos informales y se pierden oportunidades por falta de un mecanismo claro',
      media: 'la coordinación funciona, pero descansa más en las personas que en reglas explícitas'
    },
    desarrollo: {
      alta: 'las decisiones de capital quedan inconexas entre sí, crece el costo de oportunidad y puede aparecer tensión de liquidez',
      media: 'las oportunidades se evalúan caso por caso, sin un criterio compartido que permita compararlas'
    },
    continuidad: {
      alta: 'los roles futuros permanecen ambiguos, la transferencia de conocimiento ocurre tarde y aumenta la fricción entre generaciones o ramas familiares',
      media: 'la preparación de las siguientes generaciones avanza, aunque sin una ruta explícita'
    }
  };

  // v1.5 (sección 5.1): P4 ya NO repite la capacidad de P2. Ahora nombra la
  // CONSECUENCIA de no atender la brecha — información nueva, no un eco.
  function riskReadingParagraph(normalizedDimensionScores, weakDim, weakLabel){
    const score = normalizedDimensionScores[weakDim];
    const severity = score < 50 ? 'alta' : 'media';
    const consequence = (CONSEQUENCE_LIBRARY[weakDim] || {})[severity] ||
      'la coordinación puede volverse más difícil conforme aumente la complejidad';
    // v1.5: P3 entra directo a la consecuencia. Antes abría nombrando otra vez
    // la misma dimensión que ya había nombrado P2, y se leía como insistencia.
    const lead = severity === 'alta'
      ? 'Mientras esa capacidad no esté instalada, '
      : 'Mientras esa base no se consolide, ';
    return lead + consequence + '. Esta dinámica suele sostenerse mientras la operación es simple, y exige más claridad conforme crecen el patrimonio y el número de participantes.';
  }

  function alignmentParagraph(dispersionLevel, mostDispersedItemInterp, mostDispersedItemId, alignment){
    // v1.6: con menos de tres participaciones no se afirma nivel de alineación.
    if(alignment && !alignment.alignmentInterpretable){
      const n = alignment.finishedCount;
      return 'Con ' + (n === 1 ? 'una sola participación finalizada' : n + ' participaciones finalizadas') +
             ' todavía no es posible interpretar el grado de coincidencia entre integrantes: se requieren al menos ' +
             SCORING_CONFIG.minParticipationsForAlignment + '. Los resultados de esta lectura reflejan ' +
             (n === 1 ? 'una perspectiva individual' : 'un número reducido de perspectivas') +
             ' y conviene completar las participaciones pendientes antes de tomar conclusiones sobre la percepción familiar.';
    }
    const base = INTERPRETATION_RULES.disclaimers.dispersionNote;
    if(dispersionLevel.id === 'diferencias_relevantes'){
      return 'Las diferencias de percepción más relevantes aparecen alrededor de la afirmación A' + mostDispersedItemId + ': ' +
        mostDispersedItemInterp.riskNarrative + '. ' + base;
    }
    if(dispersionLevel.id === 'coincidencia_moderada'){
      return 'Las percepciones muestran una coincidencia moderada: existe una base compartida, aunque la perspectiva sobre la afirmación A' + mostDispersedItemId + ' requiere una conversación más profunda — ' +
        mostDispersedItemInterp.riskNarrative + '. ' + base;
    }
    return 'Entre los integrantes existe alta coincidencia de percepción, lo que representa una base sólida para conversar sobre los temas identificados en esta lectura.';
  }

  // externalQuestionAverages: informativo únicamente — nunca modifica el índice,
  // las dimensiones, el radar, la matriz ni el nivel de madurez.
  // v1.5 (sección 5.4): el remate cierra con hallazgo, decisión y conversación
  // recomendada. Se eliminó la frase "de manera informativa y sin que esto
  // afecte la calificación", que enfriaba el cierre con higiene metodológica;
  // esa aclaración permanece en el módulo de Prioridad/Disposición y en
  // Metodología, donde sí corresponde.
  function closingParagraph(generalIndex, conversationQuestion, externalQuestionAverages, participantCount){
    const level = getMaturityLevel(generalIndex);
    const willingness = externalQuestionAverages ? externalQuestionAverages.willingnessToEngage : null;
    let willingnessNote = '';
    // v1.6: concordancia de número — con una sola participación el plural
    // "los participantes" era incorrecto y delataba generación automática.
    const single = participantCount === 1;
    if(willingness != null){
      if(willingness >= 4){
        willingnessNote = single
          ? ' La participación registrada muestra además una disposición favorable para avanzar.'
          : ' Los participantes muestran además una disposición favorable para avanzar.';
      } else if(willingness >= 2.5){
        willingnessNote = single
          ? ' La participación registrada muestra apertura para profundizar antes de definir un siguiente paso.'
          : ' Los participantes muestran apertura para profundizar antes de definir un siguiente paso.';
      }
    }
    // v1.5: el nivel enmarca al inicio y la PREGUNTA cierra. Antes la nota de
    // disposición quedaba después de la pregunta y apagaba el remate.
    return 'La familia se sitúa en un nivel ' + level.label.toLowerCase() + ' de madurez organizacional (' + generalIndex.toFixed(0) + ' de 100).' + willingnessNote +
           ' La decisión que sigue no es técnica sino de familia, y conviene abrirla con una pregunta concreta: «' + conversationQuestion + '»';
  }

  // dimensionScores: promedios crudos 1-5 (para identificar afirmaciones).
  // normalizedDimensionScores: 0-100 (para nivel general y comparaciones).
  // externalQuestionAverages: informativo, nunca altera el cálculo.
  function buildExecutiveNarrative(familyName, dimensionScores, normalizedDimensionScores, generalIndex, alignment, itemStats, externalQuestionAverages){
    const strong = strongestDimension(normalizedDimensionScores);
    const weak = weakestDimension(normalizedDimensionScores);
    const strongLabel = DIM_LABEL[strong];
    const weakLabel = DIM_LABEL[weak];

    const strongTopItem = itemStats[strong].topItem.id;
    const weakBottomItem = itemStats[weak].bottomItem.id;
    const strongInterp = ITEM_INTERPRETATIONS[strongTopItem];
    const weakInterp = ITEM_INTERPRETATIONS[weakBottomItem];

    let globalMostDispersed = 1;
    alignment.questionDispersion.forEach(function(sd, idx){
      if(sd > alignment.questionDispersion[globalMostDispersed-1]) globalMostDispersed = idx+1;
    });
    const dispersionLevel = getDispersionLevel(alignment.generalDispersion);

    // v1.5 (sección 10, página 2): la síntesis se reduce de seis a CUATRO
    // párrafos. Se fusionaron la lectura general con la fortaleza (antes P1+P3)
    // y la alineación con el remate (antes P5+P6), eliminando además el
    // "podría perder agilidad" que suavizaba la consecuencia hasta hacerla
    // irrelevante — esa consecuencia ahora la aporta P3 con datos concretos.
    // v1.6: si las percepciones están profundamente divididas, ESA es la lectura
    // principal y abre la síntesis. Antes P1 describía un nivel de madurez medio
    // —resultado del promedio— y la división aparecía hasta el último párrafo,
    // enterrando el hallazgo más importante del diagnóstico.
    const deeplyDivided = alignment.alignmentInterpretable !== false &&
                          dispersionLevel.id === 'diferencias_relevantes';
    const p1 = deeplyDivided
      ? ('El hallazgo principal de esta lectura no es el nivel promedio, sino que los integrantes no describen la misma realidad. ' +
         'El índice general (' + generalIndex.toFixed(0) + ' de 100) resulta de percepciones marcadamente distintas, no de una valoración compartida, ' +
         'por lo que conviene tratarlo como punto de partida para conversar y no como un diagnóstico consolidado.')
      : (generalReadingParagraph(generalIndex) + ' Su base más firme está en ' + strongLabel.toLowerCase() + ': ' +
         evidenceLead(itemStats[strong].topItem.average).toLowerCase() + ' ' + strongInterp.strengthNarrative + '.');

    // v1.6: si las cuatro dimensiones están prácticamente empatadas, no se
    // afirma que una sea "la de mayor brecha": esa elección vendría del orden
    // de desempate, no de los datos. Antes se presentaba ese artefacto como
    // hallazgo (por ejemplo con todas en 50, señalaba relaciones familiares).
    const dimValues = Object.keys(normalizedDimensionScores).map(function(d){ return normalizedDimensionScores[d]; });
    const spread = Math.max.apply(null, dimValues) - Math.min.apply(null, dimValues);
    const effectivelyTied = spread < 5;
    const p2 = effectivelyTied
      ? ('Las cuatro dimensiones se ubican en un nivel equivalente (entre ' + Math.min.apply(null, dimValues).toFixed(0) +
         ' y ' + Math.max.apply(null, dimValues).toFixed(0) + ' de 100), por lo que ninguna concentra la brecha de forma destacada. ' +
         'La prioridad no se define aquí por dimensión, sino por las afirmaciones concretas con mayor espacio de desarrollo y por el grado de coincidencia entre integrantes.')
      : ('La capacidad con mayor espacio de desarrollo es ' + weakLabel.toLowerCase() + '. Conviene ' +
         weakInterp.developmentNarrative + '.');

    // 3. Qué ocurre si no se atiende (consecuencia concreta, no genérica).
    const p3 = riskReadingParagraph(normalizedDimensionScores, weak, weakLabel);

    // 4. Qué tan compartida es la lectura y con qué pregunta conviene abrir.
    const alignmentText = alignmentParagraph(dispersionLevel, ITEM_INTERPRETATIONS[globalMostDispersed], globalMostDispersed, alignment);
    const priorityQuestion = weakInterp.conversationQuestion;
    const p4 = alignmentText + ' ' + closingParagraph(generalIndex, priorityQuestion, externalQuestionAverages, alignment.finishedCount);

    const ataGlance = {
      strength: strongInterp.fortalezaTitle,
      development: weakInterp.developmentTitle,
      opportunity: buildOpportunity(normalizedDimensionScores, alignment, itemStats, strong, weak, DIM_LABEL),
      conversation: weakInterp.conversationQuestion
    };

    return { paragraphs: [p1, p2, p3, p4], atAGlance: ataGlance };
  }

  // Interpretación condensada de una dimensión para la vista de Dimensiones.
  function dimensionInterpretation(dimId, normalizedScore, dispersionScore, itemStatsForDim){
    const level = getMaturityLevel(normalizedScore);
    const dispersionLevel = getDispersionLevel(dispersionScore);
    const topInterp = ITEM_INTERPRETATIONS[itemStatsForDim.topItem.id];
    const bottomInterp = ITEM_INTERPRETATIONS[itemStatsForDim.bottomItem.id];
    const dispersedInterp = ITEM_INTERPRETATIONS[itemStatsForDim.mostDispersedItem.id];
    return {
      score: normalizedScore, level: level, dispersion: dispersionScore, dispersionLevel: dispersionLevel,
      interpretation: 'Esta dimensión se encuentra en un nivel ' + level.label.toLowerCase() + '.',
      strengthTitle: topInterp.fortalezaTitle,
      strength: capitalize(topInterp.strengthNarrative) + '.',
      developTitle: bottomInterp.developmentTitle,
      develop: capitalize(bottomInterp.developmentNarrative) + '.',
      perceptionGap: capitalize(dispersedInterp.riskNarrative) + '.',
      topItemId: itemStatsForDim.topItem.id,
      bottomItemId: itemStatsForDim.bottomItem.id,
      mostDispersedItemId: itemStatsForDim.mostDispersedItem.id,
      question: bottomInterp.conversationQuestion
    };
  }

  // v1.6.1 (sección 9): elimina repeticiones en listas dinámicas antes de
  // imprimirlas. Antes podía aparecer "Continuidad y legado · Continuidad y
  // legado" cuando la dimensión más débil coincidía con la segunda.
  function uniqueLabels(items){ return Array.from(new Set(items.filter(Boolean))); }

  // v1.6.1 (sección 10): el lenguaje se condiciona al promedio real del
  // reactivo. Antes el sistema tomaba el reactivo más alto de una dimensión y
  // lo describía como capacidad instalada aunque su promedio fuera bajo.
  function evidenceLead(avg){
    // v1.6.11 (corrección gramatical): el encabezado se une a una oración
    // subordinada ("…la familia puede expresar desacuerdos…"), por lo que
    // requiere el nexo "que". Antes producía "se observa la familia puede…".
    if(avg == null) return 'Se observa que';
    if(avg < 2.5)  return 'No se observa todavía';
    if(avg < 3.0)  return 'Se observan señales parciales de';
    if(avg < 3.6)  return 'Existe de forma parcial';
    if(avg < 4.2)  return 'Se aplica habitualmente';
    return 'Está claramente instalada';
  }

  // ============================================================
  // v1.5 (sección 5.2): la oportunidad se DERIVA de los datos — combina la
  // dimensión más sólida, la más débil, la afirmación más débil y el nivel de
  // alineación. Antes era un texto fijo idéntico para cualquier familia.
  // Sección 5.5: si todo está alto, la propuesta no es "no hacer nada", sino
  // preservar, transferir y probar resiliencia ante mayor complejidad.
  function buildOpportunity(normalizedDimensionScores, alignment, itemStats, strongDim, weakDim, dimLabel){
    const allHigh = Object.keys(normalizedDimensionScores).every(function(d){ return normalizedDimensionScores[d] >= 60; });
    const highAlignment = alignment.generalDispersion < SCORING_CONFIG.relevantDispersionThreshold;
    const weakBottomInterp = ITEM_INTERPRETATIONS[itemStats[weakDim].bottomItem.id];
    const strongTopInterp = ITEM_INTERPRETATIONS[itemStats[strongDim].topItem.id];

    if(allHigh){
      return 'Preservar y transferir lo que ya funciona: convertir ' + strongTopInterp.fortalezaTitle.toLowerCase() +
             ' en un mecanismo que sobreviva a nuevas personas y a mayor complejidad, y probar su resistencia antes de que la transición lo exija.';
    }
    if(highAlignment){
      return 'Aprovechar ' + strongTopInterp.fortalezaTitle.toLowerCase() + ' como base para ' +
             weakBottomInterp.developmentNarrative + ', partiendo de una lectura que los integrantes ya comparten.';
    }
    return 'Convertir ' + strongTopInterp.fortalezaTitle.toLowerCase() + ' en una conversación que primero alinee las percepciones sobre ' +
           dimLabel[weakDim].toLowerCase() + ', antes de definir mecanismos que no todos interpretarían igual.';
  }

  // v1.4 (sección 7.1): generador centralizado de titulares ejecutivos.
  // Cada titular es una CONCLUSIÓN derivada de score + dispersión, no el
  // nombre de la sección. Breves, verificables y no sensacionalistas.
  // Nunca dice "la familia es..."; usa "los resultados", "la lectura", "se observa".
  // ============================================================
  function executiveHeadline(context){
    const score = context.score;                 // 0-100
    const dispersion = context.dispersion;        // desviación estándar
    const label = context.label || 'esta dimensión';
    const highDispersion = dispersion >= SCORING_CONFIG.relevantDispersionThreshold;

    if(score >= 60){
      return highDispersion
        ? 'Fortaleza aparente en ' + label.toLowerCase() + ', no igualmente reconocida'
        : 'Capacidad sólida y compartida en ' + label.toLowerCase();
    }
    if(score >= 40){
      // v1.5: variación por dimensión. Antes, dos dimensiones en el mismo rango
      // (56 y 58) producían titulares idénticos en páginas consecutivas, lo que
      // dejaba ver la plantilla. Cada dimensión tiene ahora su propio ángulo.
      if(highDispersion){
        return 'Existen prácticas en ' + label.toLowerCase() + ', pero no una experiencia común';
      }
      const partialByDim = {
        relaciones: 'La conversación funciona, aunque sin mecanismos que la sostengan',
        gobierno: 'Se decide, pero la claridad depende de las personas más que de las reglas',
        desarrollo: 'El patrimonio se administra; la búsqueda de valor aún no es sistemática',
        continuidad: 'La continuidad se reconoce como tema, sin una ruta todavía definida'
      };
      return partialByDim[context.dimId] || ('Capacidad parcial en ' + label.toLowerCase());
    }
    return 'Brecha estructural en ' + label.toLowerCase() + ': requiere definición y mecanismos';
  }

  // Titular ejecutivo para la síntesis general (página 2 del reporte).
  function overallHeadline(generalIndex, generalDispersion, strongLabel, weakLabel){
    const highDispersion = generalDispersion >= SCORING_CONFIG.relevantDispersionThreshold;
    if(generalIndex >= 60){
      return highDispersion
        ? 'Base sólida, con lecturas distintas entre los integrantes'
        : 'Capacidades consolidadas y reconocidas de forma consistente';
    }
    if(generalIndex >= 40){
      return highDispersion
        ? 'Capacidades parciales y percepciones divididas sobre su alcance'
        : 'Capacidades parciales: existe base, falta consistencia';
    }
    return 'Capacidades por construir: ' + weakLabel.toLowerCase() + ' concentra la mayor exposición';
  }

  // Expuesta para que el reporte reutilice exactamente la misma biblioteca.
  function consequenceFor(dimId, score){
    const severity = score < 50 ? 'alta' : 'media';
    return (CONSEQUENCE_LIBRARY[dimId] || {})[severity] ||
      'la coordinación puede volverse más difícil conforme aumente la complejidad';
  }

  return {
    buildExecutiveNarrative: buildExecutiveNarrative,
    consequenceFor: consequenceFor,
    dimensionInterpretation: dimensionInterpretation,
    executiveHeadline: executiveHeadline,
    overallHeadline: overallHeadline
  };
})();

// ============================================================
// RiskOpportunityEngine — matriz de cuatro cuadrantes, ÚNICA fuente de
// verdad compartida con la visualización (RISK_OPPORTUNITY_QUADRANTS).
// v1.0: fórmula estructural basada en las cuatro dimensiones (0-100) y
// la dispersión, sin señales especiales A13/A14. Las preguntas externas
// nunca participan en esta fórmula.
// ============================================================
const RiskOpportunityEngine = (function(){

  function computePosition(normalizedDimensionScores, generalIndex, alignment){
    const w = RISK_OPPORTUNITY_CONFIG;
    const overallGap = 1 - (generalIndex / 100);
    const governanceGap = 1 - (normalizedDimensionScores.gobierno / 100);
    const continuityGap = 1 - (normalizedDimensionScores.continuidad / 100);
    const developmentGap = 1 - (normalizedDimensionScores.desarrollo / 100);
    const relationsGap = 1 - (normalizedDimensionScores.relaciones / 100);
    // v1.6: si la alineación no es interpretable (menos de tres participaciones),
    // una dispersión de 0 no significa acuerdo. Usarla bajaría artificialmente el
    // riesgo estructural, así que se redistribuye su peso entre los demás
    // factores en vez de contarla como una señal favorable.
    const alignmentUsable = alignment.alignmentInterpretable !== false;
    const alignmentGap = alignmentUsable
      ? Math.min(1, alignment.generalDispersion / w.dispersionNormalizationCeiling)
      : null;

    let structuralRisk, developmentOpportunity;
    if(alignmentUsable){
      structuralRisk = overallGap * w.riskWeights.overallGap +
        governanceGap * w.riskWeights.governanceGap +
        continuityGap * w.riskWeights.continuityGap +
        alignmentGap * w.riskWeights.alignmentGap;
      developmentOpportunity = developmentGap * w.opportunityWeights.developmentGap +
        governanceGap * w.opportunityWeights.governanceGap +
        relationsGap * w.opportunityWeights.relationsGap +
        alignmentGap * w.opportunityWeights.alignmentGap;
    } else {
      // Se reescalan los pesos restantes para que sigan sumando 1.
      const rSum = w.riskWeights.overallGap + w.riskWeights.governanceGap + w.riskWeights.continuityGap;
      structuralRisk = (overallGap * w.riskWeights.overallGap +
        governanceGap * w.riskWeights.governanceGap +
        continuityGap * w.riskWeights.continuityGap) / rSum;
      const oSum = w.opportunityWeights.developmentGap + w.opportunityWeights.governanceGap + w.opportunityWeights.relationsGap;
      developmentOpportunity = (developmentGap * w.opportunityWeights.developmentGap +
        governanceGap * w.opportunityWeights.governanceGap +
        relationsGap * w.opportunityWeights.relationsGap) / oSum;
    }
    structuralRisk = Math.max(0, Math.min(1, structuralRisk));
    developmentOpportunity = Math.max(0, Math.min(1, developmentOpportunity));

    const x = developmentOpportunity, y = structuralRisk;
    let quadrant = getRiskOpportunityQuadrant(x, y);

    // ============================================================
    // v1.5 — REGLA DE ANULACIÓN (corrección de contradicción interna).
    // El promedio ponderado diluía una brecha severa en una sola dimensión:
    // una familia con continuidad en 37/100 (nivel Incipiente) podía caer en
    // "Consolidar" porque ambos ejes quedaban apenas por debajo de 50. El
    // reporte entonces recomendaba "preservar lo que hoy funciona" en la misma
    // página donde reconocía una brecha relevante, y contradecía a las páginas
    // de dimensión y de ruta.
    // Regla: ninguna familia con una dimensión por debajo de 40/100 puede
    // clasificarse como consolidada. Se reencuadra según dónde esté la brecha.
    // ============================================================
    const SEVERE_GAP_THRESHOLD = 40;
    const severeDims = Object.keys(normalizedDimensionScores).filter(function(d){
      return normalizedDimensionScores[d] < SEVERE_GAP_THRESHOLD;
    });
    let overrideNote = '';
    let mathQuadrant = quadrant;   // v1.6.1 (§7.1): la posición matemática NO se mueve
    let reframed = false;
    if(severeDims.length && quadrant.id === 'consolidar'){
      // Con una brecha severa, la respuesta no es preservar. Si además la
      // oportunidad de desarrollo pesa, corresponde desarrollar capacidades;
      // si el peso está en el riesgo, corresponde proteger y ordenar.
      const developmentDrivenGap = severeDims.indexOf('desarrollo') !== -1 || severeDims.indexOf('relaciones') !== -1;
      quadrant = developmentDrivenGap ? RISK_OPPORTUNITY_QUADRANTS.desarrollar : RISK_OPPORTUNITY_QUADRANTS.proteger;
      reframed = true;
      const dimLabels = {}; QUESTIONNAIRE.dimensions.forEach(function(d){ dimLabels[d.id]=d.name; });
      const names = severeDims.map(function(d){ return dimLabels[d].toLowerCase(); }).join(' y ');
      overrideNote = 'La posición matemática refleja la combinación de los ejes calculados. Sin embargo, la brecha severa en ' +
                     names + ' exige priorizar protección y orden antes de tratar la situación como consolidada.';
      InternalLogger.log('matrix-severe-gap-override', { dims: severeDims, from:'consolidar', to: quadrant.id });
    }

    const influences = [];
    if(developmentGap >= 0.5) influences.push('una brecha relevante en el desarrollo del patrimonio');
    if(governanceGap >= 0.5) influences.push('un gobierno y una toma de decisiones todavía poco consolidados');
    if(continuityGap >= 0.5) influences.push('una brecha relevante en continuidad y legado');
    if(relationsGap >= 0.5) influences.push('espacio de desarrollo en las relaciones familiares');
    if(alignmentUsable && alignmentGap >= 0.33) influences.push('diferencias de percepción entre integrantes que conviene explorar');
    if(!influences.length) influences.push('un panorama relativamente equilibrado entre riesgo y oportunidad');

    return {
      x: round2(x), y: round2(y),
      structuralRisk: round2(structuralRisk*100), developmentOpportunity: round2(developmentOpportunity*100),
      quadrant: quadrant,
      mathQuadrant: mathQuadrant,
      reframed: reframed,
      influences: influences,
      explanation: 'Esta posición se explica por ' + influences.join(', ') + '.' + (overrideNote ? ' ' + overrideNote : '')
    };
  }

  return { computePosition: computePosition };
})();

// ============================================================
// EvolutionEngine — ruta de evolución generada a partir de los datos
// (v1.0: sin señales especiales; se basa en las cuatro dimensiones 0-100)
// ============================================================
const EvolutionEngine = (function(){
  const DIM_LABEL = {};
  QUESTIONNAIRE.dimensions.forEach(function(d){ DIM_LABEL[d.id] = d.name; });

  // v1.1: ruta de tres fases (Alinear, Acordar, Institucionalizar) generada a
  // partir de los resultados reales de la familia — no es el mismo texto para
  // todas las familias. suggestedStart se determina por dispersión e índice.
  function buildRoute(normalizedDimensionScores, generalIndex, alignment, matrix){
    const strong = Object.keys(normalizedDimensionScores).reduce(function(b,d){ return normalizedDimensionScores[d]>normalizedDimensionScores[b]?d:b; });
    const weak = Object.keys(normalizedDimensionScores).reduce(function(w,d){ return normalizedDimensionScores[d]<normalizedDimensionScores[w]?d:w; });
    const secondWeak = Object.keys(normalizedDimensionScores).sort(function(a,b){ return normalizedDimensionScores[a]-normalizedDimensionScores[b]; })[1];
    const dispersionLevel = getDispersionLevel(alignment.generalDispersion);

    // v1.6.1 (sección 8): la fase ya no depende solo del índice general.
    // ALINEAR cuando no hay lectura compartida · ACORDAR cuando falta criterio
    // o la dimensión prioritaria no llega a Estable (60) · INSTITUCIONALIZAR
    // solo cuando esa dimensión alcanza al menos Estable con alineación
    // suficiente. Antes, una familia con una dimensión en 37 podía recibir
    // "institucionalizar" solo porque su promedio superaba 50.
    const priorityDimScore = normalizedDimensionScores[weak];
    let suggestedStart;
    if(dispersionLevel.id === 'diferencias_relevantes') suggestedStart = 'alinear';
    else if(priorityDimScore < 60) suggestedStart = 'acordar';
    else suggestedStart = 'institucionalizar';

    const alinear = {
      id:'alinear', title:'Alinear',
      objective: dispersionLevel.id === 'diferencias_relevantes'
        ? 'Comprender por qué existen percepciones distintas sobre ' + DIM_LABEL[weak].toLowerCase() + ' antes de definir acuerdos nuevos.'
        : 'Confirmar que todos los integrantes comparten la misma lectura sobre ' + DIM_LABEL[weak].toLowerCase() + ' antes de avanzar.',
      capabilities: [DIM_LABEL[weak], DIM_LABEL[secondWeak]],
      conversations: 'Qué observa cada integrante de forma distinta, y por qué.',
      outcome: 'Un entendimiento compartido de la situación actual, base para cualquier acuerdo posterior.'
    };
    const acordar = {
      id:'acordar', title:'Acordar',
      objective: 'Definir criterios y roles claros en ' + DIM_LABEL[weak].toLowerCase() + ' para que la coordinación deje de depender solo de la buena voluntad.',
